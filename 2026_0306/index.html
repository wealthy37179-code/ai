function md(s){var p=s.split("-");return +p[0]+"월 "+ +p[1]+"일";}
function rg(e){return e[1]===e[2]?md(e[1]):md(e[1])+" ~ "+md(e[2]);}
function base(u){return u.replace(/\([^)]*\)/,"").replace("국립","").replace("대학교","대").trim();}
var SH={};(function(){var m={};APPS.forEach(function(a){var b=base(a.u);(m[b]=m[b]||{})[a.u]=1;});
 APPS.forEach(function(a){var b=base(a.u);SH[a.u]=Object.keys(m[b]).length>1?b+(a.u.match(/\(([^)]*)\)/)||["",""])[0]:b;});})();
function conf(a,e){if(e[3]==="d")return " d";if(e[0]==="최종"&&e[1]==="12-18"&&e[3]!=="v")return " u";return "";}
function card(a,e,withDate){var k=TY[e[0]][0];var c=el("div","e "+k+conf(a,e)+(e[2]<TODAY?" p":""));
 var b=el("b",null,"["+(e[0]==="1단계"?"1단계 발표":TY[e[0]][1])+"] "+(withDate?"":a.n));c.appendChild(b);
 if(e[4])c.appendChild(el("span","t"," "+e[4]));
 c.appendChild(el("span","s",withDate?TY[e[0]][1]+" "+rg(e)+(e[4]?" "+e[4]:""):SH[a.u]+" "+a.d));
 c.title=a.n+" · "+a.u+" "+a.d+" · "+a.t;return c;}
var sel=document.getElementById("stu"),seen={};
APPS.forEach(function(a){if(!seen[a.n]){seen[a.n]=1;var o=el("option",null,sno(a)+" "+a.n);o.value=a.n;sel.appendChild(o);}});
function on(){var s={};document.querySelectorAll("#chips input").forEach(function(c){if(c.checked)s[c.value]=1;});return s;}
function key(m,d){return (m<10?"0":"")+m+"-"+(d<10?"0":"")+d;}
function calendar(out,list,T){
 var nav=el("div","nav"),pv=el("button","btn","<"),nx=el("button","btn",">");
 pv.setAttribute("aria-label","이전 달");nx.setAttribute("aria-label","다음 달");
 pv.disabled=MO<=10;nx.disabled=MO>=12;
 pv.onclick=function(){MO--;render();};nx.onclick=function(){MO++;render();};
 nav.appendChild(pv);nav.appendChild(el("h2",null,"2026년 "+MO+"월"));nav.appendChild(nx);out.appendChild(nav);
 var by={};list.forEach(function(a){a.e.forEach(function(e){if(!T[e[0]])return;var s=e[1].split("-"),f=e[2].split("-");
  for(var m=+s[0];m<=+f[0];m++){if(m!==MO)continue;var a1=+s[0]===m?+s[1]:1,z=+f[0]===m?+f[1]:31;for(var d=a1;d<=z;d++)(by[d]=by[d]||[]).push([a,e]);}});});
 var w=el("div","calw"),g=el("div","cal");DOW.forEach(function(x){g.appendChild(el("div","ch",x));});
 var first=new Date(2026,MO-1,1).getDay(),last=new Date(2026,MO,0).getDate();
 for(var i=0;i<first;i++)g.appendChild(el("div","cd off"));
 for(var d=1;d<=last;d++){var k=key(MO,d),dw=new Date(2026,MO-1,d).getDay();
  var c=el("div","cd"+(k===TODAY?" today":""));c.appendChild(el("span","dn"+(dw===0?" sun":dw===6?" sat":""),d));
  var its=(by[d]||[]).slice().sort(function(x,y){var o=["1단계","면접","실기","논술","최종"];return o.indexOf(x[1][0])-o.indexOf(y[1][0])||(x[0].n<y[0].n?-1:1);});
  var fin=its.filter(function(x){return x[1][0]==="최종";}),oth=its.filter(function(x){return x[1][0]!=="최종";});
  oth.forEach(function(x){c.appendChild(card(x[0],x[1]));});
  if(fin.length>6){var dt=el("details");dt.appendChild(el("summary",null,"최종 발표 "+fin.length+"건"));fin.forEach(function(x){dt.appendChild(card(x[0],x[1]));});c.appendChild(dt);}
  else fin.forEach(function(x){c.appendChild(card(x[0],x[1]));});
  g.appendChild(c);}
 w.appendChild(g);out.appendChild(w);}
function needs1(a){return a.s==="단계"&&!a.e.some(function(e){return e[0]==="1단계";})&&a.e.some(function(e){return e[0]==="면접"||e[0]==="실기";});}
function students(out,list,T){var cur=null,box;
 list.forEach(function(a){if(cur!==a.n){cur=a.n;box=el("section","stu");box.appendChild(el("h3",null,sno(a)+" "+a.n));out.appendChild(box);}
  var r=el("div","app");r.appendChild(el("div",null,a.u+" "+a.d));r.appendChild(el("div","s",a.t+" · "+(a.s==="단계"?"단계별전형":"일괄합산")));
  var row=el("div","row");a.e.forEach(function(e){if(T[e[0]])row.appendChild(card(a,e,true));});
  if(needs1(a)){row.appendChild(el("div","warn","1단계 발표일 확인 필요"));}
  if(!a.e.length)row.appendChild(el("div","warn","일정 미입력 · 입학처 확인 필요"));
  r.appendChild(row);if(a.note)r.appendChild(el("div","warn",a.note));box.appendChild(r);});}
function render(){var out=document.getElementById("out");out.textContent="";var T=on();
 var list=APPS.filter(function(a){return !sel.value||a.n===sel.value;});
 if(VIEW==="C")calendar(out,list,T);else students(out,list,T);}
document.querySelectorAll("#chips input").forEach(function(c){c.addEventListener("change",render);});
sel.addEventListener("change",render);
function setv(v){VIEW=v;document.getElementById("bC").setAttribute("aria-pressed",v==="C");document.getElementById("bS").setAttribute("aria-pressed",v==="S");render();}
document.getElementById("bC").onclick=function(){setv("C");};document.getElementById("bS").onclick=function(){setv("S");};
render();
</script>
</body>
</html>
