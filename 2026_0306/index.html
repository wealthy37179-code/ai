const E=[];const R=D.map((r,x)=>{const o={sid:+r[0],u:r[1],d:r[2],tr:r[3],m:r[5]||'',ev:[]};(r[4]||'').split(' ').filter(Boolean).forEach(k=>{const m=RE.exec(k);if(m)o.ev.push({r:o,t:m[1],a:m[2]+m[3],b:m[4]?m[4]+m[5]:'',tm:m[6]||'',f:m[7]})});o.ev.sort((p,q)=>p.a<q.a?-1:p.a>q.a?1:0);E.push(...o.ev);return o});
const NOW=new Date(),TD=NOW.getFullYear()>2026?9999:NOW.getFullYear()<2026?0:(NOW.getMonth()+1)*100+NOW.getDate();document.getElementById('cnt').textContent=Object.keys(N).length+'명 · 지원 '+R.length+'건';document.getElementById('td').textContent=NOW.getFullYear()+'-'+String(NOW.getMonth()+1).padStart(2,'0')+'-'+String(NOW.getDate()).padStart(2,'0');

const on={s:1,i:1,p:1,e:1,f:1};let mo=Math.min(12,Math.max(10,Math.floor(TD/100)||11)),sid=0,view=1;

const f0=new Date(2026,mo-1,1).getDay(),ld=new Date(2026,mo,0).getDate();let h='';for(let i=0;i<f0;i++)h+='<div class="dc o"></div>';
for(let d=1;d<=ld;d++){const k=String(mo).padStart(2,'0')+String(d).padStart(2,'0');const ev=E.filter(e=>e.a==k&&on[e.t]&&(!sid||e.r.sid==sid));const pa=mo*100+d<TD;
const big=ev.filter(e=>e.t=='f').length>12;const main=ev.filter(e=>big?e.t!='f':true).sort((a,b)=>'sipef'.indexOf(a.t)-'sipef'.indexOf(b.t)||N[a.r.sid].localeCompare(N[b.r.sid]));const fin=big?ev.filter(e=>e.t=='f'):[];
h+=`<div class="dc${mo*100+d==TD?' t':''}"><div class="dt">${d}</div>`+main.map(e=>`<div class="ev ${e.t}${e.f=='~'?' u1':''}${pa?' pa':''}"><b>[${T[e.t]}] ${N[e.r.sid]}</b>${e.tm?' '+e.tm:''}${e.b?' <b>~'+fm(e.b)+'</b>':''}<small>${e.r.u} ${e.r.d}</small></div>`).join('')+(fin.length?`<details><summary>최종 발표 ${fin.length}건${fin.some(e=>e.f=='*')?' (일부 미확인)':''}</summary>${fin.map(e=>`<div>${N[e.r.sid]} · ${e.r.u} ${e.r.d}${e.tm?' '+e.tm:''}${e.f=='*'?'*':''}</div>`).join('')}</details>`:'')+'</div>'}
