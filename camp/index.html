    <script>
        const lessons = {
            // [01. 파이썬 turtle 모듈]
            lesson1: {
                title: "01. turtle모듈",
                icon: "🐢",
                html: `
                    <h1 class="article-title">파이썬 turtle 모듈</h1>
                    <div class="article-intro">
                        turtle은 화면 속 거북이를 움직이며 선과 도형을 그릴 수 있는 파이썬 모듈입니다. 프로그램의 실행 흐름을 눈으로 확인하며 기초적인 움직임부터 시뮬레이션까지 학습합니다.
                    </div>

                    <h1 class="chapter-h1">🐢 [1차시] turtle 시작하기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> turtle은 화면 속 거북이를 움직이며 선과 도형을 그릴 수 있는 파이썬 모듈입니다. 명령을 내린 순서대로 거북이가 이동하기 때문에 프로그램의 실행 흐름을 눈으로 확인하기 좋습니다. 먼저 화면의 크기와 제목을 정하고 거북이의 모양, 속도, 선 색상을 바꾸어 turtle 프로그램의 기본 구조를 익힙니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
setup(<span class="code-num">700</span>, <span class="code-num">500</span>)
title(<span class="code-str">"나의 첫 turtle 프로그램"</span>)
bgcolor(<span class="code-str">"white"</span>)
shape(<span class="code-str">"turtle"</span>)
color(<span class="code-str">"navy"</span>)
speed(<span class="code-num">3</span>)
forward(<span class="code-num">150</span>)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>setup(700, 500)</code> : 그림을 그릴 도화지의 가로와 세로 크기를 정합니다.<br>
                        • <code>shape("turtle")</code> : 화면에서 움직이는 커서의 모양을 거북이로 설정합니다.<br>
                        • <code>forward(150)</code> : 거북이가 바라보는 방향으로 150만큼 앞으로 이동하며 선을 그립니다.<br>
                        • <code>done()</code> : 그림이 완성된 뒤 창이 바로 닫히지 않도록 turtle 실행을 유지합니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">⬜ [2차시] 이동과 회전</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> turtle에서 가장 기본적인 명령은 앞으로 이동하는 forward()와 방향을 바꾸는 left(), right()입니다. 거북이의 이동 거리와 회전 각도를 조합하면 여러 가지 도형을 만들 수 있습니다. 정사각형은 같은 길이의 선을 그리고 90도씩 방향을 바꾸는 동작을 네 번 반복하면 완성됩니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
setup(<span class="code-num">600</span>, <span class="code-num">600</span>)
shape(<span class="code-str">"turtle"</span>)
speed(<span class="code-num">2</span>)
forward(<span class="code-num">150</span>)
left(<span class="code-num">90</span>)
forward(<span class="code-num">150</span>)
left(<span class="code-num">90</span>)
forward(<span class="code-num">150</span>)
left(<span class="code-num">90</span>)
forward(<span class="code-num">150</span>)
left(<span class="code-num">90</span>)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>forward(150)</code> : 현재 바라보는 방향으로 150만큼 이동합니다.<br>
                        • <code>left(90)</code> : 현재 방향을 기준으로 왼쪽으로 90도 회전합니다.<br>
                        • <b>이동 + 회전</b> : 선분 하나를 그리고 방향을 바꾸는 과정을 반복하여 도형을 만듭니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🔄 [3차시] 반복문으로 도형 간단하게 만들기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 같은 명령을 여러 번 작성하면 코드가 길어지고 수정하기도 어렵습니다. for 반복문을 사용하면 같은 동작을 원하는 횟수만큼 반복할 수 있습니다. 정삼각형은 120도, 정사각형은 90도처럼 한 바퀴 360도를 변의 수로 나누어 회전 각도를 정할 수 있습니다. 이를 이용해 정다각형을 그려 봅니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
setup(<span class="code-num">600</span>, <span class="code-num">600</span>)
shape(<span class="code-str">"turtle"</span>)
speed(<span class="code-num">3</span>)
sides = <span class="code-num">6</span>
length = <span class="code-num">100</span>
angle = <span class="code-num">360</span> / sides
<span class="code-keyword">for</span> _ <span class="code-keyword">in</span> range(sides):
    forward(length)
    left(angle)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>sides = 6</code> : 그릴 도형의 변의 수를 정합니다. 6이면 정육각형이 됩니다.<br>
                        • <code>angle = 360 / sides</code> : 한 바퀴 360도를 변의 수로 나누어 매번 회전할 각도를 계산합니다.<br>
                        • <code>for _ in range(sides):</code> : 변의 수만큼 이동과 회전을 반복합니다. 반복 변수의 값이 필요 없을 때 _를 사용할 수 있습니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🎨 [4차시] 펜과 색상 다루기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> turtle은 선을 그리는 것뿐 아니라 펜의 굵기와 색상을 바꾸고 도형 내부를 색으로 채울 수도 있습니다. pensize()는 선의 굵기를, pencolor()는 선 색을 정합니다. begin_fill()과 end_fill() 사이에서 그린 닫힌 도형은 fillcolor()로 지정한 색으로 채워집니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
setup(<span class="code-num">600</span>, <span class="code-num">600</span>)
shape(<span class="code-str">"turtle"</span>)
speed(<span class="code-num">3</span>)
pensize(<span class="code-num">4</span>)
pencolor(<span class="code-str">"darkgreen"</span>)
fillcolor(<span class="code-str">"lightgreen"</span>)
begin_fill()
<span class="code-keyword">for</span> _ <span class="code-keyword">in</span> range(<span class="code-num">3</span>):
    forward(<span class="code-num">180</span>)
    left(<span class="code-num">120</span>)
end_fill()</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>pensize(4)</code> : 거북이가 그리는 선의 굵기를 4로 설정합니다.<br>
                        • <code>pencolor()</code> : 도형의 테두리에 사용할 선 색상을 지정합니다.<br>
                        • <code>fillcolor()</code> : 도형 내부를 채울 색상을 지정합니다.<br>
                        • <code>begin_fill() / end_fill()</code> : 두 명령 사이에서 그린 닫힌 영역을 지정한 색으로 채웁니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">📍 [5차시] 좌표와 펜 제어</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> turtle 화면의 가운데는 (0, 0) 좌표입니다. goto(x, y)를 사용하면 거북이를 원하는 좌표로 이동시킬 수 있습니다. 이때 이동하는 동안 선을 그리고 싶지 않다면 penup()으로 펜을 들고, 다시 그리기 시작할 때 pendown()으로 펜을 내립니다. 좌표를 이해하면 여러 도형을 원하는 위치에 배치할 수 있습니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
setup(<span class="code-num">700</span>, <span class="code-num">500</span>)
shape(<span class="code-str">"turtle"</span>)
speed(<span class="code-num">3</span>)
<span class="code-comment">#첫 번째 원</span>
penup()
goto(-<span class="code-num">150</span>, <span class="code-num">0</span>)
pendown()
circle(<span class="code-num">60</span>)
<span class="code-comment">#두 번째 원</span>
penup()
goto(<span class="code-num">100</span>, <span class="code-num">0</span>)
pendown()
circle(<span class="code-num">60</span>)
<span class="code-comment">#시작점으로 이동</span>
penup()
goto(<span class="code-num">0</span>, <span class="code-num">0</span>)
pendown()
dot(<span class="code-num">12</span>, <span class="code-str">"red"</span>)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>penup()</code> : 펜을 들어 이동 경로에 선이 그려지지 않게 합니다.<br>
                        • <code>goto(x, y)</code> : 현재 위치와 관계없이 지정한 좌표로 거북이를 이동시킵니다.<br>
                        • <code>pendown()</code> : 펜을 다시 내려 이후 이동부터 선이 그려지도록 합니다.<br>
                        • <code>circle(60)</code> : 반지름이 60인 원을 그립니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">⚙️ [6차시] 함수와 turtle</h1>

                    <div class="code-block-wrapper">

speed(<span class="code-num">5</span>)
<span class="code-comment">#정사각형을 그리는 함수</span>
<span class="code-keyword">def</span> <span class="code-def">draw_square</span>(x, y, size):
    penup()
    goto(x, y)
    pendown()
    <span class="code-keyword">for</span> _ <span class="code-keyword">in</span> range(<span class="code-num">4</span>):
        forward(size)
        left(<span class="code-num">90</span>)
<span class="code-comment">#위치와 크기를 바꾸어 함수 호출</span>
draw_square(-<span class="code-num">250</span>, -<span class="code-num">50</span>, <span class="code-num">80</span>)

                    <h1 class="chapter-h1" style="margin-top: 50px;">🌀 [7차시] 중첩 반복으로 패턴 만들기</h1>

bgcolor(<span class="code-str">"white"</span>)
speed(<span class="code-num">0</span>)
<span class="code-keyword">for</span> _ <span class="code-keyword">in</span> range(<span class="code-num">36</span>):
    <span class="code-comment">#정사각형 1개 그리기</span>

<span class="code-keyword">print</span>(<span class="code-str">"내림차순 새 리스트:"</span>, ranked)
<span class="code-keyword">print</span>(<span class="code-str">"정렬 전 원본:"</span>, scores)

scores.sort()
<span class="code-keyword">print</span>(<span class="code-str">"오름차순으로 바뀐 원본:"</span>, scores)</code></pre>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🧮 [7차시] 반복문으로 합계와 평균 구하기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 리스트의 원소를 for 반복문으로 하나씩 꺼내면 같은 처리를 모든 자료에 적용할 수 있습니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>populations = [<span class="code-num">18000</span>, <span class="code-num">32000</span>, <span class="code-num">25000</span>, <span class="code-num">15000</span>]
total = <span class="code-num">0</span>
<span class="code-keyword">for</span> population <span class="code-keyword">in</span> populations:
    total = total + population

<span class="code-keyword">print</span>(<span class="code-str">"직접 계산한 합계:"</span>, total)
<span class="code-keyword">print</span>(<span class="code-str">"sum으로 구한 합계:"</span>, sum(populations))

<span class="code-keyword">if</span> len(populations) > <span class="code-num">0</span>:
    average = total / len(populations)
    <span class="code-keyword">print</span>(<span class="code-str">"평균 인구:"</span>, average)
    <span class="code-keyword">print</span>(<span class="code-str">"최대 인구:"</span>, max(populations))</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>total = 0</code> : 반복문 밖에서 누적 변수를 초기화합니다. 반복문 안에서 0으로 만들면 이전 합계가 지워집니다.<br>
                        • <b>빈 리스트 확인</b> : 자료가 없을 때 길이로 나누면 오류가 납니다. max도 빈 자료에는 바로 사용할 수 없습니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">⚡ [8차시] 조건에 맞는 자료와 리스트 컴프리헨션</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 분석에서는 전체 자료 중 조건에 맞는 값만 골라야 할 때가 많습니다. 반복문과 조건문으로 새 리스트를 만들 수 단 짧은 처리라면 리스트 컴프리헨션으로 표현할 수 있습니다.</p>

                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>scores = [<span class="code-num">65</span>, <span class="code-num">82</span>, <span class="code-num">90</span>, <span class="code-num">73</span>, <span class="code-num">88</span>]

    <span class="code-keyword">if</span> score >= <span class="code-num">80</span>:
        high_scores.append(score)

compact_scores = [s <span class="code-keyword">for</span> s <span class="code-keyword">in</span> scores <span class="code-keyword">if</span> s >= <span class="code-num">80</span>]
adjusted_scores = [min(s + <span class="code-num">5</span>, <span class="code-num">100</span>) <span class="code-keyword">for</span> s <span class="code-keyword">in</span> scores]

<span class="code-keyword">print</span>(<span class="code-str">"반복문으로 추출:"</span>, high_scores)
<span class="code-keyword">print</span>(<span class="code-str">"컴프리헨션으로 추출:"</span>, compact_scores)
<span class="code-keyword">print</span>(<span class="code-str">"5점 보정 결과:"</span>, adjusted_scores)</code></pre>

                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">⚙️ [5차시] 기본값(Default) 매개변수의 적용</h1>
                    <p class="section-desc"><b>핵심 개념 상세 설명:</b> 매번 동일한 값을 전달해야 하는 번거로움을 줄이기 위해 함수 정의 시 매개변수에 기본값을 미리 설정해 둘 수 있습니다. 호출할 때 값을 생략하면 이 기본값이 작동하며 새로운 값을 전달하면 기본값을 무시하고 덮어씁니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">def</span> <span class="code-def">report_activity</span>(name, club=<span class="code-str">"데이터마이닝"</span>):
    <span class="code-keyword">print</span>(<span class="code-str">"이름:"</span>, name)
    <span class="code-keyword">print</span>(<span class="code-str">"소속 동아리:"</span>, club)
    <span class="code-keyword">print</span>(<span class="code-str">"-"</span> * <span class="code-num">20</span>)

<span class="code-comment"># 두 번째 인수를 생략하여 기본값 적용</span>
report_activity(<span class="code-str">"김학생"</span>)
report_activity(<span class="code-str">"이학생"</span>)

<span class="code-comment"># 두 번째 인수에 새로운 값을 전달하여 기본값 덮어쓰기</span>
report_activity(<span class="code-str">"박학생"</span>, <span class="code-str">"로봇공학"</span>)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>club="데이터마이닝"</code> : 함수를 만들 때 기본 소속을 데이터마이닝으로 고정해 두었습니다.<br>
                        • <code>report_activity("김학생")</code> : club 자리에 아무것도 넣지 않았으므로 파이썬이 알아서 데이터마이닝을 출력합니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🏠 [6차시] 지역 변수와 전역 변수의 이해</h1>
                    <p class="section-desc"><b>핵심 개념 상세 설명:</b> 함수 안에서 새롭게 만들어진 변수는 지역 변수라 불리며 함수가 종료되면 메모리에서 완전히 사라집니다. 반면 함수 밖에서 만들어진 변수는 전역 변수로 프로그램 전체에서 읽을 수 있습니다. 변수의 생명 주기와 유효 범위를 이해하는 것은 논리 오류를 막는 핵심입니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>base_population = <span class="code-num">380000</span> <span class="code-comment"># 전역 변수</span>

<span class="code-keyword">def</span> <span class="code-def">add_new_residents</span>(new_people):
    <span class="code-comment"># 함수 안에서 생성된 지역 변수 added</span>
    added = base_population + new_people
    <span class="code-keyword">print</span>(<span class="code-str">"새로운 인구 유입 후 계산 결과:"</span>, added)

add_new_residents(<span class="code-num">5000</span>)
<span class="code-keyword">print</span>(<span class="code-str">"원래 기준 인구수:"</span>, base_population)
<span class="code-comment"># print(added) # 주석을 풀면 NameError가 발생합니다. 함수가 끝나면 added는 사라집니다.</span></code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>base_population</code> : 함수 외부 최상단에 선언되었으므로 함수 내부에서도 접근하여 사용할 수 있는 전역 변수입니다.<br>
                        • <code>added</code> : 함수 내부에서 태어난 지역 변수이므로 밖에서 출력하려 하면 정의되지 않았다는 NameError가 발생합니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">⚖️ [7차시] 함수와 조건문(if)의 결합</h1>
                    <p class="section-desc"><b>핵심 개념 상세 설명:</b> 입력받은 매개변수의 값을 if 조건문으로 검사하여 참(True) 또는 거짓(False)을 반환하는 판별 함수를 만들 수 있습니다. 데이터의 유효성을 검사하거나 조건에 따른 처리를 모듈화할 때 매우 유용합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">def</span> <span class="code-def">is_effective_ppl</span>(score):
    <span class="code-comment"># 점수가 80점 이상이면 광고 효과가 높다고 판별</span>
    <span class="code-keyword">if</span> score >= <span class="code-num">80</span>:
        <span class="code-keyword">return</span> <span class="code-keyword">True</span>
    <span class="code-keyword">else</span>:
        <span class="code-keyword">return</span> <span class="code-keyword">False</span>

<span class="code-comment"># 메인 코드에서 함수 활용</span>
current_score = <span class="code-num">85</span>
<span class="code-keyword">if</span> is_effective_ppl(current_score):
    <span class="code-keyword">print</span>(<span class="code-str">"광고 효과가 훌륭합니다. 캠페인을 유지하세요."</span>)
<span class="code-keyword">else</span>:
    <span class="code-keyword">print</span>(<span class="code-str">"광고 효과가 부족합니다. 매체를 변경하세요."</span>)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>if score >= 80:</code> : 외부에서 전달받은 점수를 기준으로 내부에서 조건을 판별합니다.<br>
                        • <code>return True</code> : 연산 결과에 따라 불리언(Boolean) 값을 반환하므로 메인 코드의 if문 조건식에 직관적으로 결합할 수 있습니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🔄 [8차시] 함수와 반복문(for)의 결합</h1>
                    <p class="section-desc"><b>핵심 개념 상세 설명:</b> 여러 개의 데이터가 담긴 파이썬 리스트를 함수의 매개변수로 한 번에 넘겨줄 수 있습니다. 함수 내부의 for 반복문을 통해 리스트 원소를 하나씩 꺼내어 누적 합계를 구하거나 평균을 계산하는 등 대량의 데이터를 손쉽게 다룹니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">def</span> <span class="code-def">calculate_total_population</span>(pop_list):
    total = <span class="code-num">0</span>
    <span class="code-keyword">for</span> pop <span class="code-keyword">in</span> pop_list:
        total = total + pop
    <span class="code-keyword">return</span> total

<span class="code-comment"># 4개 행정동의 인구 데이터 리스트</span>
district_populations = [<span class="code-num">18000</span>, <span class="code-num">32000</span>, <span class="code-num">25000</span>, <span class="code-num">15000</span>]

<span class="code-comment"># 리스트를 통째로 함수에 전달</span>
total_pop = calculate_total_population(district_populations)
<span class="code-keyword">print</span>(<span class="code-str">"행정동 전체 누적 인구수:"</span>, total_pop, <span class="code-str">"명"</span>)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>for pop in pop_list:</code> : 전달받은 리스트에서 데이터를 순차적으로 하나씩 꺼내어 반복문을 실행합니다.<br>
                        • <code>total = total + pop</code> : 초기값이 0인 total 변수에 꺼낸 인구수를 계속해서 누적 합산합니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🔗 [9차시] 다중 함수의 파이프라인 연결</h1>
                    <p class="section-desc"><b>핵심 개념 상세 설명:</b> 복잡한 코드를 하나의 거대한 함수에 몰아넣기보다는 역할이 하나로 분명한 여러 개의 작은 함수로 나누어 설계하는 것이 좋습니다. 한 함수가 연산하여 반환한 결과값을 다음 함수의 입력으로 전달하며 협업하는 구조를 익힙니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-comment"># 1단계: 평균을 구하는 전문 함수</span>
<span class="code-keyword">def</span> <span class="code-def">get_average</span>(scores):
    <span class="code-keyword">return</span> sum(scores) / len(scores)

<span class="code-comment"># 2단계: 평균을 받아 등급을 매기는 전문 함수</span>
<span class="code-keyword">def</span> <span class="code-def">rate_effectiveness</span>(avg_score):
    <span class="code-keyword">if</span> avg_score >= <span class="code-num">80</span>:
        <span class="code-keyword">return</span> <span class="code-str">"우수"</span>
    <span class="code-keyword">elif</span> avg_score >= <span class="code-num">60</span>:
        <span class="code-keyword">return</span> <span class="code-str">"보통"</span>
    <span class="code-keyword">else</span>:
        <span class="code-keyword">return</span> <span class="code-str">"미흡"</span>

ppl_scores = [<span class="code-num">88</span>, <span class="code-num">92</span>, <span class="code-num">75</span>, <span class="code-num">80</span>]

<span class="code-comment"># 함수들의 파이프라인 협업</span>
average_val = get_average(ppl_scores)
final_rating = rate_effectiveness(average_val)

<span class="code-keyword">print</span>(<span class="code-str">"평균 인지도:"</span>, average_val)
<span class="code-keyword">print</span>(<span class="code-str">"최종 광고 등급:"</span>, final_rating)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>get_average</code> / <code>rate_effectiveness</code> : 계산 기능과 판별 기능을 분리하여 코드를 수정하고 디버깅하기 훨씬 수월하게 설계했습니다.<br>
                        • <code>rate_effectiveness(average_val)</code> : get_average가 계산해 낸 결과값을 변수에 잠시 담아둔 뒤 이를 그대로 다음 함수의 매개변수로 넘겨줍니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🏆 [10차시] 종합 미니 프로젝트 - 데이터 분석 리포트 완성</h1>
                    <p class="section-desc"><b>핵심 개념 상세 설명:</b> 지금까지 배운 매개변수, 반환값, 조건문, 반복문, 함수 연결의 모든 개념을 조립하여 독립적인 기능을 수행하는 데이터 분석 미니 프로그램을 완성합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">def</span> <span class="code-def">calc_avg</span>(data_list):
    <span class="code-keyword">return</span> sum(data_list) / len(data_list)

<span class="code-keyword">def</span> <span class="code-def">judge_trend</span>(avg):
    <span class="code-keyword">if</span> avg >= <span class="code-num">80</span>:
        <span class="code-keyword">return</span> <span class="code-str">"상승세 뚜렷"</span>
    <span class="code-keyword">elif</span> avg >= <span class="code-num">60</span>:
        <span class="code-keyword">return</span> <span class="code-str">"유지 중"</span>
    <span class="code-keyword">else</span>:
        <span class="code-keyword">return</span> <span class="code-str">"하락세 주의"</span>

<span class="code-keyword">def</span> <span class="code-def">generate_report</span>(brand_name, recent_data):
    <span class="code-comment"># 앞서 만든 부품 함수들을 활용</span>
    average = calc_avg(recent_data)
    trend = judge_trend(average)
    
    <span class="code-keyword">print</span>(<span class="code-str">"="</span> * <span class="code-num">30</span>)
    <span class="code-keyword">print</span>(<span class="code-str">"브랜드명:"</span>, brand_name)
    <span class="code-keyword">print</span>(<span class="code-str">"최근 데이터 평균치:"</span>, round(average, <span class="code-num">1</span>))
    <span class="code-keyword">print</span>(<span class="code-str">"현재 분석 트렌드:"</span>, trend)
    <span class="code-keyword">print</span>(<span class="code-str">"="</span> * <span class="code-num">30</span>)

<span class="code-comment"># --- 메인 실행 제어부 ---</span>
target_brand = <span class="code-str">"세종푸드"</span>
collected_data = [<span class="code-num">82</span>, <span class="code-num">85</span>, <span class="code-num">78</span>, <span class="code-num">90</span>, <span class="code-num">88</span>]

<span class="code-comment"># 함수 단 하나만 호출하여 전체 분석 및 출력 로직을 수행</span>
generate_report(target_brand, collected_data)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <b>부품 함수 분리</b> : 수학적 계산과 조건 판별을 각각 <code>calc_avg</code>와 <code>judge_trend</code>로 독립시켰습니다.<br>
                        • <code>generate_report</code> : 마치 오케스트라의 지휘자처럼 부품 함수들을 호출해 결과를 취합하고 최종 화면 출력을 관장합니다.<br>
                        • <b>메인 실행부의 간결함</b> : 데이터를 모아서 지휘자 함수 하나만 호출하면 모든 과정이 깔끔하게 처리되는 모듈화의 장점을 극대화했습니다.
                    </div>
                `
            },

            // [04. 딕셔너리]

                    <h1 class="article-title">파이썬 딕셔너리(Dictionary)</h1>
                    <div class="article-intro">
                        데이터를 키(Key)와 값(Value)의 쌍으로 저장하여, 직관적이고 효율적으로 데이터를 관리하고 검색하는 딕셔너리 자료형의 모든 것을 배웁니다.
                    </div>

                    <h1 class="chapter-h1">🏷️ [1차시] 키와 값으로 데이터 저장하기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 리스트가 위치를 기준으로 값을 찾는다면 딕셔너리는 이름표인 키로 값을 찾습니다. 중괄호 안에 키와 값을 콜론으로 연결하여 저장합니다. 한 지역의 이름, 인구, 면적을 하나의 딕셔너리로 묶어 의미가 분명한 자료를 만듭니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>district = {
    <span class="code-str">"name"</span>: <span class="code-str">"한솔동"</span>,
    <span class="code-str">"population"</span>: <span class="code-num">18000</span>,
    <span class="code-str">"area"</span>: <span class="code-num">2.8</span>
}

<span class="code-keyword">print</span>(<span class="code-str">"전체 지역 정보:"</span>, district)
<span class="code-keyword">print</span>(<span class="code-str">"지역 이름:"</span>, district[<span class="code-str">"name"</span>])
<span class="code-keyword">print</span>(<span class="code-str">"인구:"</span>, district[<span class="code-str">"population"</span>])
<span class="code-keyword">print</span>(<span class="code-str">"정보 항목 수:"</span>, len(district))</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <b>키: 값</b> : name은 키이고 한솔동은 값입니다. 문자열 키는 따옴표로 표시합니다.<br>
                        • <code>district["population"]</code> : 인덱스 대신 키를 사용해 인구 18000을 가져옵니다.<br>
                        • <code>len(district)</code> : 키와 값의 쌍을 세므로 결과는 3입니다. 같은 키를 중복 작성하면 뒤의 값이 앞의 값을 덮어씁니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🛡️ [2차시] 안전한 조회와 키 존재 확인</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 자료마다 모든 항목이 들어 있는 것은 아닙니다. 존재하지 않는 키를 대괄호로 조회하면 KeyError가 발생합니다. get은 키가 없을 때 사용할 기본값을 지정할 수 있고 in은 키의 존재 여부를 확인합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>district = {<span class="code-str">"name"</span>: <span class="code-str">"한솔동"</span>, <span class="code-str">"population"</span>: <span class="code-num">18000</span>}

<span class="code-keyword">print</span>(<span class="code-str">"지역:"</span>, district.get(<span class="code-str">"name"</span>))
<span class="code-keyword">print</span>(<span class="code-str">"면적:"</span>, district.get(<span class="code-str">"area"</span>, <span class="code-str">"미조사"</span>))
<span class="code-keyword">print</span>(<span class="code-str">"별도 기본값이 없을 때:"</span>, district.get(<span class="code-str">"school"</span>))

<span class="code-keyword">if</span> <span class="code-str">"population"</span> <span class="code-keyword">in</span> district:
    <span class="code-keyword">print</span>(<span class="code-str">"인구 자료가 있습니다."</span>)

<span class="code-keyword">print</span>(<span class="code-str">"한솔동이 키인가요?"</span>, <span class="code-str">"한솔동"</span> <span class="code-keyword">in</span> district)
<span class="code-keyword">print</span>(<span class="code-str">"한솔동이 값인가요?"</span>, <span class="code-str">"한솔동"</span> <span class="code-keyword">in</span> district.values())</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>get(키, 기본값)</code> : area가 없으므로 미조사를 반환합니다. 기본값을 생략한 없는 키의 결과는 None입니다.<br>
                        • <code>in district</code> : 값이 아니라 키를 검사합니다. population은 키이므로 조건이 참입니다.<br>
                        • <code>values()</code> : 딕셔너리에 담긴 값들을 살펴봅니다. 한솔동이 값으로 있는지 확인하면 True가 나옵니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">📝 [3차시] 항목 추가와 값 수정</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 딕셔너리의 키에 값을 대입하면 새 키는 추가되고 기존 키는 수정됩니다. 여러 항목을 한 번에 반영하려면 update를 사용합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>district = {<span class="code-str">"name"</span>: <span class="code-str">"한솔동"</span>, <span class="code-str">"population"</span>: <span class="code-num">18000</span>}

district[<span class="code-str">"year"</span>] = <span class="code-num">2025</span>
district[<span class="code-str">"population"</span>] = <span class="code-num">18500</span>
<span class="code-keyword">print</span>(<span class="code-str">"추가와 수정:"</span>, district)

district.update({<span class="code-str">"population"</span>: <span class="code-num">19000</span>, <span class="code-str">"schools"</span>: <span class="code-num">4</span>})
<span class="code-keyword">print</span>(<span class="code-str">"여러 항목 반영:"</span>, district)
<span class="code-keyword">print</span>(<span class="code-str">"최종 인구:"</span>, district[<span class="code-str">"population"</span>])
<span class="code-keyword">print</span>(<span class="code-str">"전체 항목 수:"</span>, len(district))</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <b>새 키에 대입</b> : year는 없던 키이므로 새 항목이 생깁니다. 키의 순서는 삽입 순서를 따릅니다.<br>
                        • <b>기존 키에 대입</b> : population의 값이 바뀔 뿐 같은 이름의 항목이 추가되지는 않습니다.<br>
                        • <code>update</code> : 기존 population은 19000으로 바꾸고 schools는 새로 추가합니다. 최종 항목 수는 4입니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🧹 [4차시] 항목 삭제와 기본값 등록</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 불필요한 항목을 없앨 때 pop은 삭제한 값을 돌려주고 del은 지정한 항목을 삭제합니다. 반대로 setdefault는 키가 없을 때만 기본값을 등록합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>record = {<span class="code-str">"brand"</span>: <span class="code-str">"세종우유"</span>, <span class="code-str">"score"</span>: <span class="code-num">85</span>, <span class="code-str">"memo"</span>: <span class="code-str">"임시"</span>}

removed = record.pop(<span class="code-str">"memo"</span>, <span class="code-str">"없음"</span>)
<span class="code-keyword">print</span>(<span class="code-str">"삭제한 메모:"</span>, removed)
<span class="code-keyword">print</span>(<span class="code-str">"없는 항목 삭제:"</span>, record.pop(<span class="code-str">"phone"</span>, <span class="code-str">"없음"</span>))

record.setdefault(<span class="code-str">"responses"</span>, <span class="code-num">0</span>)
record.setdefault(<span class="code-str">"score"</span>, <span class="code-num">0</span>)

<span class="code-keyword">del</span> record[<span class="code-str">"brand"</span>]
<span class="code-keyword">print</span>(<span class="code-str">"정리한 자료:"</span>, record)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>pop(키, 기본값)</code> : memo를 삭제하면서 임시를 반환합니다. 없는 phone은 기본값 없음을 반환하므로 오류가 나지 않습니다.<br>
                        • <code>setdefault</code> : responses가 없어서 0을 저장합니다. score는 이미 있으므로 85를 유지합니다.<br>
                        • <code>del record["brand"]</code> : brand 항목을 삭제합니다. 없는 키를 del로 삭제하면 오류가 납니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🔄 [5차시] keys, values, items와 반복문</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 여러 지역을 한 번에 살펴보려면 딕셔너리의 키와 값을 순회해야 합니다. keys는 키, values는 값, items는 키와 값의 쌍을 제공합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>populations = {<span class="code-str">"한솔동"</span>: <span class="code-num">18000</span>, <span class="code-str">"보람동"</span>: <span class="code-num">32000</span>, <span class="code-str">"새롬동"</span>: <span class="code-num">25000</span>}

<span class="code-keyword">print</span>(<span class="code-str">"지역 목록:"</span>, list(populations.keys()))
<span class="code-keyword">print</span>(<span class="code-str">"인구 목록:"</span>, list(populations.values()))

total = <span class="code-num">0</span>
<span class="code-keyword">for</span> name, population <span class="code-keyword">in</span> populations.items():
    <span class="code-keyword">print</span>(name, <span class="code-str">":"</span>, population, <span class="code-str">"명"</span>)
    total = total + population

<span class="code-keyword">print</span>(<span class="code-str">"전체 인구:"</span>, total)
<span class="code-keyword">print</span>(<span class="code-str">"내장 함수 합계:"</span>, sum(populations.values()))</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>keys</code>와 <code>values</code> : 키 또는 값만 골라 볼 수 있습니다. list로 변환하면 리스트 형태로 출력됩니다.<br>
                        • <code>for name, population in populations.items():</code> : 각 쌍의 키를 name에, 값을 population에 나누어 저장합니다.<br>
                        • <b>합계 계산</b> : 세 지역의 합계는 75,000입니다. 딕셔너리를 직접 반복하면 기본적으로 키가 나온다는 점에 주의합니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">📈 [6차시] get을 활용한 빈도 집계</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 같은 응답이 몇 번 나왔는지 집계할 때 딕셔너리가 유용합니다. 응답 내용을 키로 삼고 횟수를 값으로 저장합니다. 처음 나온 응답은 0에서 시작하고 이미 나온 응답은 기존 횟수에 1을 더하는 방식으로 선호 브랜드를 집계합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>responses = [<span class="code-str">"세종우유"</span>, <span class="code-str">"한솔제과"</span>, <span class="code-str">"세종우유"</span>, <span class="code-str">"세종푸드"</span>, <span class="code-str">"한솔제과"</span>, <span class="code-str">"세종우유"</span>]
counts = {}

<span class="code-keyword">for</span> brand <span class="code-keyword">in</span> responses:
    counts[brand] = counts.get(brand, <span class="code-num">0</span>) + <span class="code-num">1</span>

<span class="code-keyword">print</span>(<span class="code-str">"브랜드별 응답 수:"</span>, counts)

<span class="code-keyword">for</span> brand, count <span class="code-keyword">in</span> counts.items():
    ratio = count / len(responses) * <span class="code-num">100</span>
    <span class="code-keyword">print</span>(brand, count, <span class="code-str">"명"</span>, round(ratio, <span class="code-num">1</span>), <span class="code-str">"%"</span>)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <b>빈 딕셔너리</b> : 집계를 시작하기 전에는 어떤 브랜드가 나올지 몰라도 됩니다. 발견한 브랜드를 차례로 추가합니다.<br>
                        • <code>get(brand, 0) + 1</code> : 처음 나온 브랜드는 0+1, 다시 나온 브랜드는 기존 횟수 + 1이 저장됩니다.<br>
                        • <b>빈도와 비율</b> : 전체 응답 수 6으로 나누어 비율을 구합니다.
                    </div>

                        <b>🔍 코드 톺아보기</b><br>
                        • <code>df.info()</code> : 자료형과 Non-Null Count를 확인합니다.<br>
                        • <code>describe()</code> : count, mean, std, min, 사분위수, max를 보여줍니다. score의 유효 개수는 3이고 평균은 80입니다.<br>
                        • <code>isna().sum()</code> : 누락 여부를 True/False로 표시한 뒤 열별로 합산합니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🎯 [4차시] 열 선택과 loc iloc 이해하기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> DataFrame에서 필요한 부분을 고를 때는 이름표로 선택하는 loc와 정수 위치로 선택하는 iloc를 구분해야 합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">import</span> pandas <span class="code-keyword">as</span> pd

df = pd.DataFrame({
    <span class="code-str">"brand"</span>: [<span class="code-str">"세종우유"</span>, <span class="code-str">"한솔제과"</span>, <span class="code-str">"세종푸드"</span>],
    <span class="code-str">"score"</span>: [<span class="code-num">82</span>, <span class="code-num">75</span>, <span class="code-num">90</span>],
    <span class="code-str">"responses"</span>: [<span class="code-num">20</span>, <span class="code-num">18</span>, <span class="code-num">25</span>]
}, index=[<span class="code-str">"a"</span>, <span class="code-str">"b"</span>, <span class="code-str">"c"</span>])

<span class="code-keyword">print</span>(df[<span class="code-str">"score"</span>])
<span class="code-keyword">print</span>(df[[<span class="code-str">"brand"</span>, <span class="code-str">"score"</span>]])

<span class="code-keyword">print</span>(<span class="code-str">"이름표로 선택:"</span>)
<span class="code-keyword">print</span>(df.loc[<span class="code-str">"a"</span>:<span class="code-str">"b"</span>, [<span class="code-str">"brand"</span>, <span class="code-str">"score"</span>]])

<span class="code-keyword">print</span>(<span class="code-str">"위치로 선택:"</span>)
<span class="code-keyword">print</span>(df.iloc[<span class="code-num">0</span>:<span class="code-num">2</span>, <span class="code-num">0</span>:<span class="code-num">2</span>])</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <b>한 겹과 두 겹 대괄호</b> : df["score"]는 Series입니다. 여러 열 이름을 리스트로 전달한 df[["brand", "score"]]는 DataFrame입니다.<br>
                        • <code>loc["a":"b"]</code> : 이름표 범위의 끝 b를 포함합니다. 첫 두 행의 지정한 열을 선택합니다.<br>
                        • <code>iloc[0:2, 0:2]</code> : 정수 위치의 끝 2는 제외합니다. 앞의 범위는 행, 뒤의 범위는 열입니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">⚡ [5차시] 조건 필터링과 정렬</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 분석 질문을 조건식으로 바꾸면 관심 있는 행만 추출할 수 있습니다. pandas의 여러 조건은 and 대신 & 또는 |로 결합하고 각 조건을 괄호로 감쌉니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">import</span> pandas <span class="code-keyword">as</span> pd

df = pd.DataFrame({
    <span class="code-str">"brand"</span>: [<span class="code-str">"A"</span>, <span class="code-str">"B"</span>, <span class="code-str">"C"</span>, <span class="code-str">"D"</span>],
    <span class="code-str">"score"</span>: [<span class="code-num">85</span>, <span class="code-num">72</span>, <span class="code-num">90</span>, <span class="code-num">88</span>],
    <span class="code-str">"responses"</span>: [<span class="code-num">25</span>, <span class="code-num">30</span>, <span class="code-num">12</span>, <span class="code-num">22</span>]
})

condition = (df[<span class="code-str">"score"</span>] >= <span class="code-num">80</span>) & (df[<span class="code-str">"responses"</span>] >= <span class="code-num">20</span>)
selected = df.loc[condition, [<span class="code-str">"brand"</span>, <span class="code-str">"score"</span>, <span class="code-str">"responses"</span>]]
ranked = selected.sort_values(<span class="code-str">"score"</span>, ascending=<span class="code-keyword">False</span>)

<span class="code-keyword">print</span>(<span class="code-str">"조건에 맞는 행:"</span>)
<span class="code-keyword">print</span>(ranked)
<span class="code-keyword">print</span>(<span class="code-str">"선택한 행수:"</span>, len(ranked))</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <b>조건식의 결과</b> : 각 행마다 참과 거짓이 담긴 Series를 만듭니다. &는 두 조건이 모두 참인 행을 고릅니다.<br>
                        • <code>loc</code>로 필터링: 85점·25명인 A와 88점 22명인 D가 선택됩니다.<br>
                        • <code>sort_values</code> : ascending=False는 내림차순입니다. 원래 df를 직접 바꾸지 않습니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🧹 [6차시] 자료형 변환과 결측·중복 처리</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 실제 자료에는 숫자처럼 보이는 문자열, 잘못 입력한 값, 누락값, 중복 행이 섞여 있을 수 있습니다. 숫자로 변환할 수 없는 값을 결측으로 바꾸고 중복을 제거한 뒤 분석 가능한 행을 선택합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">import</span> pandas <span class="code-keyword">as</span> pd

df = pd.DataFrame({
    <span class="code-str">"id"</span>: [<span class="code-num">1</span>, <span class="code-num">2</span>, <span class="code-num">2</span>, <span class="code-num">3</span>, <span class="code-num">4</span>],
    <span class="code-str">"score"</span>: [<span class="code-str">"80"</span>, <span class="code-str">"90"</span>, <span class="code-str">"90"</span>, <span class="code-str">"미응답"</span>, <span class="code-keyword">None</span>]
})

clean = df.drop_duplicates().copy()
clean[<span class="code-str">"score"</span>] = pd.to_numeric(clean[<span class="code-str">"score"</span>], errors=<span class="code-str">"coerce"</span>)
<span class="code-keyword">print</span>(<span class="code-str">"결측값 수:"</span>, clean[<span class="code-str">"score"</span>].isna().sum())

valid = clean.dropna(subset=[<span class="code-str">"score"</span>]).copy()

<span class="code-comment"># 평균 대체는 비교용</span>
filled = clean[<span class="code-str">"score"</span>].fillna(clean[<span class="code-str">"score"</span>].mean())
<span class="code-keyword">print</span>(<span class="code-str">"평균으로 대체한 경우:"</span>, filled.tolist())
<span class="code-keyword">print</span>(<span class="code-str">"원본 행수:"</span>, len(df), <span class="code-str">"유효 행수:"</span>, len(valid))
<span class="code-keyword">print</span>(<span class="code-str">"유효 점수 평균:"</span>, valid[<span class="code-str">"score"</span>].mean())</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>drop_duplicates</code> : 모든 열이 같은 중복 행 하나를 제거합니다.<br>
                        • <code>to_numeric(..., errors="coerce")</code> : 미응답 같은 문자열을 결측값으로 바꿉니다. 비정상적인 값을 에러 대신 강제로 NaN(결측값)으로 변환합니다.<br>
                        • <code>dropna</code>와 <code>fillna</code> : 분석에는 결측 행을 제외하고 평균을 구합니다. 평균 대체는 목적에 맞게 선택해야 합니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🧮 [7차시] 파생 열 만들기와 요약 통계</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 기존 열을 계산하여 새 열을 만들면 원래 자료에 없던 비교 기준을 얻을 수 있습니다. 광고를 본 사람 중 구매 의사를 밝힌 사람의 비율을 계산하고 요약합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">import</span> pandas <span class="code-keyword">as</span> pd

df = pd.DataFrame({
    <span class="code-str">"brand"</span>: [<span class="code-str">"A"</span>, <span class="code-str">"B"</span>, <span class="code-str">"C"</span>, <span class="code-str">"D"</span>],
    <span class="code-str">"viewers"</span>: [<span class="code-num">100</span>, <span class="code-num">80</span>, <span class="code-num">120</span>, <span class="code-num">0</span>],
    <span class="code-str">"buyers"</span>: [<span class="code-num">25</span>, <span class="code-num">24</span>, <span class="code-num">30</span>, <span class="code-num">0</span>]
})

valid = df.loc[df[<span class="code-str">"viewers"</span>] > <span class="code-num">0</span>].copy()
valid[<span class="code-str">"intent_rate"</span>] = valid[<span class="code-str">"buyers"</span>] / valid[<span class="code-str">"viewers"</span>] * <span class="code-num">100</span>
valid[<span class="code-str">"intent_rate"</span>] = valid[<span class="code-str">"intent_rate"</span>].round(<span class="code-num">1</span>)
<span class="code-keyword">print</span>(valid)

<span class="code-keyword">print</span>(<span class="code-str">"브랜드별 비율의 단순 평균:"</span>, valid[<span class="code-str">"intent_rate"</span>].mean())
weighted_rate = valid[<span class="code-str">"buyers"</span>].sum() / valid[<span class="code-str">"viewers"</span>].sum() * <span class="code-num">100</span>
<span class="code-keyword">print</span>(<span class="code-str">"전체 응답자 기준 비율:"</span>, round(weighted_rate, <span class="code-num">1</span>))</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <b>열 단위 계산</b> : 각 행의 buyers를 같은 행의 viewers로 나눕니다. 별도 for 반복문 없이 전체 열을 계산합니다.<br>
                        • <b>copy와 새열</b> : 필터링 결과를 복사한 뒤 intent_rate 열을 추가합니다.<br>
                        • <b>평균의 해석</b> : 브랜드 비율의 단순 평균은 약 26.7%, 전체 응답자 기준 비율은 약 26.3% 입니다. 표본 수가 다르면 두 값은 다를 수 있습니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">📦 [8차시] groupby로 그룹별 분석하기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 전체 평균만 보면 브랜드나 매체 사이의 차이를 놓칠 수 있습니다. groupby는 같은 값을 가진 행을 묶고 각 그룹에 집계 함수를 적용합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">import</span> pandas <span class="code-keyword">as</span> pd

df = pd.DataFrame({
    <span class="code-str">"brand"</span>: [<span class="code-str">"A"</span>, <span class="code-str">"A"</span>, <span class="code-str">"B"</span>, <span class="code-str">"B"</span>, <span class="code-str">"C"</span>, <span class="code-str">"C"</span>],
    <span class="code-str">"media"</span>: [<span class="code-str">"영상"</span>, <span class="code-str">"포스터"</span>, <span class="code-str">"영상"</span>, <span class="code-str">"포스터"</span>, <span class="code-str">"영상"</span>, <span class="code-str">"포스터"</span>],
    <span class="code-str">"score"</span>: [<span class="code-num">80</span>, <span class="code-num">90</span>, <span class="code-num">70</span>, <span class="code-num">80</span>, <span class="code-num">85</span>, <span class="code-num">95</span>]
})

summary = df.groupby(<span class="code-str">"brand"</span>, as_index=<span class="code-keyword">False</span>).agg(
    responses=(<span class="code-str">"score"</span>, <span class="code-str">"count"</span>),
    average=(<span class="code-str">"score"</span>, <span class="code-str">"mean"</span>),
    highest=(<span class="code-str">"score"</span>, <span class="code-str">"max"</span>)
)

<span class="code-keyword">print</span>(<span class="code-str">"브랜드별 요약:"</span>)
<span class="code-keyword">print</span>(summary)
<span class="code-keyword">print</span>(<span class="code-str">"매체별 평균:"</span>)
<span class="code-keyword">print</span>(df.groupby(<span class="code-str">"media"</span>)[<span class="code-str">"score"</span>].mean())</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>groupby("brand")</code> : 브랜드가 같은 행을 묶습니다. A의 평균은 85, B는 75, C는 90입니다.<br>
                        • <code>agg</code>의 이름 지정 : 집계 결과 열 이름과 원본 열, 집계 함수를 함께 지정합니다.<br>
                        • <code>as_index=False</code> : 브랜드를 일반 열로 남겨 결과를 다루기 쉽게 합니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🔗 [9차시] 표 결합과 막대그래프 비교</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 분석 자료와 설명 자료가 별도 표에 있을 때 공통 키를 기준으로 결합할 수 있습니다. merge로 브랜드별 점수와 분류를 연결한 뒤 막대그래프로 비교합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">import</span> pandas <span class="code-keyword">as</span> pd
<span class="code-keyword">import</span> matplotlib.pyplot <span class="code-keyword">as</span> plt

scores = pd.DataFrame({<span class="code-str">"brand"</span>: [<span class="code-str">"A"</span>, <span class="code-str">"B"</span>, <span class="code-str">"C"</span>], <span class="code-str">"average"</span>: [<span class="code-num">85</span>, <span class="code-num">75</span>, <span class="code-num">90</span>]})
info = pd.DataFrame({<span class="code-str">"brand"</span>: [<span class="code-str">"A"</span>, <span class="code-str">"B"</span>, <span class="code-str">"C"</span>], <span class="code-str">"category"</span>: [<span class="code-str">"음료"</span>, <span class="code-str">"과자"</span>, <span class="code-str">"식품"</span>]})

merged = scores.merge(info, on=<span class="code-str">"brand"</span>, how=<span class="code-str">"left"</span>, validate=<span class="code-str">"one_to_one"</span>)
<span class="code-comment"># 데이터 연결의 공통 기준 열을 brand로, 기준이 되는 왼쪽 데이터인 scores의 모든 행은 무조건 보존,</span>
<span class="code-comment"># validate=one_to_one은 데이터가 정확히 1대1 관계로 연결되는지 검증</span>

plt.figure(figsize=(<span class="code-num">8</span>, <span class="code-num">5</span>))
plt.bar(merged[<span class="code-str">'brand'</span>], merged[<span class="code-str">'average'</span>])
plt.title(<span class="code-str">"Average survey score by brand"</span>)
plt.xlabel(<span class="code-str">"Brand"</span>)
plt.ylabel(<span class="code-str">"Score"</span>)
plt.ylim(<span class="code-num">0</span>, <span class="code-num">100</span>)
plt.tight_layout()
plt.show()</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <b>left 결합</b> : 왼쪽 scores의 브랜드를 모두 유지합니다. 오른쪽에 대응하는 키가 없으면 category가 결측값이 됩니다.<br>
                        • <code>validate="one_to_one"</code> : 두 표 모두 브랜드 키가 유일한지 검사합니다.<br>
                        • <b>막대그래프 해석</b> : 세로축을 0~100으로 고정하여 평균 차이를 비교합니다.
                    </div>
                `
            }
        };

        // 초기 화면에 lesson1 기본 렌더링
        document.getElementById('lesson-content').innerHTML = lessons.lesson1.html;

        function selectLesson(lessonKey, element) {
            const lesson = lessons[lessonKey];
            document.getElementById('topic-icon').innerText = lesson.icon;
            document.getElementById('topic-title').innerText = lesson.title;
            document.getElementById('lesson-content').innerHTML = lesson.html;

            const menuItems = document.querySelectorAll('.menu-item');
            menuItems.forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            // 스크롤 맨 위로 초기화
            document.getElementById('web-article-view').scrollTop = 0;
        }
    </script>
