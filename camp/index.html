    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', sans-serif;

            -ms-user-select: none;     
            user-select: none;
        }

        /* 상단 헤더 */
        header {
            height: 58px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;

            padding: 0 24px;

        /* 사이드바 넓이 원상복구 (260px) */

            width: 260px;

        /* 본문 영역 */
        .content-area {

        }
        .content-header {
            height: 54px;
            background: #ffffff;

            display: flex;
            align-items: center;

        }
        .current-topic {

            font-weight: 800;

            display: flex;

        /* 스크롤 본문 */
        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 36px 44px;
            background: #ffffff;
        }
        .article-container {
            max-width: 860px;
            margin: 0 auto;
            line-height: 1.75;
        }
        .article-title {
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .article-intro {
            font-size: 14.5px;
            color: #475569;
            background: #f8fafc;

        }
        .chapter-h1 {
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
            margin: 38px 0 16px 0;

            align-items: center;
            gap: 8px;
        }
        .section-desc {
            font-size: 14px;

        }

        /* 코드 블록 */
        .code-block-wrapper {
            background: #0f172a;
            border-radius: 10px;
            margin: 12px 0 18px 0;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.08);
        }
        .code-header {
            background: #1e293b;
            padding: 7px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            color: #94a3b8;
            font-family: monospace;
        }
        .code-lang {
            color: #38bdf8;
            font-weight: 700;
        }
        pre code {
            display: block;
            padding: 14px 18px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #e2e8f0;
            overflow-x: auto;
        }
        .code-comment { color: #64748b; font-style: italic; }
        .code-keyword { color: #f472b6; font-weight: bold; }
        .code-str { color: #a5f3fc; }
        .code-num { color: #fde047; }
        .code-def { color: #67e8f9; font-weight: bold; }

        /* 결과 박스 (톺아보기 등) */
        .result-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px 16px;
            margin: -6px 0 20px 0;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            color: #334155;
            line-height: 1.6;
            overflow-x: auto;
        }
        .result-box b {
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', sans-serif;
        }
    </style>
</head>
<body oncontextmenu="return false" ondragstart="return false">

    <header>
        <div class="header-left">
            <div class="header-logo">⚡</div>
            <div class="header-title">파이썬 기초 문법 강의실</div>
            <span class="header-subtitle">온라인 인터랙티브 교재</span>
        </div>
        <div>
            <span class="badge-status">수업 진행 중</span>
        </div>
    </header>

    <div class="main-container">
        <!-- 사이드바: 3개 메인 주제 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-section-title">
                    <span>📑</span> 수업 목차 (Curriculum)
                </div>
            </div>
            
            <ul class="menu-list">
                <li class="menu-item active" onclick="selectLesson('lesson1', this)">
                    <span class="menu-icon">📋</span>

            </ul>

        <!-- 우측 메인 뷰어 -->
        <main class="content-area">
            <div class="content-header">
                <div class="current-topic">
                    <span id="topic-icon">📋</span>
                    <span id="topic-title">01. 파이썬 리스트</span>
                </div>
            </div>

            <!-- 웹 교재 본문 -->
            <div class="content-body" id="web-article-view">
                <div class="article-container" id="lesson-content">
                    <!-- 자바스크립트가 이곳에 HTML을 주입합니다. -->
                </div>
            </div>
        </main>
    </div>

    <script>
        const lessons = {
            // [01. 파이썬 리스트]
            lesson1: {
                title: "01. 파이썬 리스트",
                icon: "📋",
                html: `
                    <h1 class="article-title">파이썬 리스트(List)</h1>
                    <div class="article-intro">
                        데이터를 순서대로 여러 개 묶어서 관리하는 파이썬의 가장 기본적인 자료구조인 리스트를 생성하고, 값을 꺼내고 자르고 바꾸는 핵심 조작법을 학습합니다.
                    </div>

                    <h1 class="chapter-h1">🧺 [1차시] 리스트 생성과 데이터 묶기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 학생별 점수나 지역별 인구처럼 같은 종류의 데이터를 여러 개 다룰 때 변수를 하나씩 만들면 관리하기 어렵습니다. 리스트는 대괄호 안에 여러 값을 순서대로 담는 자료형입니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-comment"># 설문 점수를 순서대로 저장</span>
scores = [<span class="code-num">82</span>, <span class="code-num">75</span>, <span class="code-num">90</span>, <span class="code-num">88</span>, <span class="code-num">75</span>]
brands = [<span class="code-str">"세종우유"</span>, <span class="code-str">"한솔제과"</span>, <span class="code-str">"세종푸드"</span>]
empty_data = []

<span class="code-keyword">print</span>(<span class="code-str">"설문 점수:"</span>, scores)
<span class="code-keyword">print</span>(<span class="code-str">"응답자 수:"</span>, len(scores))
<span class="code-keyword">print</span>(<span class="code-str">"분석 대상:"</span>, brands)
<span class="code-keyword">print</span>(<span class="code-str">"수집 전 데이터:"</span>, empty_data)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <b>대괄호[]</b> : 쉼표로 구분한 값들을 하나의 리스트로 만듭니다. 같은 값 75가 두 번 들어가도 각각의 원소로 저장됩니다.<br>
                        • <code>len(scores)</code> : 리스트에 담긴 원소의 개수를 반환하므로 응답자 수는 5입니다.<br>
                        • <b>빈 리스트</b> : []는 원소가 없는 리스트입니다. 이후 데이터를 추가하는 출발점으로 사용할 수 있습니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🔍 [2차시] 인덱싱으로 필요한 값 꺼내기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 리스트의 각 원소에는 위치를 나타내는 인덱스가 있습니다. 첫 번째 위치는 1이 아니라 0이며 음수 인덱스는 뒤에서부터 셉니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>visitors = [<span class="code-num">120</span>, <span class="code-num">135</span>, <span class="code-num">128</span>, <span class="code-num">160</span>]
first_month = visitors[<span class="code-num">0</span>]
last_month = visitors[-<span class="code-num">1</span>]
change = last_month - first_month

<span class="code-keyword">print</span>(<span class="code-str">"첫 달 방문자:"</span>, first_month)
<span class="code-keyword">print</span>(<span class="code-str">"두 번째 달 방문자:"</span>, visitors[<span class="code-num">1</span>])
<span class="code-keyword">print</span>(<span class="code-str">"마지막 달 방문자:"</span>, last_month)
<span class="code-keyword">print</span>(<span class="code-str">"첫 달 대비 증가:"</span>, change)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>visitors[0]</code> : 첫 번째 값 120을 가져옵니다. 길이가 4인 리스트의 양수 인덱스는 0부터 3까지입니다.<br>
                        • <code>visitors[-1]</code> : 마지막 값 160을 가져옵니다. 자료가 추가되어도 마지막 원소를 가리킵니다.<br>
                        • <code>change</code> : 꺼낸 값은 일반 숫자처럼 계산할 수 있으며 증가량은 40입니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">✂️ [3차시] 슬라이싱으로 구간 추출하기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 인덱싱이 값 하나를 꺼내는 방법이라면 슬라이싱은 원하는 구간을 새 리스트로 만드는 방법입니다. [시작:끝]에서 끝 위치는 포함되지 않습니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>visitors = [<span class="code-num">120</span>, <span class="code-num">135</span>, <span class="code-num">128</span>, <span class="code-num">160</span>, <span class="code-num">175</span>, <span class="code-num">210</span>, <span class="code-num">190</span>]
first_three = visitors[:<span class="code-num">3</span>]
weekend = visitors[<span class="code-num">5</span>:<span class="code-num">7</span>]
alternate = visitors[::<span class="code-num">2</span>]
reversed_data = visitors[::-<span class="code-num">1</span>]

<span class="code-keyword">print</span>(<span class="code-str">"첫 3일:"</span>, first_three)
<span class="code-keyword">print</span>(<span class="code-str">"주말:"</span>, weekend)
<span class="code-keyword">print</span>(<span class="code-str">"하루씩 건너뛴 자료:"</span>, alternate)
<span class="code-keyword">print</span>(<span class="code-str">"역순 자료:"</span>, reversed_data)
<span class="code-keyword">print</span>(<span class="code-str">"원본:"</span>, visitors)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>visitors[:3]</code> : 시작을 생략하면 처음부터 가져옵니다. 인덱스 3은 제외되어 120, 135, 128이 선택됩니다.<br>
                        • <code>visitors[5:7]</code> : 인덱스 5와 6의 값을 새 리스트에 담습니다.<br>
                        • <b>간격과 역순</b> : 세 번째 값은 이동 간격입니다. <code>::2</code>는 두 칸씩, <code>::-1</code>은 뒤에서 앞으로 이동하며 원본은 바뀌지 않습니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🛠️ [4차시] 원소 수정과 데이터 추가</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 리스트는 만든 뒤에도 내용을 바꿀 수 있습니다. 인덱스로 기존 값을 수정하고 append로 값 하나를 마지막에 추가합니다. extend는 여러 원소를 풀어서 추가하고 insert는 지정한 위치에 값을 끼워 넣습니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>scores = [<span class="code-num">70</span>, <span class="code-num">80</span>, <span class="code-num">90</span>]
scores[<span class="code-num">0</span>] = <span class="code-num">75</span>
scores.append(<span class="code-num">85</span>)
<span class="code-keyword">print</span>(<span class="code-str">"한 명 추가:"</span>, scores)

scores.extend([<span class="code-num">88</span>, <span class="code-num">92</span>])
<span class="code-keyword">print</span>(<span class="code-str">"두 명 추가:"</span>, scores)

scores.insert(<span class="code-num">1</span>, <span class="code-num">78</span>)
<span class="code-keyword">print</span>(<span class="code-str">"두 번째 위치에 삽입:"</span>, scores)
<span class="code-keyword">print</span>(<span class="code-str">"전체 응답자:"</span>, len(scores))</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>scores[0] = 75</code> : 잘못 입력한 첫 점수 70을 75로 교체합니다.<br>
                        • <code>append</code>와 <code>extend</code> : append(85)는 숫자 하나를 추가합니다. extend([88, 92])는 두 숫자를 각각 추가합니다.<br>
                        • <code>insert(1, 78)</code> : 인덱스 1 앞에 78을 넣습니다. 뒤의 원소들은 한 칸씩 밀립니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🗑️ [5차시] 원소 삭제와 안전한 제거</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 자료를 정리할 때는 값으로 지우는 방법과 위치로 지우는 방법을 구분해야 합니다. remove는 처음 일치하는 값 하나를 삭제하고 pop은 지정한 위치의 값을 꺼내면서 삭제합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>scores = [<span class="code-num">80</span>, <span class="code-num">0</span>, <span class="code-num">75</span>, <span class="code-num">0</span>, <span class="code-num">90</span>]
<span class="code-keyword">if</span> <span class="code-num">0</span> <span class="code-keyword">in</span> scores:
    scores.remove(<span class="code-num">0</span>)
    <span class="code-keyword">print</span>(<span class="code-str">"첫 번째 0 제거:"</span>, scores)

last_score = scores.pop()
<span class="code-keyword">print</span>(<span class="code-str">"꺼낸 마지막 점수:"</span>, last_score)
<span class="code-keyword">print</span>(<span class="code-str">"남은 자료:"</span>, scores)

<span class="code-keyword">del</span> scores[<span class="code-num">0</span>]
<span class="code-keyword">print</span>(<span class="code-str">"첫 원소 삭제:"</span>, scores)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>0 in scores</code> : 리스트에 0이 있는지 확인합니다. 없는 값을 remove로 지우면 ValueError가 발생합니다.<br>
                        • <code>remove(0)</code> : 처음 발견한 0만 제거합니다. 모든 0을 제거하는 명령이 아니므로 다른 0은 남습니다.<br>
                        • <code>pop</code>과 <code>del</code> : pop()은 마지막 값을 반환하며 삭제합니다. del scores[0]은 해당 위치를 삭제합니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">📊 [6차시] 검색과 정렬로 자료 살펴보기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 특정 값이 몇 번 나오는지 확인하거나 크기순으로 정리하면 자료의 특징을 쉽게 파악할 수 있습니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>scores = [<span class="code-num">82</span>, <span class="code-num">75</span>, <span class="code-num">90</span>, <span class="code-num">88</span>, <span class="code-num">75</span>]
<span class="code-keyword">print</span>(<span class="code-str">"75점 인원:"</span>, scores.count(<span class="code-num">75</span>))

<span class="code-keyword">if</span> <span class="code-num">90</span> <span class="code-keyword">in</span> scores:
    <span class="code-keyword">print</span>(<span class="code-str">"90점의 첫 위치:"</span>, scores.index(<span class="code-num">90</span>))

ranked = sorted(scores, reverse=<span class="code-keyword">True</span>)
<span class="code-keyword">print</span>(<span class="code-str">"내림차순 새 리스트:"</span>, ranked)
<span class="code-keyword">print</span>(<span class="code-str">"정렬 전 원본:"</span>, scores)

scores.sort()
<span class="code-keyword">print</span>(<span class="code-str">"오름차순으로 바뀐 원본:"</span>, scores)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>count</code>와 <code>index</code> : 75는 두 번 나오고 90의 인덱스는 2입니다. 없는 값을 index로 찾으면 ValueError가 발생합니다.<br>
                        • <code>sorted(..., reverse=True)</code> : 큰 값부터 정렬한 새 리스트를 만듭니다.<br>
                        • <code>scores.sort()</code> : 원본을 오름차순으로 바꾸고 None을 반환합니다. 
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🧮 [7차시] 반복문으로 합계와 평균 구하기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 리스트의 원소를 for 반복문으로 하나씩 꺼내면 같은 처리를 모든 자료에 적용할 수 있습니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>populations = [<span class="code-num">18000</span>, <span class="code-num">32000</span>, <span class="code-num">25000</span>, <span class="code-num">15000</span>]
total = <span class="code-num">0</span>
<span class="code-keyword">for</span> population <span class="code-keyword">in</span> populations:
    total = total + population

<span class="code-keyword">print</span>(<span class="code-str">"직접 계산한 합계:"</span>, total)
<span class="code-keyword">print</span>(<span class="code-str">"sum으로 구한 합계:"</span>, sum(populations))

<span class="code-keyword">if</span> len(populations) > <span class="code-num">0</span>:
    average = total / len(populations)
    <span class="code-keyword">print</span>(<span class="code-str">"평균 인구:"</span>, average)
    <span class="code-keyword">print</span>(<span class="code-str">"최대 인구:"</span>, max(populations))</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>total = 0</code> : 반복문 밖에서 누적 변수를 초기화합니다. 반복문 안에서 0으로 만들면 이전 합계가 지워집니다.<br>
                        • <b>빈 리스트 확인</b> : 자료가 없을 때 길이로 나누면 오류가 납니다. max도 빈 자료에는 바로 사용할 수 없습니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">⚡ [8차시] 조건에 맞는 자료와 리스트 컴프리헨션</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 분석에서는 전체 자료 중 조건에 맞는 값만 골라야 할 때가 많습니다. 반복문과 조건문으로 새 리스트를 만들 수 있으며 짧은 처리라면 리스트 컴프리헨션으로 표현할 수 있습니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>scores = [<span class="code-num">65</span>, <span class="code-num">82</span>, <span class="code-num">90</span>, <span class="code-num">73</span>, <span class="code-num">88</span>]
high_scores = []
<span class="code-keyword">for</span> score <span class="code-keyword">in</span> scores:
    <span class="code-keyword">if</span> score >= <span class="code-num">80</span>:
        high_scores.append(score)

compact_scores = [s <span class="code-keyword">for</span> s <span class="code-keyword">in</span> scores <span class="code-keyword">if</span> s >= <span class="code-num">80</span>]
adjusted_scores = [min(s + <span class="code-num">5</span>, <span class="code-num">100</span>) <span class="code-keyword">for</span> s <span class="code-keyword">in</span> scores]

<span class="code-keyword">print</span>(<span class="code-str">"반복문으로 추출:"</span>, high_scores)
<span class="code-keyword">print</span>(<span class="code-str">"컴프리헨션으로 추출:"</span>, compact_scores)
<span class="code-keyword">print</span>(<span class="code-str">"5점 보정 결과:"</span>, adjusted_scores)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <b>조건과 append</b> : 80 이상인 값만 새 리스트에 추가하여 [82, 90, 88]을 얻습니다.<br>
                        • <code>[s for s in scores if s >= 80]</code> : 원소를 꺼내고 조건을 확인한 뒤 결과에 넣는 작업을 한 줄로 표현합니다.<br>
                        • <code>min(s+5, 100)</code> : 5점을 더하되 100을 넘지 않게 합니다.
                    </div>

<span class="code-keyword">print</span>(<span class="code-str">"두 번째 응답자의 첫 점수:"</span>, survey[<span class="code-num">1</span>][<span class="code-num">0</span>])

<span class="code-keyword">print</span>(<span class="code-str">"원본 첫 행:"</span>, survey[<span class="code-num">0</span>])</code></pre>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🎯 [4차시] 위치 인수와 키워드 인수 활용</h1>

                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">def</span> <span class="code-def">population_info</span>(city, district, count):

    <span class="code-keyword">print</span>(<span class="code-str">"행정동:"</span>, district)
    <span class="code-keyword">print</span>(<span class="code-str">"인구수:"</span>, count, <span class="code-str">"명"</span>)
    <span class="code-keyword">print</span>(<span class="code-str">"-"</span> * <span class="code-num">20</span>)

<span class="code-comment"># 1. 위치 인수: 작성된 순서대로 매핑됨</span>

population_info(count=<span class="code-num">32000</span>, city=<span class="code-str">"세종특별자치시"</span>, district=<span class="code-str">"보람동"</span>)</code></pre>
                    </div>

                        <b>🔍 코드 톺아보기</b><br>
                        • <b>위치 인수 호출</b> : 첫 번째 인수는 city 두 번째는 district 세 번째는 count에 순서대로 엄격하게 들어갑니다.<br>
                        • <b>키워드 인수 호출</b> : 매개변수 이름을 명시하였으므로 count를 가장 먼저 적어도 정확하게 count 매개변수로 값이 들어갑니다.

                    <h1 class="chapter-h1" style="margin-top: 50px;">⚙️ [5차시] 기본값(Default) 매개변수의 적용</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 매번 동일한 값을 전달해야 하는 번거로움을 줄이기 위해 함수 정의 시 매개변수에 기본값을 미리 설정해 둘 수 있습니다. 호출할 때 값을 생략하면 이 기본값이 작동하며 새로운 값을 전달하면 기본값을 무시하고 덮어씁니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">def</span> <span class="code-def">report_activity</span>(name, club=<span class="code-str">"데이터마이닝"</span>):
    <span class="code-keyword">print</span>(<span class="code-str">"이름:"</span>, name)
    <span class="code-keyword">print</span>(<span class="code-str">"소속 동아리:"</span>, club)
    <span class="code-keyword">print</span>(<span class="code-str">"-"</span> * <span class="code-num">20</span>)

<span class="code-comment"># 두 번째 인수를 생략하여 기본값 적용</span>
report_activity(<span class="code-str">"김학생"</span>)
report_activity(<span class="code-str">"이학생"</span>)

<span class="code-comment"># 두 번째 인수에 새로운 값을 전달하여 기본값 덮어쓰기</span>
report_activity(<span class="code-str">"박학생"</span>, <span class="code-str">"로봇공학"</span>)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>club="데이터마이닝"</code> : 함수를 만들 때 기본 소속을 데이터마이닝으로 고정해 두었습니다.<br>
                        • <code>report_activity("김학생")</code> : club 자리에 아무것도 넣지 않았으므로 파이썬이 알아서 데이터마이닝을 출력합니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🏠 [6차시] 지역 변수와 전역 변수의 이해</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 함수 안에서 새롭게 만들어진 변수는 지역 변수라 불리며 함수가 종료되면 메모리에서 완전히 사라집니다. 반면 함수 밖에서 만들어진 변수는 전역 변수로 프로그램 전체에서 읽을 수 있습니다. 변수의 생명 주기와 유효 범위를 이해하는 것은 논리 오류를 막는 핵심입니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>base_population = <span class="code-num">380000</span> <span class="code-comment"># 전역 변수</span>

<span class="code-keyword">def</span> <span class="code-def">add_new_residents</span>(new_people):
    <span class="code-comment"># 함수 안에서 생성된 지역 변수 added</span>
    added = base_population + new_people
    <span class="code-keyword">print</span>(<span class="code-str">"새로운 인구 유입 후 계산 결과:"</span>, added)

add_new_residents(<span class="code-num">5000</span>)
<span class="code-keyword">print</span>(<span class="code-str">"원래 기준 인구수:"</span>, base_population)
<span class="code-comment"># print(added) # 주석을 풀면 NameError가 발생합니다. 함수가 끝나면 added는 사라집니다.</span></code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>base_population</code> : 함수 외부 최상단에 선언되었으므로 함수 내부에서도 접근하여 사용할 수 있는 전역 변수입니다.<br>
                        • <code>added</code> : 함수 내부에서 태어난 지역 변수이므로 밖에서 출력하려 하면 정의되지 않았다는 NameError가 발생합니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">⚖️ [7차시] 함수와 조건문(if)의 결합</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 입력받은 매개변수의 값을 if 조건문으로 검사하여 참(True) 또는 거짓(False)을 반환하는 판별 함수를 만들 수 있습니다. 데이터의 유효성을 검사하거나 조건에 따른 처리를 모듈화할 때 매우 유용합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">def</span> <span class="code-def">is_effective_ppl</span>(score):
    <span class="code-comment"># 점수가 80점 이상이면 광고 효과가 높다고 판별</span>
    <span class="code-keyword">if</span> score >= <span class="code-num">80</span>:
        <span class="code-keyword">return</span> <span class="code-keyword">True</span>
    <span class="code-keyword">else</span>:
        <span class="code-keyword">return</span> <span class="code-keyword">False</span>

<span class="code-comment"># 메인 코드에서 함수 활용</span>
current_score = <span class="code-num">85</span>
<span class="code-keyword">if</span> is_effective_ppl(current_score):
    <span class="code-keyword">print</span>(<span class="code-str">"광고 효과가 훌륭합니다. 캠페인을 유지하세요."</span>)
<span class="code-keyword">else</span>:
    <span class="code-keyword">print</span>(<span class="code-str">"광고 효과가 부족합니다. 매체를 변경하세요."</span>)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>if score >= 80:</code> : 외부에서 전달받은 점수를 기준으로 내부에서 조건을 판별합니다.<br>
                        • <code>return True</code> : 연산 결과에 따라 불리언(Boolean) 값을 반환하므로 메인 코드의 if문 조건식에 직관적으로 결합할 수 있습니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🔄 [8차시] 함수와 반복문(for)의 결합</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 여러 개의 데이터가 담긴 파이썬 리스트를 함수의 매개변수로 한 번에 넘겨줄 수 있습니다. 함수 내부의 for 반복문을 통해 리스트 원소를 하나씩 꺼내어 누적 합계를 구하거나 평균을 계산하는 등 대량의 데이터를 손쉽게 다룹니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">def</span> <span class="code-def">calculate_total_population</span>(pop_list):
    total = <span class="code-num">0</span>
    <span class="code-keyword">for</span> pop <span class="code-keyword">in</span> pop_list:
        total = total + pop
    <span class="code-keyword">return</span> total

<span class="code-comment"># 4개 행정동의 인구 데이터 리스트</span>
district_populations = [<span class="code-num">18000</span>, <span class="code-num">32000</span>, <span class="code-num">25000</span>, <span class="code-num">15000</span>]

<span class="code-comment"># 리스트를 통째로 함수에 전달</span>
total_pop = calculate_total_population(district_populations)
<span class="code-keyword">print</span>(<span class="code-str">"행정동 전체 누적 인구수:"</span>, total_pop, <span class="code-str">"명"</span>)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>for pop in pop_list:</code> : 전달받은 리스트에서 데이터를 순차적으로 하나씩 꺼내어 반복문을 실행합니다.<br>
                        • <code>total = total + pop</code> : 초기값이 0인 total 변수에 꺼낸 인구수를 계속해서 누적 합산합니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🔗 [9차시] 다중 함수의 파이프라인 연결</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 복잡한 코드를 하나의 거대한 함수에 몰아넣기보다는 역할이 하나로 분명한 여러 개의 작은 함수로 나누어 설계하는 것이 좋습니다. 한 함수가 연산하여 반환한 결과값을 다음 함수의 입력으로 전달하며 협업하는 구조를 익힙니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-comment"># 1단계: 평균을 구하는 전문 함수</span>
<span class="code-keyword">def</span> <span class="code-def">get_average</span>(scores):
    <span class="code-keyword">return</span> sum(scores) / len(scores)

<span class="code-comment"># 2단계: 평균을 받아 등급을 매기는 전문 함수</span>
<span class="code-keyword">def</span> <span class="code-def">rate_effectiveness</span>(avg_score):
    <span class="code-keyword">if</span> avg_score >= <span class="code-num">80</span>:
        <span class="code-keyword">return</span> <span class="code-str">"우수"</span>
    <span class="code-keyword">elif</span> avg_score >= <span class="code-num">60</span>:
        <span class="code-keyword">return</span> <span class="code-str">"보통"</span>
    <span class="code-keyword">else</span>:
        <span class="code-keyword">return</span> <span class="code-str">"미흡"</span>

ppl_scores = [<span class="code-num">88</span>, <span class="code-num">92</span>, <span class="code-num">75</span>, <span class="code-num">80</span>]

<span class="code-comment"># 함수들의 파이프라인 협업</span>
average_val = get_average(ppl_scores)
final_rating = rate_effectiveness(average_val)

<span class="code-keyword">print</span>(<span class="code-str">"평균 인지도:"</span>, average_val)
<span class="code-keyword">print</span>(<span class="code-str">"최종 광고 등급:"</span>, final_rating)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>get_average</code> / <code>rate_effectiveness</code> : 계산 기능과 판별 기능을 분리하여 코드를 수정하고 디버깅하기 훨씬 수월하게 설계했습니다.<br>
                        • <code>rate_effectiveness(average_val)</code> : get_average가 계산해 낸 결과값을 변수에 잠시 담아둔 뒤 이를 그대로 다음 함수의 매개변수로 넘겨줍니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🏆 [10차시] 종합 미니 프로젝트 - 데이터 분석 리포트 완성</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 지금까지 배운 매개변수, 반환값, 조건문, 반복문, 함수 연결의 모든 개념을 조립하여 독립적인 기능을 수행하는 데이터 분석 미니 프로그램을 완성합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">def</span> <span class="code-def">calc_avg</span>(data_list):
    <span class="code-keyword">return</span> sum(data_list) / len(data_list)

<span class="code-keyword">def</span> <span class="code-def">judge_trend</span>(avg):
    <span class="code-keyword">if</span> avg >= <span class="code-num">80</span>:
        <span class="code-keyword">return</span> <span class="code-str">"상승세 뚜렷"</span>
    <span class="code-keyword">elif</span> avg >= <span class="code-num">60</span>:
        <span class="code-keyword">return</span> <span class="code-str">"유지 중"</span>
    <span class="code-keyword">else</span>:
        <span class="code-keyword">return</span> <span class="code-str">"하락세 주의"</span>

<span class="code-keyword">def</span> <span class="code-def">generate_report</span>(brand_name, recent_data):
    <span class="code-comment"># 앞서 만든 부품 함수들을 활용</span>
    average = calc_avg(recent_data)
    trend = judge_trend(average)
    
    <span class="code-keyword">print</span>(<span class="code-str">"="</span> * <span class="code-num">30</span>)
    <span class="code-keyword">print</span>(<span class="code-str">"브랜드명:"</span>, brand_name)
    <span class="code-keyword">print</span>(<span class="code-str">"최근 데이터 평균치:"</span>, round(average, <span class="code-num">1</span>))
    <span class="code-keyword">print</span>(<span class="code-str">"현재 분석 트렌드:"</span>, trend)
    <span class="code-keyword">print</span>(<span class="code-str">"="</span> * <span class="code-num">30</span>)

<span class="code-comment"># --- 메인 실행 제어부 ---</span>
target_brand = <span class="code-str">"세종푸드"</span>
collected_data = [<span class="code-num">82</span>, <span class="code-num">85</span>, <span class="code-num">78</span>, <span class="code-num">90</span>, <span class="code-num">88</span>]

<span class="code-comment"># 함수 단 하나만 호출하여 전체 분석 및 출력 로직을 수행</span>
generate_report(target_brand, collected_data)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <b>부품 함수 분리</b> : 수학적 계산과 조건 판별을 각각 <code>calc_avg</code>와 <code>judge_trend</code>로 독립시켰습니다.<br>
                        • <code>generate_report</code> : 마치 오케스트라의 지휘자처럼 부품 함수들을 호출해 결과를 취합하고 최종 화면 출력을 관장합니다.<br>
                        • <b>메인 실행부의 간결함</b> : 데이터를 모아서 지휘자 함수 하나만 호출하면 모든 과정이 깔끔하게 처리되는 모듈화의 장점을 극대화했습니다.
                    </div>
                `
            },

                    <h1 class="chapter-h1">🏷️ [1차시] 키와 값으로 데이터 저장하기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 리스트가 위치를 기준으로 값을 찾는다면 딕셔너리는 이름표인 키로 값을 찾습니다. 중괄호 안에 키와 값을 콜론으로 연결하여 저장합니다. 한 지역의 이름, 인구, 면적을 하나의 딕셔너리로 묶어 의미가 분명한 자료를 만듭니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>district = {

                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🛡️ [2차시] 안전한 조회와 키 존재 확인</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 자료마다 모든 항목이 들어 있는 것은 아닙니다. 존재하지 않는 키를 대괄호로 조회하면 KeyError가 발생합니다. get은 키가 없을 때 사용할 기본값을 지정할 수 있고 in은 키의 존재 여부를 확인합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>district = {<span class="code-str">"name"</span>: <span class="code-str">"한솔동"</span>, <span class="code-str">"population"</span>: <span class="code-num">18000</span>}

<span class="code-keyword">print</span>(<span class="code-str">"지역:"</span>, district.get(<span class="code-str">"name"</span>))
<span class="code-keyword">print</span>(<span class="code-str">"면적:"</span>, district.get(<span class="code-str">"area"</span>, <span class="code-str">"미조사"</span>))
<span class="code-keyword">print</span>(<span class="code-str">"별도 기본값이 없을 때:"</span>, district.get(<span class="code-str">"school"</span>))

<span class="code-keyword">if</span> <span class="code-str">"population"</span> <span class="code-keyword">in</span> district:
    <span class="code-keyword">print</span>(<span class="code-str">"인구 자료가 있습니다."</span>)

<span class="code-keyword">print</span>(<span class="code-str">"한솔동이 키인가요?"</span>, <span class="code-str">"한솔동"</span> <span class="code-keyword">in</span> district)
<span class="code-keyword">print</span>(<span class="code-str">"한솔동이 값인가요?"</span>, <span class="code-str">"한솔동"</span> <span class="code-keyword">in</span> district.values())</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>get(키, 기본값)</code> : area가 없으므로 미조사를 반환합니다. 기본값을 생략한 없는 키의 결과는 None입니다.<br>
                        • <code>in district</code> : 값이 아니라 키를 검사합니다. population은 키이므로 조건이 참입니다.<br>
                        • <code>values()</code> : 딕셔너리에 담긴 값들을 살펴봅니다. 한솔동이 값으로 있는지 확인하면 True가 나옵니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">📝 [3차시] 항목 추가와 값 수정</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 딕셔너리의 키에 값을 대입하면 새 키는 추가되고 기존 키는 수정됩니다. 여러 항목을 한 번에 반영하려면 update를 사용합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>district = {<span class="code-str">"name"</span>: <span class="code-str">"한솔동"</span>, <span class="code-str">"population"</span>: <span class="code-num">18000</span>}

district[<span class="code-str">"year"</span>] = <span class="code-num">2025</span>
district[<span class="code-str">"population"</span>] = <span class="code-num">18500</span>
<span class="code-keyword">print</span>(<span class="code-str">"추가와 수정:"</span>, district)

district.update({<span class="code-str">"population"</span>: <span class="code-num">19000</span>, <span class="code-str">"schools"</span>: <span class="code-num">4</span>})
<span class="code-keyword">print</span>(<span class="code-str">"여러 항목 반영:"</span>, district)
<span class="code-keyword">print</span>(<span class="code-str">"최종 인구:"</span>, district[<span class="code-str">"population"</span>])
<span class="code-keyword">print</span>(<span class="code-str">"전체 항목 수:"</span>, len(district))</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <b>새 키에 대입</b> : year는 없던 키이므로 새 항목이 생깁니다. 키의 순서는 삽입 순서를 따릅니다.<br>
                        • <b>기존 키에 대입</b> : population의 값이 바뀔 뿐 같은 이름의 항목이 추가되지는 않습니다.<br>
                        • <code>update</code> : 기존 population은 19000으로 바꾸고 schools는 새로 추가합니다. 최종 항목 수는 4입니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🧹 [4차시] 항목 삭제와 기본값 등록</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 불필요한 항목을 없앨 때 pop은 삭제한 값을 돌려주고 del은 지정한 항목을 삭제합니다. 반대로 setdefault는 키가 없을 때만 기본값을 등록합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>record = {<span class="code-str">"brand"</span>: <span class="code-str">"세종우유"</span>, <span class="code-str">"score"</span>: <span class="code-num">85</span>, <span class="code-str">"memo"</span>: <span class="code-str">"임시"</span>}

removed = record.pop(<span class="code-str">"memo"</span>, <span class="code-str">"없음"</span>)
<span class="code-keyword">print</span>(<span class="code-str">"삭제한 메모:"</span>, removed)
<span class="code-keyword">print</span>(<span class="code-str">"없는 항목 삭제:"</span>, record.pop(<span class="code-str">"phone"</span>, <span class="code-str">"없음"</span>))

record.setdefault(<span class="code-str">"responses"</span>, <span class="code-num">0</span>)
record.setdefault(<span class="code-str">"score"</span>, <span class="code-num">0</span>)

<span class="code-keyword">del</span> record[<span class="code-str">"brand"</span>]
<span class="code-keyword">print</span>(<span class="code-str">"정리한 자료:"</span>, record)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>pop(키, 기본값)</code> : memo를 삭제하면서 임시를 반환합니다. 없는 phone은 기본값 없음을 반환하므로 오류가 나지 않습니다.<br>
                        • <code>setdefault</code> : responses가 없어서 0을 저장합니다. score는 이미 있으므로 85를 유지합니다.<br>
                        • <code>del record["brand"]</code> : brand 항목을 삭제합니다. 없는 키를 del로 삭제하면 오류가 납니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🔄 [5차시] keys, values, items와 반복문</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 여러 지역을 한 번에 살펴보려면 딕셔너리의 키와 값을 순회해야 합니다. keys는 키, values는 값, items는 키와 값의 쌍을 제공합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>populations = {<span class="code-str">"한솔동"</span>: <span class="code-num">18000</span>, <span class="code-str">"보람동"</span>: <span class="code-num">32000</span>, <span class="code-str">"새롬동"</span>: <span class="code-num">25000</span>}

<span class="code-keyword">print</span>(<span class="code-str">"지역 목록:"</span>, list(populations.keys()))
<span class="code-keyword">print</span>(<span class="code-str">"인구 목록:"</span>, list(populations.values()))

total = <span class="code-num">0</span>
<span class="code-keyword">for</span> name, population <span class="code-keyword">in</span> populations.items():
    <span class="code-keyword">print</span>(name, <span class="code-str">":"</span>, population, <span class="code-str">"명"</span>)
    total = total + population

<span class="code-keyword">print</span>(<span class="code-str">"전체 인구:"</span>, total)
<span class="code-keyword">print</span>(<span class="code-str">"내장 함수 합계:"</span>, sum(populations.values()))</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>keys</code>와 <code>values</code> : 키 또는 값만 골라 볼 수 있습니다. list로 변환하면 리스트 형태로 출력됩니다.<br>
                        • <code>for name, population in populations.items():</code> : 각 쌍의 키를 name에, 값을 population에 나누어 저장합니다.<br>
                        • <b>합계 계산</b> : 세 지역의 합계는 75,000입니다. 딕셔너리를 직접 반복하면 기본적으로 키가 나온다는 점에 주의합니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">📈 [6차시] get을 활용한 빈도 집계</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 같은 응답이 몇 번 나왔는지 집계할 때 딕셔너리가 유용합니다. 응답 내용을 키로 삼고 횟수를 값으로 저장합니다. 처음 나온 응답은 0에서 시작하고 이미 나온 응답은 기존 횟수에 1을 더하는 방식으로 선호 브랜드를 집계합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>responses = [<span class="code-str">"세종우유"</span>, <span class="code-str">"한솔제과"</span>, <span class="code-str">"세종우유"</span>, <span class="code-str">"세종푸드"</span>, <span class="code-str">"한솔제과"</span>, <span class="code-str">"세종우유"</span>]
counts = {}

<span class="code-keyword">for</span> brand <span class="code-keyword">in</span> responses:
    counts[brand] = counts.get(brand, <span class="code-num">0</span>) + <span class="code-num">1</span>

<span class="code-keyword">print</span>(<span class="code-str">"브랜드별 응답 수:"</span>, counts)

<span class="code-keyword">for</span> brand, count <span class="code-keyword">in</span> counts.items():
    ratio = count / len(responses) * <span class="code-num">100</span>
    <span class="code-keyword">print</span>(brand, count, <span class="code-str">"명"</span>, round(ratio, <span class="code-num">1</span>), <span class="code-str">"%"</span>)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <b>빈 딕셔너리</b> : 집계를 시작하기 전에는 어떤 브랜드가 나올지 몰라도 됩니다. 발견한 브랜드를 차례로 추가합니다.<br>
                        • <code>get(brand, 0) + 1</code> : 처음 나온 브랜드는 0+1, 다시 나온 브랜드는 기존 횟수 + 1이 저장됩니다.<br>
                        • <b>빈도와 비율</b> : 전체 응답 수 6으로 나누어 비율을 구합니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🗂️ [7차시] 중첩 딕셔너리로 지역 정보 관리</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 지역마다 인구와 면적을 함께 저장하려면 값 자리에 또 다른 딕셔너리를 넣을 수 있습니다. 바깥쪽 키는 지역을, 안쪽 키는 정보 항목을 구분합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>districts = {
    <span class="code-str">"한솔동"</span>: {<span class="code-str">"population"</span>: <span class="code-num">18000</span>, <span class="code-str">"area"</span>: <span class="code-num">2.8</span>},
    <span class="code-str">"보람동"</span>: {<span class="code-str">"population"</span>: <span class="code-num">32000</span>, <span class="code-str">"area"</span>: <span class="code-num">3.5</span>}
}

<span class="code-keyword">print</span>(<span class="code-str">"한솔동 인구:"</span>, districts[<span class="code-str">"한솔동"</span>][<span class="code-str">"population"</span>])

districts[<span class="code-str">"한솔동"</span>][<span class="code-str">"population"</span>] = <span class="code-num">18500</span>

<span class="code-keyword">for</span> name, info <span class="code-keyword">in</span> districts.items():
    density = info[<span class="code-str">"population"</span>] / info[<span class="code-str">"area"</span>]
    <span class="code-keyword">print</span>(name, <span class="code-str">"인구 밀도:"</span>, round(density, <span class="code-num">1</span>), <span class="code-str">"명/km²"</span>)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <b>키를 두 번 사용</b> : districts["한솔동"]은 안쪽 딕셔너리이며 여기에 ["population"]을 붙여 숫자를 얻습니다.<br>
                        • <b>안쪽 값 수정</b> : 한솔동의 인구만 18500으로 바꿉니다. 보람동의 자료에는 영향을 주지 않습니다.<br>
                        • <b>밀도 계산</b> : 인구를 면적으로 나눕니다. 
                    </div>
                `
            }
        };

        // 초기 화면에 lesson1 기본 렌더링
        document.getElementById('lesson-content').innerHTML = lessons.lesson1.html;

        function selectLesson(lessonKey, element) {
            const lesson = lessons[lessonKey];
            document.getElementById('topic-icon').innerText = lesson.icon;
            document.getElementById('topic-title').innerText = lesson.title;
            document.getElementById('lesson-content').innerHTML = lesson.html;

            const menuItems = document.querySelectorAll('.menu-item');
            menuItems.forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            // 스크롤 맨 위로 초기화
            document.getElementById('web-article-view').scrollTop = 0;
        }
    </script>
