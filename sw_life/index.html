    <script>
        const lessons = {
            lesson1: {
                title: "01. 데이터 다루기",
                icon: "🔄",
                html: `
                    <h1 class="article-title">데이터 다루기</h1>
                    <div class="article-intro">
                        <b>수업 구성:</b> 1장 데이터 구조 → 2장 pandas 선택·필터링·수정 → 3장 기초 통계와 그룹별 비교<br>
                        데이터 분석의 시작은 <b>데이터를 어떤 구조로 저장하고, 무엇을 확인할 것인가?</b>를 생각하는 것입니다.
                    </div>

                    <!-- 1장 -->
                    <h1 class="chapter-h1">📖 1장. 파이썬의 데이터 구조</h1>
                    <div class="tip-callout">
                        <b>🎯 학습 목표</b><br>
                        ✓ 변수, 리스트, 딕셔너리의 특징을 설명할 수 있다.<br>
                        ✓ 같은 성적 데이터를 여러 데이터 구조로 처리해 차이를 비교할 수 있다.<br>
                        ✓ 딕셔너리를 pandas DataFrame으로 변환하고 합계와 평균을 계산할 수 있다.
                    </div>

                    <h2 class="section-h2">1. 변수를 이용한 성적 처리</h2>
                    <p class="section-desc"><b>핵심 개념:</b> 변수는 하나의 값을 이름을 붙여 저장하는 가장 기본적인 데이터 저장 방법입니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>변수 선언 및 연산</span></div>
                        <pre><code>kor = <span class="code-str">80</span>
math = <span class="code-str">40</span>
eng = <span class="code-str">30</span>
total = kor + math + eng
mean = total / <span class="code-str">3</span>
<span class="code-keyword">print</span>(total, mean)</code></pre>
                    </div>

                    <h2 class="section-h2">2. 리스트를 이용한 성적 처리</h2>
                    <p class="section-desc"><b>생각하기:</b> 학생 수가 많아지면 변수를 여러 개 만드는 것보다 리스트에 묶어 저장하는 것이 편리합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>2차원 리스트 성적 처리</span></div>
                        <pre><code>names = [<span class="code-str">'김민준'</span>, <span class="code-str">'이지훈'</span>, <span class="code-str">'고서연'</span>, <span class="code-str">'염지민'</span>]
scores = [
    [<span class="code-str">84</span>, <span class="code-str">45</span>, <span class="code-str">36</span>],
    [<span class="code-str">81</span>, <span class="code-str">76</span>, <span class="code-str">82</span>],
    [<span class="code-str">58</span>, <span class="code-str">75</span>, <span class="code-str">53</span>],
    [<span class="code-str">75</span>, <span class="code-str">93</span>, <span class="code-str">81</span>]
]

<span class="code-keyword">for</span> i <span class="code-keyword">in</span> <span class="code-keyword">range</span>(<span class="code-keyword">len</span>(scores)):
    <span class="code-keyword">print</span>(names[i], <span class="code-keyword">sum</span>(scores[i]), <span class="code-keyword">sum</span>(scores[i]) / <span class="code-str">3</span>)</code></pre>
                    </div>

                    <h2 class="section-h2">3. 딕셔너리를 이용한 성적 처리</h2>
                    <p class="section-desc"><b>핵심 개념:</b> 딕셔너리는 <b>key와 value</b>의 쌍으로 데이터를 저장합니다. 여기서는 학생 이름이 key, 세 과목 점수 리스트가 value입니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>딕셔너리 성적 처리</span></div>
                        <pre><code>class_dict = {
    <span class="code-str">'김민준'</span>: [<span class="code-str">84</span>, <span class="code-str">45</span>, <span class="code-str">36</span>],
    <span class="code-str">'이지훈'</span>: [<span class="code-str">81</span>, <span class="code-str">76</span>, <span class="code-str">82</span>],
    <span class="code-str">'고서연'</span>: [<span class="code-str">58</span>, <span class="code-str">75</span>, <span class="code-str">53</span>],
    <span class="code-str">'염지민'</span>: [<span class="code-str">75</span>, <span class="code-str">93</span>, <span class="code-str">81</span>]
}

<span class="code-keyword">for</span> name, score <span class="code-keyword">in</span> class_dict.items():
    <span class="code-keyword">print</span>(name, <span class="code-keyword">sum</span>(score), <span class="code-keyword">sum</span>(score) / <span class="code-str">3</span>)</code></pre>
                    </div>

                    <h2 class="section-h2">4. DataFrame을 이용한 성적 처리</h2>
                    <p class="section-desc"><b>정리:</b> DataFrame은 행과 열로 이루어진 표 형태의 데이터 구조입니다. 여러 데이터를 비교·계산·분석할 때 편리합니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>DataFrame 변환 및 연산</span></div>
                        <pre><code><span class="code-keyword">import</span> pandas <span class="code-keyword">as</span> pd

df_class = pd.DataFrame(class_dict)
<span class="code-keyword">print</span>(df_class.sum())
<span class="code-keyword">print</span>(df_class.mean())</code></pre>
                    </div>

                    <!-- 2장 -->
                    <h1 class="chapter-h1" style="margin-top: 48px;">☕ 2장. pandas 연습 - 카페 메뉴 데이터</h1>
                    <div class="tip-callout">
                        <b>🎯 학습 목표</b><br>
                        ✓ DataFrame의 행과 열을 선택할 수 있다.<br>
                        ✓ 조건식, isin을 이용해 필요한 데이터를 필터링할 수 있다.<br>
                        ✓ 열 추가·삭제·이름 변경을 수행할 수 있다.
                    </div>

                    <h2 class="section-h2">0. 실습 데이터 만들기</h2>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>카페 메뉴 데이터 생성 및 set_index</span></div>
                        <pre><code><span class="code-keyword">import</span> pandas <span class="code-keyword">as</span> pd

data = {
    <span class="code-str">'메뉴코드'</span>: [<span class="code-str">'M01'</span>, <span class="code-str">'M02'</span>, <span class="code-str">'M03'</span>, <span class="code-str">'M04'</span>, <span class="code-str">'M05'</span>],
    <span class="code-str">'메뉴명'</span>: [<span class="code-str">'아메리카노'</span>, <span class="code-str">'카페라떼'</span>, <span class="code-str">'카푸치노'</span>, <span class="code-str">'초코라떼'</span>, <span class="code-str">'녹차라떼'</span>],
    <span class="code-str">'카테고리'</span>: [<span class="code-str">'커피'</span>, <span class="code-str">'커피'</span>, <span class="code-str">'커피'</span>, <span class="code-str">'음료'</span>, <span class="code-str">'음료'</span>],
    <span class="code-str">'가격'</span>: [<span class="code-str">3000</span>, <span class="code-str">4000</span>, <span class="code-str">4500</span>, <span class="code-str">5000</span>, <span class="code-str">4800</span>],
    <span class="code-str">'판매량'</span>: [<span class="code-str">120</span>, <span class="code-str">95</span>, <span class="code-str">80</span>, <span class="code-str">60</span>, <span class="code-str">70</span>]
}
df = pd.DataFrame(data)
df = df.set_index(<span class="code-str">'메뉴코드'</span>)
df</code></pre>
                    </div>

                    <table class="custom-table">
                        <thead>
                            <tr><th>메뉴코드 (index)</th><th>메뉴명</th><th>카테고리</th><th>가격</th><th>판매량</th></tr>
                        </thead>
                        <tbody>
                            <tr><td><b>M01</b></td><td>아메리카노</td><td>커피</td><td>3000</td><td>120</td></tr>
                            <tr><td><b>M02</b></td><td>카페라떼</td><td>커피</td><td>4000</td><td>95</td></tr>
                            <tr><td><b>M03</b></td><td>카푸치노</td><td>커피</td><td>4500</td><td>80</td></tr>
                            <tr><td><b>M04</b></td><td>초코라떼</td><td>음료</td><td>5000</td><td>60</td></tr>
                            <tr><td><b>M05</b></td><td>녹차라떼</td><td>음료</td><td>4800</td><td>70</td></tr>

                    <h2 class="section-h2">1. 열(column) 및 행(row) 선택</h2>

                        <pre><code>df[<span class="code-str">'가격'</span>]
df[[<span class="code-str">'메뉴명'</span>, <span class="code-str">'판매량'</span>]]
df.loc[<span class="code-str">'M01'</span>]
df.iloc[<span class="code-str">2</span>]
df.loc[<span class="code-str">'M02'</span>, <span class="code-str">'가격'</span>]</code></pre>
                    </div>

                    <h2 class="section-h2">2. 조건 필터링 및 조작</h2>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>필터링 및 수정</span></div>
                        <pre><code><span class="code-comment"># 조건 필터링</span>
