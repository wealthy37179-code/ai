<!DOCTYPE html>
<html lang="ko">
<head>

    <style>

        header {
            height: 58px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
            z-index: 10;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-logo {
            font-size: 22px;
            background: #e0f2fe;
            color: #0284c7;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;

        .header-title {
            font-size: 17px;
            font-weight: 800;
            color: #0f172a;

        }
        .header-subtitle {

            font-weight: 700;
            padding: 4px 12px;

        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 58px);

        }

        .sidebar {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 16px 18px 10px 18px;
            border-bottom: 1px solid #f1f5f9;
        }
        .sidebar-section-title {
            font-size: 12px;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .menu-list {
            list-style: none;
            padding: 12px 10px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }
        .menu-item:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }
        .menu-item.active {
            background-color: #e0f2fe;
            color: #0284c7;
            font-weight: 800;
        }
        .menu-icon {
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            overflow: hidden;
        }
        .content-header {
            height: 54px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 28px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        .current-topic {
            font-size: 16px;
            font-weight: 800;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 36px 44px;
            background: #ffffff;
        }
        .article-container {
            max-width: 860px;
            margin: 0 auto;
            line-height: 1.75;
        }
        .article-title {
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .article-intro {
            font-size: 14.5px;
            color: #475569;
            background: #f8fafc;
            border-left: 4px solid #0284c7;
            padding: 14px 18px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 30px;
        }
        .chapter-h1 {
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
            margin: 38px 0 16px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #0284c7;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-h2 {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin: 24px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 6px;

        .section-desc {
            font-size: 14px;
            color: #334155;
            margin-bottom: 10px;
        }

        .code-block-wrapper {
            background: #0f172a;
            border-radius: 10px;
            margin: 12px 0 18px 0;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.08);
        }
        .code-header {
            background: #1e293b;
            padding: 7px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            color: #94a3b8;
            font-family: monospace;
        }
        .code-lang {
            color: #38bdf8;
            font-weight: 700;
        }
        pre code {
            display: block;
            padding: 14px 18px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #e2e8f0;
            overflow-x: auto;
        }
        .code-comment { color: #64748b; font-style: italic; }
        .code-keyword { color: #f472b6; font-weight: bold; }
        .code-str { color: #a5f3fc; }
        .code-num { color: #fde047; }
        .code-def { color: #67e8f9; font-weight: bold; }

        .result-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px 16px;
            margin: -6px 0 20px 0;
            font-family: 'Consolas', monospace;
            font-size: 12.5px;
            color: #334155;
            line-height: 1.55;
            overflow-x: auto;
        }

        .tip-callout {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 14px 16px;
            margin: 16px 0 24px 0;
            font-size: 13.5px;
            color: #1e40af;
            line-height: 1.6;
        }
        .insight-callout {
            background: #ecfeff;
            border: 1px solid #a5f3fc;
            border-left: 4px solid #0891b2;
            border-radius: 0 10px 10px 0;
            padding: 14px 18px;
            margin: 20px 0 28px 0;
            font-size: 13.5px;
            color: #155e75;
            line-height: 1.65;
        }

        .custom-table {
            width: 100%;
            border-collapse: collapse;
            margin: 14px 0 22px 0;
            font-size: 13px;
        }
        .custom-table th, .custom-table td {
            border: 1px solid #e2e8f0;
            padding: 9px 12px;
            text-align: left;
        }
        .custom-table th {
            background-color: #f1f5f9;
            color: #1e293b;
            font-weight: 700;
        }
        .custom-table td {
            background-color: #ffffff;
        }

        .chart-wrapper {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            overflow-x: auto;
        }
        svg text {
            font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
        }
    </style>
</head>
<body oncontextmenu="return false" ondragstart="return false">

    <header>
        <div class="header-left">
            <div class="header-logo">⚡</div>

        <div>
            <span class="badge-status">수업 진행 중</span>
        </div>
    </header>

    <div class="main-container">
        <!-- 사이드바: 5개 메인 주제 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-section-title">
                    <span>📑</span> 수업 목차 (Curriculum)
                </div>
            </div>
            
            <ul class="menu-list">
                <li class="menu-item active" onclick="selectLesson('lesson1', this)">

                <li class="menu-item" onclick="selectLesson('lesson3', this)">
                    <span class="menu-icon">🧊</span>
                    <span>03. 북극 빙하면적 변화</span>
                </li>
                <li class="menu-item" onclick="selectLesson('lesson4', this)">
                    <span class="menu-icon">🦟</span>

                <li class="menu-item" onclick="selectLesson('lesson5', this)">

        <!-- 우측 메인 뷰어 -->

                    <span id="topic-icon">🔄</span>
                    <span id="topic-title">01. 돌아보기</span>
                </div>
            </div>

            <!-- 웹 교재 본문 -->
            <div class="content-body" id="web-article-view">
                <div class="article-container" id="lesson-content">
                </div>
            </div>
        </main>

    <script>
        const lessons = {
            // [01. 돌아보기]
            lesson1: {
                title: "01. 돌아보기",
                icon: "🔄",
                html: `
                    <h1 class="article-title">1장. 파이썬의 데이터 구조</h1>
                    <div class="article-intro">
                        학습 목표<br>
                        ✓ 변수, 리스트, 딕셔너리의 특징을 설명할 수 있다.<br>
                        ✓ 같은 성적 데이터를 여러 데이터 구조로 처리해 차이를 비교할 수 있다.<br>
                        ✓ 딕셔너리를 pandas DataFrame으로 변환하고 합계와 평균을 계산할 수 있다.
                    </div>

                    <h1 class="chapter-h1">📌 1. 변수를 이용한 성적 처리</h1>
                    <p class="section-desc">핵심 개념: 변수는 하나의 값을 이름을 붙여 저장하는 가장 기본적인 데이터 저장 방법입니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>변수 선언 및 연산</span></div>
                        <pre><code>kor = <span class="code-str">80</span>
math = <span class="code-str">40</span>
eng = <span class="code-str">30</span>
total = kor + math + eng
mean = total / <span class="code-str">3</span>
<span class="code-keyword">print</span>(total, mean)</code></pre>
                    </div>
                    <div class="result-box">
                        코드 읽기: kor, math, eng에 점수를 저장하고, 세 값을 더해 total을 구한 뒤 3으로 나누어 평균 mean을 계산합니다.
                    </div>

                    <h1 class="chapter-h1">📌 2. 리스트를 이용한 성적 처리</h1>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>2차원 리스트 성적 처리</span></div>
                        <pre><code>names = [<span class="code-str">'김민준'</span>, <span class="code-str">'이지훈'</span>, <span class="code-str">'고서연'</span>, <span class="code-str">'염지민'</span>]
scores = [
    [<span class="code-str">84</span>, <span class="code-str">45</span>, <span class="code-str">36</span>],
    [<span class="code-str">81</span>, <span class="code-str">76</span>, <span class="code-str">82</span>],
    [<span class="code-str">58</span>, <span class="code-str">75</span>, <span class="code-str">53</span>],
    [<span class="code-str">75</span>, <span class="code-str">93</span>, <span class="code-str">81</span>]
]

<span class="code-keyword">for</span> i <span class="code-keyword">in</span> range(len(scores)):
    <span class="code-keyword">print</span>(names[i], sum(scores[i]), sum(scores[i]) / <span class="code-str">3</span>)</code></pre>
                    </div>
                    <div class="result-box">
                        생각하기: 학생이 많아지면 변수를 여러 개 만드는 것보다 리스트에 묶어 저장하는 것이 편리합니다.
                    </div>

                    <h1 class="chapter-h1">📌 3. 딕셔너리를 이용한 성적 처리</h1>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>딕셔너리 성적 처리</span></div>
                        <pre><code>class_dict = {
    <span class="code-str">'김민준'</span>: [<span class="code-str">84</span>, <span class="code-str">45</span>, <span class="code-str">36</span>],
    <span class="code-str">'이지훈'</span>: [<span class="code-str">81</span>, <span class="code-str">76</span>, <span class="code-str">82</span>],
    <span class="code-str">'고서연'</span>: [<span class="code-str">58</span>, <span class="code-str">75</span>, <span class="code-str">53</span>],
    <span class="code-str">'염지민'</span>: [<span class="code-str">75</span>, <span class="code-str">93</span>, <span class="code-str">81</span>]
}

<span class="code-keyword">for</span> name, score <span class="code-keyword">in</span> class_dict.items():
    <span class="code-keyword">print</span>(name, sum(score), sum(score) / <span class="code-str">3</span>)</code></pre>
                    </div>
                    <div class="result-box">
                        핵심 개념: 딕셔너리는 key와 value의 쌍으로 데이터를 저장합니다. 여기서는 학생 이름이 key, 세 과목 점수 리스트가 value입니다.
                    </div>

                    <h1 class="chapter-h1">📌 4. DataFrame을 이용한 성적 처리</h1>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>DataFrame 변환 및 연산</span></div>
                        <pre><code><span class="code-keyword">import</span> pandas <span class="code-keyword">as</span> pd

df_class = pd.DataFrame(class_dict)
df_class
<span class="code-keyword">print</span>(df_class.sum())
<span class="code-keyword">print</span>(df_class.mean())</code></pre>
                    </div>
                    <div class="insight-callout">
                        정리: DataFrame은 행과 열로 이루어진 표 형태의 데이터 구조입니다. 여러 데이터를 비교·계산·분석할 때 편리합니다.
                    </div>
                `
            },

            // [02. 판다스 기초]
            lesson2: {
                title: "02. 판다스 기초",
                icon: "🐼",
                html: `
                    <h1 class="article-title">2장. pandas 기초</h1>
                    <h1 class="chapter-h1">📌 1. 실습 데이터 만들기</h1>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>카페 메뉴 데이터 생성 및 set_index</span></div>
                        <pre><code><span class="code-keyword">import</span> pandas <span class="code-keyword">as</span> pd

data = {
    <span class="code-str">'메뉴코드'</span>: [<span class="code-str">'M01'</span>, <span class="code-str">'M02'</span>, <span class="code-str">'M03'</span>, <span class="code-str">'M04'</span>, <span class="code-str">'M05'</span>],
    <span class="code-str">'메뉴명'</span>: [<span class="code-str">'아메리카노'</span>, <span class="code-str">'카페라떼'</span>, <span class="code-str">'카푸치노'</span>, <span class="code-str">'초코라떼'</span>, <span class="code-str">'녹차라떼'</span>],
    <span class="code-str">'카테고리'</span>: [<span class="code-str">'커피'</span>, <span class="code-str">'커피'</span>, <span class="code-str">'커피'</span>, <span class="code-str">'음료'</span>, <span class="code-str">'음료'</span>],
    <span class="code-str">'가격'</span>: [<span class="code-str">3000</span>, <span class="code-str">4000</span>, <span class="code-str">4500</span>, <span class="code-str">5000</span>, <span class="code-str">4800</span>],
    <span class="code-str">'판매량'</span>: [<span class="code-str">120</span>, <span class="code-str">95</span>, <span class="code-str">80</span>, <span class="code-str">60</span>, <span class="code-str">70</span>]
}
df = pd.DataFrame(data)
df = df.set_index(<span class="code-str">'메뉴코드'</span>)
df</code></pre>
                    </div>

                    <h2 class="section-h2">1. 열(column) 선택</h2>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>단일 및 다중 열 선택</span></div>
                        <pre><code>df[<span class="code-str">'가격'</span>]
df[[<span class="code-str">'메뉴명'</span>, <span class="code-str">'판매량'</span>]]</code></pre>
                    </div>
                    <div class="result-box">
                        코드 해석: 열 하나는 df['열이름'], 여러 열은 df[['열1','열2']]처럼 대괄호를 한 번 더 사용합니다.
                    </div>

                    <h2 class="section-h2">2. 행(row) 선택</h2>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>loc 및 iloc</span></div>
                        <pre><code>df.loc[<span class="code-str">'M01'</span>]
df.iloc[<span class="code-str">2</span>]</code></pre>
                    </div>
                    <div class="result-box">
                        코드 해석: loc는 인덱스 이름(label)으로, iloc는 행의 위치 번호로 선택합니다.
                    </div>

                    <h2 class="section-h2">3. 특정 행과 열 선택</h2>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>행과 열 동시 지정</span></div>
                        <pre><code>df.loc[<span class="code-str">'M02'</span>, <span class="code-str">'가격'</span>]</code></pre>
                    </div>
                    <div class="result-box">
                        코드 해석: 행과 열을 동시에 지정하면 원하는 한 값을 선택할 수 있습니다.
                    </div>

                    <h2 class="section-h2">4. 조건 필터링</h2>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>단일 조건 필터링</span></div>
                        <pre><code>df[df[<span class="code-str">'가격'</span>] >= <span class="code-str">4000</span>]
df[df[<span class="code-str">'카테고리'</span>] == <span class="code-str">'커피'</span>]
df[df[<span class="code-str">'판매량'</span>] >= <span class="code-str">80</span>]</code></pre>
                    </div>
                    <div class="result-box">
                        코드 해석: 조건식의 결과가 True인 행만 남겨 새로운 표처럼 보여줍니다.
                    </div>

                    <h2 class="section-h2">5. 여러 조건 필터링</h2>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>다중 조건 필터링</span></div>
