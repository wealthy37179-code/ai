                        데이터 분석의 시작은 <b>'데이터를 어떤 구조로 저장하고, 무엇을 확인할 것인가?'</b>를 생각하는 것입니다.

                    <h1 class="chapter-h1">📖 1장. 파이썬의 데이터 구조</h1>

                    <h2 class="section-h2">2. 리스트를 이용한 성적 처리</h2>

                        <pre><code>names = [<span class="code-str">'김민준'</span>, <span class="code-str">'이지훈'</span>, <span class="code-str">'고서연'</span>, <span class="code-str">'염지민'</span>]

]

                    <h2 class="section-h2">3. 딕셔너리를 이용한 성적 처리</h2>

                        <pre><code>class_dict = {
    <span class="code-str">'김민준'</span>: [<span class="code-str">84</span>, <span class="code-str">45</span>, <span class="code-str">36</span>],
    <span class="code-str">'이지훈'</span>: [<span class="code-str">81</span>, <span class="code-str">76</span>, <span class="code-str">82</span>],

            },
            lesson2: {
                title: "02. 판다스 기초 문법과 데이터 기초통계",

    <span class="code-str">'키'</span>: [<span class="code-str">162</span>, <span class="code-str">178</span>, <span class="code-str">155</span>, <span class="code-str">160</span>, <span class="code-str">182</span>],

                    <div class="article-intro">

                    <h1 class="chapter-h1" style="border-bottom: 2px solid #0284c7; color: #0284c7;">

                    <p class="section-desc">1차 회귀선을 도출하여 점선 추세선을 함께 표시하고, 정량적 감소 속도를 분석합니다.</p>

                        <pre><code><span class="code-keyword">import</span> numpy <span class="code-keyword">as</span> np

<span class="code-comment"># 1차 회귀선 계수 도출</span>

plt.figure(figsize=(<span class="code-str">10</span>, <span class="code-str">5</span>))
plt.plot(df_year[<span class="code-str">'Year'</span>], df_year[<span class="code-str">'Extent'</span>], marker=<span class="code-str">'o'</span>, label=<span class="code-str">'9월 평균 빙하 면적'</span>)
plt.plot(df_year[<span class="code-str">'Year'</span>], 추세선, linestyle=<span class="code-str">'--'</span>, color=<span class="code-str">'#f97316'</span>, label=<span class="code-str">'선형 추세선'</span>)
plt.title(<span class="code-str">'북극 9월 빙하 면적 변화와 감소 추세선'</span>, fontsize=<span class="code-str">16</span>)

plt.ylabel(<span class="code-str">'빙하 면적 (백만 km²)'</span>)
plt.grid(alpha=<span class="code-str">0.3</span>)
plt.legend()
plt.show()</code></pre>

        function selectLesson(lessonKey, element) {
            const lesson = lessons[lessonKey];
            document.getElementById('topic-icon').innerText = lesson.icon;
            document.getElementById('topic-title').innerText = lesson.title;
            document.getElementById('lesson-content').innerHTML = lesson.html;
            document.getElementById('pdf-frame').src = lesson.pdf;

            const menuItems = document.querySelectorAll('.menu-item');
            menuItems.forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('web-article-view').scrollTop = 0;
        }

        function switchView(mode) {
            const webView = document.getElementById('web-article-view');
            const pdfView = document.getElementById('pdf-container');
            const btnWeb = document.getElementById('btn-web');
            const btnPdf = document.getElementById('btn-pdf');

            if (mode === 'web') {
                webView.style.display = 'block';
                pdfView.style.display = 'none';
                btnWeb.classList.add('active');
                btnPdf.classList.remove('active');
            } else {
                webView.style.display = 'none';
                pdfView.style.display = 'block';
                btnWeb.classList.remove('active');
                btnPdf.classList.add('active');
            }
        }
