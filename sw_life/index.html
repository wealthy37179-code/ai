                html: `
                    <h1 class="article-title">01. 데이터 다루기: 파이썬 데이터 구조 · pandas 연습 · 기초 통계</h1>

                    <h1 class="chapter-h1">📖 1장. 파이썬의 데이터 구조</h1>

                    <h2 class="section-h2">1. 변수를 이용한 성적 처리</h2>
                    <p class="section-desc"><b>핵심 개념:</b> 변수는 하나의 값을 이름을 붙여 저장하는 가장 기본적인 데이터 저장 방법입니다.</p>

                        <div class="code-header"><span class="code-lang">PYTHON</span><span>변수 선언 및 연산</span></div>
                        <pre><code>kor = <span class="code-str">80</span>
math = <span class="code-str">40</span>
eng = <span class="code-str">30</span>
total = kor + math + eng
mean = total / <span class="code-str">3</span>
<span class="code-keyword">print</span>(total, mean)</code></pre>
                    </div>

                    <h2 class="section-h2">2. 리스트를 이용한 성적 처리</h2>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>2차원 리스트 성적 처리</span></div>
                        <pre><code>names = [<span class="code-str">'김민준'</span>, <span class="code-str">'이지훈'</span>, <span class="code-str">'고서연'</span>, <span class="code-str">'염지민'</span>]
scores = [
    [<span class="code-str">84</span>, <span class="code-str">45</span>, <span class="code-str">36</span>],

    [<span class="code-str">75</span>, <span class="code-str">93</span>, <span class="code-str">81</span>]
]

<span class="code-keyword">for</span> i <span class="code-keyword">in</span> <span class="code-keyword">range</span>(<span class="code-keyword">len</span>(scores)):
    <span class="code-keyword">print</span>(names[i], <span class="code-keyword">sum</span>(scores[i]), <span class="code-keyword">sum</span>(scores[i]) / <span class="code-str">3</span>)</code></pre>

    <span class="code-str">'김민준'</span>: [<span class="code-str">84</span>, <span class="code-str">45</span>, <span class="code-str">36</span>],
    <span class="code-str">'이지훈'</span>: [<span class="code-str">81</span>, <span class="code-str">76</span>, <span class="code-str">82</span>],

    <span class="code-str">'염지민'</span>: [<span class="code-str">75</span>, <span class="code-str">93</span>, <span class="code-str">81</span>]

<span class="code-keyword">for</span> name, score <span class="code-keyword">in</span> class_dict.items():

                    <h1 class="chapter-h1" style="margin-top: 48px;">☕ 2장. pandas 연습 - 카페 메뉴 데이터</h1>

                        <pre><code><span class="code-keyword">import</span> pandas <span class="code-keyword">as</span> pd

data = {
    <span class="code-str">'메뉴코드'</span>: [<span class="code-str">'M01'</span>, <span class="code-str">'M02'</span>, <span class="code-str">'M03'</span>, <span class="code-str">'M04'</span>, <span class="code-str">'M05'</span>],

df = df.set_index(<span class="code-str">'메뉴코드'</span>)
df</code></pre>

                    <!-- 5. 추세선 도출 및 데이터 해석의 한계 -->
                    <h1 class="chapter-h1">📊 5. 선형 추세선(np.polyfit) 도출과 통계적 해석의 한계</h1>
                    <p class="section-desc">시간 축을 계산 가능한 정수 인덱스(0, 1, 2, 3, 4, 5)로 변환한 뒤 1차 회귀 추세선을 계산하고 분석의 한계를 점검합니다.</p>

                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>추세선 산출 및 최종 그래프</span></div>
                        <pre><code><span class="code-keyword">import</span> numpy <span class="code-keyword">as</span> np

<span class="code-comment"># 1. x축을 계산 가능한 정수로 변환</span>
x = np.arange(<span class="code-keyword">len</span>(df))  <span class="code-comment"># [0, 1, 2, 3, 4, 5]</span>
y = df[<span class="code-str">'총지수'</span>].astype(float)

<span class="code-comment"># 2. 1차 선형 회귀 추세선 계산 (기울기, 절편)</span>
기울기, 절편 = np.polyfit(x, y, <span class="code-str">1</span>)
print(f<span class="code-str">'기울기: {기울기:.2f}'</span>)
print(f<span class="code-str">'절편: {절편:.2f}'</span>)

<span class="code-comment"># 3. 추세선 수식 적용</span>
추세선 = 기울기 * x + 절편

<span class="code-comment"># 4. 시각화</span>
plt.figure(figsize=(<span class="code-str">10</span>, <span class="code-str">5</span>))
plt.plot(df.index, df[<span class="code-str">'총지수'</span>], marker=<span class="code-str">'o'</span>, label=<span class="code-str">'소비자 물가지수'</span>)
plt.plot(df.index, 추세선, linestyle=<span class="code-str">'--'</span>, label=<span class="code-str">'추세선'</span>)
plt.title(<span class="code-str">'소비자 물가지수 변화와 추세선'</span>, fontsize=<span class="code-str">18</span>)
plt.xlabel(<span class="code-str">'시기'</span>)
plt.ylabel(<span class="code-str">'소비자 물가지수'</span>)
plt.legend()
plt.grid(alpha=<span class="code-str">0.3</span>)
plt.tight_layout()
plt.show()</code></pre>

                        • <b>③ 이것으로 무엇까지 말할 수 있는가? (중요)</b> → 2026년 2월~7월 기간 동안 물가지수가 상승 경향을 보였다는 사실까지만 확정할 수 있으며, 이를 바탕으로 <b>"앞으로도 물가는 무조건 계속 오른다"라고 섣불리 미래를 단정해 예측할 수는 없습니다.</b>
                    </div>
                `
            }
        };

        // 초기 화면에 lesson1 기본 렌더링
        document.getElementById('lesson-content').innerHTML = lessons.lesson1.html;

        function selectLesson(lessonKey, element) {
            const lesson = lessons[lessonKey];
            document.getElementById('topic-icon').innerText = lesson.icon;
            document.getElementById('topic-title').innerText = lesson.title;
            document.getElementById('lesson-content').innerHTML = lesson.html;

            const menuItems = document.querySelectorAll('.menu-item');
            menuItems.forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('web-article-view').scrollTop = 0;
        }
    </script>
</body>
