    <script>
        const lessons = {
            lesson1: {
                title: "01. turtle 모듈",
                icon: "🐢",
                html: `
                    <h1 class="article-title">파이썬 turtle 모듈 프로젝트</h1>
                    <div class="article-intro">
                        turtle은 화면 속 거북이를 움직이며 선과 도형을 그릴 수 있는 파이썬 모듈입니다.
                    </div>

                    <h1 class="chapter-h1">🐢 [1차시] turtle 시작하기 - 거북이와 도화지 만들기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 명령을 내린 순서대로 거북이가 이동하기 때문에 프로그램의 실행 흐름을 눈으로 확인하기 좋습니다. 먼저 화면의 크기와 제목을 정하고 거북이의 모양, 속도, 선 색상을 바꾸어 turtle 프로그램의 기본 구조를 익힙니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
setup(<span class="code-num">700</span>, <span class="code-num">500</span>)
title(<span class="code-str">"나의 첫 turtle 프로그램"</span>)
bgcolor(<span class="code-str">"white"</span>)
shape(<span class="code-str">"turtle"</span>)
color(<span class="code-str">"navy"</span>)
speed(<span class="code-num">3</span>)
forward(<span class="code-num">150</span>)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>setup(700, 500)</code> : 그림을 그릴 도화지의 가로와 세로 크기를 정합니다.<br>
                        • <code>shape("turtle")</code> : 화면에서 움직이는 커서의 모양을 거북이로 설정합니다.<br>
                        • <code>forward(150)</code>: 거북이가 바라보는 방향으로 150만큼 앞으로 이동하며 선을 그립니다.<br>
                        • <code>done()</code> : 그림이 완성된 뒤 창이 바로 닫히지 않도록 turtle 실행을 유지합니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🔄 [2차시] 이동과 회전 - 사각형 그리기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> turtle에서 가장 기본적인 명령은 앞으로 이동하는 forward()와 방향을 바꾸는 left(), right()입니다. 거북이의 이동 거리와 회전 각도를 조합하면 여러 가지 도형을 만들 수 있습니다. 정사각형은 같은 길이의 선을 그리고 90도씩 방향을 바꾸는 동작을 네 번 반복하면 완성됩니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
setup(<span class="code-num">600</span>, <span class="code-num">600</span>)
shape(<span class="code-str">"turtle"</span>)
speed(<span class="code-num">2</span>)
forward(<span class="code-num">150</span>)
left(<span class="code-num">90</span>)
forward(<span class="code-num">150</span>)
left(<span class="code-num">90</span>)
forward(<span class="code-num">150</span>)
left(<span class="code-num">90</span>)
forward(<span class="code-num">150</span>)
left(<span class="code-num">90</span>)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>forward(150)</code>: 현재 바라보는 방향으로 150만큼 이동합니다.<br>
                        • <code>left(90)</code> : 현재 방향을 기준으로 왼쪽으로 90도 회전합니다.<br>
                        • 이동 + 회전 : 선분 하나를 그리고 방향을 바꾸는 과정을 반복하여 도형을 만듭니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🔁 [3차시] 반복문으로 도형 간단하게 만들기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 같은 명령을 여러 번 작성하면 코드가 길어지고 수정하기도 어렵습니다. for 반복문을 사용하면 같은 동작을 원하는 횟수만큼 반복할 수 있습니다. 정삼각형은 120도, 정사각형은 90도처럼 한 바퀴 360도를 변의 수로 나누어 회전 각도를 정할 수 있습니다. 이를 이용해 정다각형을 그려 봅니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
setup(<span class="code-num">600</span>, <span class="code-num">600</span>)
shape(<span class="code-str">"turtle"</span>)
speed(<span class="code-num">3</span>)
sides = <span class="code-num">6</span>
length = <span class="code-num">100</span>
angle = <span class="code-num">360</span> / sides
<span class="code-keyword">for</span>   <span class="code-keyword">in</span> range(sides):
    forward(length)
    left(angle)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>sides = 6</code>: 그릴 도형의 변의 수를 정합니다. 6이면 정육각형이 됩니다.<br>
                        • <code>angle = 360 / sides</code>: 한 바퀴 360도를 변의 수로 나누어 매번 회전할 각도를 계산합니다.<br>
                        • <code>for   in range(sides):</code> 변의 수만큼 이동과 회전을 반복합니다. 반복 변수의 값이 필요 없을 때를 사용할 수 있습니다.
                    </div>

                    <h1 class="chapter-h1" style="margin-top: 50px;">🎨 [4차시] 펜과 색상 다루기 - 색이 있는 도형 만들기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> turtle은 선을 그리는 것뿐 아니라 펜의 굵기와 색상을 바꾸고 도형 내부를 색으로 채울 수도 있습니다. pensize()는 선의 굵기를, pencolor()는 선 색을 정합니다. begin_fill()과 end_fill() 사이에서 그린 닫힌 도형은 fillcolor()로 지정한 색으로 채워집니다.</p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
setup(<span class="code-num">600</span>, <span class="code-num">600</span>)
shape(<span class="code-str">"turtle"</span>)
speed(<span class="code-num">3</span>)
pensize(<span class="code-num">4</span>)
pencolor(<span class="code-str">"darkgreen"</span>)
fillcolor(<span class="code-str">"lightgreen"</span>)
begin_fill()
<span class="code-keyword">for</span>   <span class="code-keyword">in</span> range(<span class="code-num">3</span>):
    forward(<span class="code-num">180</span>)
    left(<span class="code-num">120</span>)
end_fill()</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>pensize(4)</code>: 거북이가 그리는 선의 굵기를 4로 설정합니다.<br>
                        • <code>pencolor()</code> : 도형의 테두리에 사용할 선 색상을 지정합니다.<br>
                        • <code>fillcolor()</code> : 도형 내부를 채울 색상을 지정합니다.<br>
                        • <code>begin_fill()</code> / <code>end_fill()</code> : 두 명령 사이에서 그린 닫힌 영역을 지정한 색으로 채웁니다.
                    </div>
                `
            },

            lesson2: {
                title: "02. 리스트",
                icon: "📋",
                html: `
                    <h1 class="article-title">파이썬 리스트(List)</h1>
                    <div class="article-intro">
                        데이터를 순서대로 여러 개 묶어서 관리하는 파이썬의 가장 기본적인 자료구조인 리스트를 생성하고, 값을 꺼내고 자르고 바꾸는 핵심 조작법을 학습합니다.
                    </div>

                    <h1 class="chapter-h1">🧺 [1차시] 리스트 생성과 데이터 묶기</h1>
