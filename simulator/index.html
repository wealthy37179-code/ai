    <script>
        // 전역 변수 설정
        let currentSimulation = 'lesson1';
        let currentDepth = 0;
        let animationId = null;
        let canvas, ctx;
        
        // 원주율 시뮬레이션용 변수
        let piPointsTotal = 0;
        let piPointsInside = 0;
        let piIsRunning = false;

        // 스택/큐 시뮬레이션용 변수
        let stackData = [];
        let queueData = [];
        const MAX_SIZE = 5;

        // ---------------------------------------------------------
        // 1. 각 레슨(메뉴)별 HTML 콘텐츠 정의
        // ---------------------------------------------------------
        const lessons = {
            lesson1: {
                title: "01. turtle 모듈",
                icon: "🐢",
                html: `
                    <h1 class="article-title">파이썬 터틀(Turtle) 모듈</h1>
                    <div class="article-intro">
                        거북이를 이동시키고 제어하는 터틀 모듈의 기초부터, 반복문, 함수(def), 재귀 호출(Recursion)을 결합하여 프랙탈 도형을 그리는 전체 과정을 1~9차시에 걸쳐 학습합니다.
                    </div>

                    <h1 class="chapter-h1">🐢 [1차시] 터틀 모듈 첫걸음과 기본 이동</h1>
                    <p class="section-desc">핵심 개념 설명: 파이썬에서 화면에 그림을 그리기 위해 거북이를 불러옵니다. 거북이는 우리가 지시하는 방향과 거리만큼 움직이며 선을 남깁니다. 그리기 위한 가장 기초적인 펜의 역할을 익힙니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
<span class="code-comment"># 거북이 모양 커서로 설정</span>
shape(<span class="code-str">"turtle"</span>)

<span class="code-comment"># 거북이 이동 명령</span>
forward(<span class="code-num">100</span>)
right(<span class="code-num">90</span>)
forward(<span class="code-num">100</span>)

<span class="code-comment"># 실행 완료 후 창 유지</span>
done()</code></pre>
                    </div>

                    <h1 class="chapter-h1">🔄 [2차시] 반복문(for)으로 다각형 그리기</h1>
                    <p class="section-desc">핵심 개념 설명: 사각형을 그리려면 전진과 회전을 4번 반복해야 합니다. 코드를 일일이 4번 적는 대신 반복문을 사용하면 코드를 짧고 효율적으로 작성할 수 있습니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
shape(<span class="code-str">"turtle"</span>)
pensize(<span class="code-num">3</span>)

<span class="code-comment"># 4번 반복하여 정사각형 그리기</span>
<span class="code-keyword">for</span> i <span class="code-keyword">in</span> range(<span class="code-num">4</span>):
    forward(<span class="code-num">100</span>)
    left(<span class="code-num">90</span>)
done()</code></pre>
                    </div>

                    <h1 class="chapter-h1">✏️ [3차시] 펜 들기(penup)와 내리기(pendown)</h1>
                    <p class="section-desc">핵심 개념 설명: 화면 여러 위치에 흩어진 조각들을 그리려면 선을 그리지 않고 거북이를 이동시키는 기술이 필수적입니다. 종이에서 펜을 살짝 떼어 이동하고 다시 내려놓는 원리입니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
shape(<span class="code-str">"turtle"</span>)
forward(<span class="code-num">50</span>)

<span class="code-comment"># 선을 끊고 이동하기</span>
penup()
forward(<span class="code-num">50</span>)

<span class="code-comment"># 다시 선을 그리기</span>
pendown()
forward(<span class="code-num">50</span>)
done()</code></pre>
                    </div>

                    <h1 class="chapter-h1">📍 [4차시] 절대 좌표 이동 (goto)</h1>
                    <p class="section-desc">핵심 개념 설명: 화면의 정중앙은 x=0 y=0인 원점입니다. 거북이가 현재 바라보는 방향과 무관하게 특정 목적지로 곧바로 날아가게 만들려면 절대 좌표를 이용해야 합니다. 삼각형의 세 꼭짓점을 정확히 잡는 데 사용됩니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
shape(<span class="code-str">"turtle"</span>)

<span class="code-comment"># 삼각형의 세 꼭짓점 좌표</span>
A = (<span class="code-num">0</span>, <span class="code-num">100</span>)
B = (-<span class="code-num">100</span>, -<span class="code-num">50</span>)
C = (<span class="code-num">100</span>, -<span class="code-num">50</span>)

penup()
goto(A[<span class="code-num">0</span>], A[<span class="code-num">1</span>])  <span class="code-comment"># A 꼭짓점으로 점프</span>
pendown()
goto(B[<span class="code-num">0</span>], B[<span class="code-num">1</span>])  <span class="code-comment"># B로 선 긋기</span>
goto(C[<span class="code-num">0</span>], C[<span class="code-num">1</span>])  <span class="code-comment"># C로 선 긋기</span>
goto(A[<span class="code-num">0</span>], A[<span class="code-num">1</span>])  <span class="code-comment"># 다시 A로 돌아오기</span>
done()</code></pre>
                    </div>

                    <h1 class="chapter-h1">🎨 [5차시] 도형 내부에 색상 채우기</h1>
                    <p class="section-desc">핵심 개념 설명: 테두리만 있는 도형 내부를 색으로 칠하면 수많은 삼각형이 겹쳐지는 구조를 훨씬 뚜렷하게 관찰할 수 있습니다. 색칠을 시작할 곳과 끝날 곳을 거북이에게 알려주는 방식을 배웁니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
color(<span class="code-str">"blue"</span>, <span class="code-str">"skyblue"</span>) <span class="code-comment"># 테두리 파랑, 내부 하늘색</span>

<span class="code-comment"># 색칠 시작 준비</span>
begin_fill()
<span class="code-keyword">for</span> _ <span class="code-keyword">in</span> range(<span class="code-num">3</span>):
    forward(<span class="code-num">120</span>)
    left(<span class="code-num">120</span>)
<span class="code-comment"># 색칠 끝내고 채우기</span>
end_fill()
done()</code></pre>

                    <h1 class="chapter-h1">🌀 [6차시] 중첩 반복문으로 기하학 패턴 만들기</h1>

        // ---------------------------------------------------------
        // 4. 눈송이 삼각형
        // ---------------------------------------------------------
        function drawKochSnowflake(depth) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#0ea5e9"; 
            ctx.lineWidth = 1.5;

            const size = 260; 
            const R = size / Math.sqrt(3);
            const r = R / 2;

            const p1 = { x: 0, y: -R };
            const p2 = { x: size/2, y: r };
            const p3 = { x: -size/2, y: r };

            let points = [];
            points.push(p1);
            getKochPoints(p1, p2, depth, points);
            getKochPoints(p2, p3, depth, points);
            getKochPoints(p3, p1, depth, points);

            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;
            for(let p of points) {
                if(p.x < minX) minX = p.x;
                if(p.x > maxX) maxX = p.x;
                if(p.y < minY) minY = p.y;
                if(p.y > maxY) maxY = p.y;
            }

            const bboxCenterX = (minX + maxX) / 2;
            const bboxCenterY = (minY + maxY) / 2;
            const offsetX = canvas.width / 2 - bboxCenterX;
            const offsetY = canvas.height / 2 - bboxCenterY;

            ctx.beginPath();
            ctx.moveTo(points[0].x + offsetX, points[0].y + offsetY);
            for(let i=1; i<points.length; i++) {
                ctx.lineTo(points[i].x + offsetX, points[i].y + offsetY);
            }
            ctx.closePath();
            ctx.stroke();

            document.getElementById('val-depth').innerText = depth + "단계";
            document.getElementById('val-count').innerText = (points.length - 1) + "개";
        }

        function getKochPoints(p1, p2, depth, points) {
            if (depth === 0) {
                points.push(p2);
                return;
            }
            
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const pA = { x: p1.x + dx/3, y: p1.y + dy/3 };
            const pC = { x: p1.x + dx*2/3, y: p1.y + dy*2/3 };
            
            const angle = Math.PI / 3; 
            const pB = {
                x: pA.x + (pC.x - pA.x) * Math.cos(angle) + (pC.y - pA.y) * Math.sin(angle),
                y: pA.y - (pC.x - pA.x) * Math.sin(angle) + (pC.y - pA.y) * Math.cos(angle)
            };

            getKochPoints(p1, pA, depth - 1, points);
            getKochPoints(pA, pB, depth - 1, points);
            getKochPoints(pB, pC, depth - 1, points);
            getKochPoints(pC, p2, depth - 1, points);
        }

        // ---------------------------------------------------------
        // 5. 시어핀스키 삼각형
        // ---------------------------------------------------------
        function drawSierpinski(depth) {

            const size = 360;
            const h = size * Math.sqrt(3) / 2;

            const p1 = { x: 0, y: -h/2 }; 
            const p2 = { x: -size/2, y: h/2 }; 
            const p3 = { x: size/2, y: h/2 }; 

            const offsetX = canvas.width / 2;
            const offsetY = canvas.height / 2;

            let count = drawSierpTriangle(
                {x: p1.x + offsetX, y: p1.y + offsetY}, 
                {x: p2.x + offsetX, y: p2.y + offsetY}, 
                {x: p3.x + offsetX, y: p3.y + offsetY}, 
                depth
            );

            document.getElementById('val-depth').innerText = depth + "단계";
            document.getElementById('val-count').innerText = count + "개";
        }

        function drawSierpTriangle(p1, p2, p3, depth) {
            if (depth === 0) {
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.lineTo(p3.x, p3.y);
                ctx.closePath();
                ctx.fillStyle = "rgba(2, 132, 199, 0.7)"; 
                ctx.fill();
                ctx.strokeStyle = "#0284c7";
                ctx.stroke();
                return 1;
            }

            const m1 = { x: (p1.x + p2.x)/2, y: (p1.y + p2.y)/2 };
            const m2 = { x: (p2.x + p3.x)/2, y: (p2.y + p3.y)/2 };
            const m3 = { x: (p3.x + p1.x)/2, y: (p3.y + p1.y)/2 };

            let triangles = 0;
            triangles += drawSierpTriangle(p1, m1, m3, depth - 1);
            triangles += drawSierpTriangle(m1, p2, m2, depth - 1);
            triangles += drawSierpTriangle(m3, m2, p3, depth - 1);
            return triangles;
        }

        // ---------------------------------------------------------
        // 6. 몬테카를로 원주율 (Pi)
        // ---------------------------------------------------------
        function initPiCanvas() {
            canvas = document.getElementById('sim-canvas');
            ctx = canvas.getContext('2d');
            resetPi();
        }

        function drawPiBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = "#cbd5e1";
            ctx.lineWidth = 1;
            ctx.strokeRect(10, 10, 380, 380);

            ctx.beginPath();
            ctx.arc(200, 200, 190, 0, 2 * Math.PI);
            ctx.fillStyle = "#f8fafc";
            ctx.fill();
            ctx.strokeStyle = "#0ea5e9";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.setLineDash([4, 4]);
            ctx.moveTo(10, 200);
            ctx.lineTo(390, 200);
            ctx.moveTo(200, 10);
            ctx.lineTo(200, 390);
            ctx.strokeStyle = "#e2e8f0";
            ctx.stroke();
            ctx.setLineDash([]); 
        }

        function resetPi(clearActiveButtons = true) {
            piIsRunning = false;
            cancelAnimationFrame(animationId);
            piPointsTotal = 0;
            piPointsInside = 0;
            
            const btn = document.getElementById('pi-start-btn');
            if(btn) {
                btn.innerText = "연속 실행 (Play)";
            }

            if(clearActiveButtons) {
                const buttons = document.querySelectorAll('#pi-amount-buttons .sim-btn');
                buttons.forEach(b => b.classList.remove('active'));
            }

            drawPiBackground();
            updatePiUI();
        }

        function togglePi() {
            piIsRunning = !piIsRunning;
            const btn = document.getElementById('pi-start-btn');
            
            if(piIsRunning) {
                btn.innerText = "일시 정지 (Pause)";
                const buttons = document.querySelectorAll('#pi-amount-buttons .sim-btn');
                buttons.forEach(b => b.classList.remove('active'));
                loopPi();
            } else {
                btn.innerText = "연속 실행 (Play)";
                cancelAnimationFrame(animationId);
            }
        }

        function addPiPoints(amount, btnElement) {
            resetPi(false); 
            
            const buttons = document.querySelectorAll('#pi-amount-buttons .sim-btn');
            buttons.forEach(b => b.classList.remove('active'));
            if(btnElement) {
                btnElement.classList.add('active');
            }

            for(let i=0; i<amount; i++) {
                drawSinglePiPoint();
            }
            updatePiUI();
        }

        function loopPi() {
            if(!piIsRunning) return;

            let pointsToDraw = 100;
            if (piPointsTotal + pointsToDraw >= 10000) {
                pointsToDraw = 10000 - piPointsTotal;
                piIsRunning = false; 
                document.getElementById('pi-start-btn').innerText = "연속 실행 (Play)";
            }

            for(let i=0; i<pointsToDraw; i++) {
                drawSinglePiPoint();
            }

            updatePiUI();

            if(piIsRunning) {
                animationId = requestAnimationFrame(loopPi);
            }
        }

        function drawSinglePiPoint() {
            const x = 10 + Math.random() * 380;
            const y = 10 + Math.random() * 380;
            
            const dist = Math.sqrt((x - 200)**2 + (y - 200)**2);
            
            ctx.beginPath();
            ctx.arc(x, y, 1.2, 0, 2*Math.PI);

            if(dist <= 190) {
                piPointsInside++;
                ctx.fillStyle = "rgba(14, 165, 233, 0.6)"; 
            } else {
                ctx.fillStyle = "rgba(148, 163, 184, 0.4)"; 
            }
            ctx.fill();
            piPointsTotal++;
        }

        function updatePiUI() {
            document.getElementById('pi-total').innerText = piPointsTotal.toLocaleString() + "개";
            
            let piValue = 0;
            if(piPointsTotal > 0) {
                piValue = 4 * (piPointsInside / piPointsTotal);
            }
            document.getElementById('pi-calc').innerText = piValue.toFixed(4);
        }

        // ---------------------------------------------------------
        // 7. 스택(Stack) 시뮬레이션
        // ---------------------------------------------------------
        function initStackCanvas() {
            canvas = document.getElementById('sim-canvas');
            ctx = canvas.getContext('2d');
            stackData = [];
            drawStack();
        }

        function drawStack() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 컨테이너 그리기
            ctx.beginPath();
            ctx.moveTo(140, 100);
            ctx.lineTo(140, 350);
            ctx.lineTo(260, 350);
            ctx.lineTo(260, 100);
            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 4;
            ctx.stroke();

            // 블록 그리기
            ctx.font = "bold 15px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            for(let i=0; i<stackData.length; i++) {
                let x = 150;
                let y = 300 - (i * 45); // 쌓아 올리는 위치

                ctx.fillStyle = "#bae6fd"; // lightblue
                ctx.fillRect(x, y, 100, 40);
                
                ctx.strokeStyle = "#0284c7";
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, 100, 40);

                ctx.fillStyle = "#0f172a";
                ctx.fillText(stackData[i], x + 50, y + 20);
            }

            document.getElementById('stack-size').innerText = `${stackData.length} / ${MAX_SIZE}`;
        }

        function pushStack() {
            const inputEl = document.getElementById('stack-input');
            const val = inputEl.value.trim();
            
            if (stackData.length >= MAX_SIZE) {
                document.getElementById('stack-msg').innerText = "오버플로우 (Overflow)!";
                document.getElementById('stack-msg').style.color = "#dc2626";
                return;
            }
            
            const dataToPush = val === "" ? "Data" : val;
            stackData.push(dataToPush);
            inputEl.value = "";
            
            document.getElementById('stack-msg').innerText = `'${dataToPush}' PUSH 성공`;
            document.getElementById('stack-msg').style.color = "#059669";
            
            drawStack();
        }

        function popStack() {
            if (stackData.length === 0) {
                document.getElementById('stack-msg').innerText = "언더플로우 (Underflow)!";
                document.getElementById('stack-msg').style.color = "#dc2626";
                return;
            }
            
            const removed = stackData.pop();
            document.getElementById('stack-msg').innerText = `'${removed}' POP 성공`;
            document.getElementById('stack-msg').style.color = "#2563eb";
            
            drawStack();
        }

        // ---------------------------------------------------------
        // 8. 큐(Queue) 시뮬레이션
        // ---------------------------------------------------------
        function initQueueCanvas() {
            canvas = document.getElementById('sim-canvas');
            ctx = canvas.getContext('2d');
            queueData = [];
            // 컨텍스트 환경 초기화 (UI 밀림 현상 완벽 차단)
            ctx.textBaseline = "alphabetic";
            drawQueue();
        }

        function drawQueue() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 컨테이너 그리기 (가로 형태)
            ctx.beginPath();
            ctx.moveTo(40, 180);
            ctx.lineTo(360, 180);
            ctx.moveTo(40, 240);
            ctx.lineTo(360, 240);
            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 4;
            ctx.stroke();

            // 라벨 텍스트 (명시적으로 textBaseline을 bottom으로 고정)
            ctx.font = "bold 14px sans-serif";
            ctx.textBaseline = "bottom";
            ctx.fillStyle = "#2563eb";
            
            ctx.textAlign = "left";
            ctx.fillText("OUT (front)", 40, 170);
            
            ctx.textAlign = "right";
            ctx.fillText("IN (rear)", 360, 170);

            // 블록 그리기 (텍스트 기준점 middle로 변경)
            ctx.font = "bold 14px sans-serif";
            ctx.textBaseline = "middle";
            ctx.textAlign = "center";

            for(let i=0; i<queueData.length; i++) {
                let x = 50 + (i * 60);
                let y = 190;

                ctx.fillStyle = "#bae6fd";
                ctx.fillRect(x, y, 50, 40);
                
                ctx.strokeStyle = "#0284c7";
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, 50, 40);

                ctx.fillStyle = "#0f172a";
                ctx.fillText(queueData[i], x + 25, y + 20);
            }

            document.getElementById('queue-size').innerText = `${queueData.length} / ${MAX_SIZE}`;
        }

        function enqueueData() {
            const inputEl = document.getElementById('queue-input');
            const val = inputEl.value.trim();
            
            if (queueData.length >= MAX_SIZE) {
                document.getElementById('queue-msg').innerText = "오버플로우 (Overflow)!";
                document.getElementById('queue-msg').style.color = "#dc2626";
                return;
            }
            
            const dataToEnq = val === "" ? "Data" : val;
            queueData.push(dataToEnq);
            inputEl.value = "";
            
            document.getElementById('queue-msg').innerText = `'${dataToEnq}' Enqueue 성공`;
            document.getElementById('queue-msg').style.color = "#059669";
            
            drawQueue();
        }

        function dequeueData() {
            if (queueData.length === 0) {
                document.getElementById('queue-msg').innerText = "언더플로우 (Underflow)!";
                document.getElementById('queue-msg').style.color = "#dc2626";
                return;
            }
            
            const removed = queueData.shift(); 
            document.getElementById('queue-msg').innerText = `'${removed}' Dequeue 성공`;
            document.getElementById('queue-msg').style.color = "#2563eb";
            
            drawQueue();
        }

        // 최초 구동
        window.onload = () => {
            selectLesson('lesson1', document.querySelector('.menu-item'));
        }
    </script>
