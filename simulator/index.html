    <script>
        let currentSimulation = 'lesson1';
        let currentDepth = 0;
        let animationId = null;
        let canvas, ctx;

        let piIsRunning = false;

        const MAX_SIZE = 5;

        const lessons = {
  lesson1: { title: "01. turtle 모듈", icon: "🐢", html: `<h1 class="article-title">파이썬 터틀(Turtle) 모듈</h1>
<div class="article-intro">거북이를 이동시키고 제어하는 터틀 모듈의 기초부터, 반복문, 함수(def), 재귀 호출(Recursion)을 결합하여 프랙탈 도형을 그리는 전체 과정을 1~9차시에 걸쳐 학습합니다.</div>
<h1 class="chapter-h1">🐢 [1차시] 터틀 모듈 첫걸음과 기본 이동</h1>
<p class="section-desc">핵심 개념 설명: 파이썬에서 화면에 그림을 그리기 위해 거북이를 불러옵니다. 거북이는 우리가 지시하는 방향과 거리만큼 움직이며 선을 남깁니다. 그리기 위한 가장 기초적인 펜의 역할을 익힙니다.</p>
<div class="code-block-wrapper"><div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div><pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
<span class="code-comment"># 거북이 모양 커서로 설정</span>
shape(<span class="code-str">"turtle"</span>)

<span class="code-comment"># 거북이 이동 명령</span>
forward(<span class="code-num">100</span>)
right(<span class="code-num">90</span>)
forward(<span class="code-num">100</span>)

<span class="code-comment"># 실행 완료 후 창 유지</span>
done()</code></pre></div>
<div class="result-box"><b>🔍 코드 톺아보기</b><br>• <code>from turtle import *</code> : 거북이 그래픽 모듈을 불러오고 앞으로 편하게 t라는 별명으로 부릅니다.<br>• <code>shape(turtle)</code>: 화면에 나타나는 마우스 커서의 모양을 실제 거북이 형태로 바꾸어 시각적인 재미를 줍니다.<br>• <code>forward(100)</code>: 거북이가 현재 바라보고 있는 방향으로 100픽셀만큼 직진하며 궤적에 선을 긋습니다.<br>• <code>right(90)</code> : 거북이의 머리 방향을 제자리에서 오른쪽으로 90도 회전합니다.</div>
<h1 class="chapter-h1">🔄 [2차시] 반복문(for)으로 다각형 그리기</h1>
<p class="section-desc">핵심 개념 설명: 사각형을 그리려면 전진과 회전을 4번 반복해야 합니다. 코드를 일일이 4번 적는 대신 반복문을 사용하면 코드를 짧고 효율적으로 작성할 수 있습니다.</p>
<div class="code-block-wrapper"><div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div><pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
shape(<span class="code-str">"turtle"</span>)
pensize(<span class="code-num">3</span>)

<span class="code-comment"># 4번 반복하여 정사각형 그리기</span>
<span class="code-keyword">for</span> i <span class="code-keyword">in</span> <span class="code-keyword">range</span>(<span class="code-num">4</span>):
    forward(<span class="code-num">100</span>)
    left(<span class="code-num">90</span>)
done()</code></pre></div>
<div class="result-box"><b>🔍 코드 톺아보기</b><br>• <code>for _ in range(4):</code> : 들여쓰기된 아래의 코드 블록을 정확히 4번 반복 실행하라는 의미입니다.<br>• <code>left(90)</code>: 왼쪽으로 90도 꺾습니다. 만약 정삼각형을 그린다면 외각인 120도를 회전하도록 수정해야 합니다.<br>• <code>pensize(3)</code>: 거북이가 그리는 선의 굵기를 3픽셀로 설정하여 더 또렷한 선을 얻습니다.</div>
<h1 class="chapter-h1">✏️ [3차시] 펜 들기(penup)와 내리기(pendown)</h1>
<p class="section-desc">핵심 개념 설명: 화면 여러 위치에 흩어진 조각들을 그리려면 선을 그리지 않고 거북이를 이동시키는 기술이 필수적입니다. 종이에서 펜을 살짝 떼어 이동하고 다시 내려놓는 원리입니다.</p>
<div class="code-block-wrapper"><div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div><pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
shape(<span class="code-str">"turtle"</span>)
forward(<span class="code-num">50</span>)

<span class="code-comment"># 선을 끊고 이동하기</span>
penup()
forward(<span class="code-num">50</span>)

<span class="code-comment"># 다시 선을 그리기</span>
pendown()
forward(<span class="code-num">50</span>)
done()</code></pre></div>
<div class="result-box"><b>🔍 코드 톺아보기</b><br>• <code>penup()</code>: 거북이가 이동할 때 바닥에 선이 그려지지 않도록 펜을 위로 들어 올립니다.<br>• <code>pendown()</code>: 다시 선을 그리며 이동할 수 있도록 펜을 바닥에 내려놓습니다.</div>
<h1 class="chapter-h1">📍 [4차시] 절대 좌표 이동 (goto)</h1>
<p class="section-desc">핵심 개념 설명: 화면의 정중앙은 x=0 y=0인 원점입니다. 거북이가 현재 바라보는 방향과 무관하게 특정 목적지로 곧바로 날아가게 만들려면 절대 좌표를 이용해야 합니다. 삼각형의 세 꼭짓점을 정확히 잡는 데 사용됩니다.</p>
<div class="code-block-wrapper"><div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div><pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
shape(<span class="code-str">"turtle"</span>)

<span class="code-comment"># 삼각형의 세 꼭짓점 좌표</span>
A = (<span class="code-num">0</span>, <span class="code-num">100</span>)
B = (-<span class="code-num">100</span>, -<span class="code-num">50</span>)
C = (<span class="code-num">100</span>, -<span class="code-num">50</span>)

penup()
goto(A[<span class="code-num">0</span>], A[<span class="code-num">1</span>])  <span class="code-comment"># A 꼭짓점으로 점프</span>
pendown()
goto(B[<span class="code-num">0</span>], B[<span class="code-num">1</span>])  <span class="code-comment"># B로 선 긋기</span>
goto(C[<span class="code-num">0</span>], C[<span class="code-num">1</span>])  <span class="code-comment"># C로 선 긋기</span>
goto(A[<span class="code-num">0</span>], A[<span class="code-num">1</span>])  <span class="code-comment"># 다시 A로 돌아오기</span>
done()</code></pre></div>
<div class="result-box"><b>🔍 코드 톺아보기</b><br>• <code>A = (0, 100)</code>: x좌표 0, y좌표 100이라는 두 개의 값을 하나의 튜플 형태로 변수 A에 저장합니다.<br>• <code>goto(x, y)</code> : 거북이가 방향을 돌릴 필요 없이 지정된 x, y 좌표로 곧바로 직진하여 이동합니다.</div>
<h1 class="chapter-h1">🎨 [5차시] 도형 내부에 색상 채우기</h1>
<p class="section-desc">핵심 개념 설명: 테두리만 있는 도형 내부를 색으로 칠하면 수많은 삼각형이 겹쳐지는 구조를 훨씬 뚜렷하게 관찰할 수 있습니다. 색칠을 시작할 곳과 끝날 곳을 거북이에게 알려주는 방식을 배웁니다.</p>
<div class="code-block-wrapper"><div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div><pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
color(<span class="code-str">"blue"</span>, <span class="code-str">"skyblue"</span>) <span class="code-comment"># 테두리 파랑, 내부 하늘색</span>

<span class="code-comment"># 색칠 시작 준비</span>
begin_fill()
<span class="code-keyword">for</span> _ <span class="code-keyword">in</span> <span class="code-keyword">range</span>(<span class="code-num">3</span>):
    forward(<span class="code-num">120</span>)
    left(<span class="code-num">120</span>)
<span class="code-comment"># 색칠 끝내고 채우기</span>
end_fill()
done()</code></pre></div>
<div class="result-box"><b>🔍 코드 톺아보기</b><br>• <code>color(테두리색, 채우기색)</code> : 거북이가 그릴 선의 색상과 도형 내부를 채울 색상을 동시에 설정합니다.<br>• <code>begin_fill()</code>: 지금부터 이동하는 궤적의 내부를 색칠할 것이라고 거북이에게 신호를 줍니다.<br>• <code>end_fill()</code> : 도형의 테두리가 완전히 닫히면 지정해둔 색상으로 내부를 가득 채웁니다.</div>
<h1 class="chapter-h1">🌀 [6차시] 중첩 반복문으로 기하학 패턴 만들기</h1>
<p class="section-desc">핵심 개념 설명: 반복문 안에 또 다른 반복문을 넣으면 도형을 그리면서 동시에 회전하는 화려한 대칭 패턴을 쉽게 그릴 수 있습니다. 반복적이고 대칭적인 성질을 이해하는 좋은 기초가 됩니다.</p>
<div class="code-block-wrapper"><div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div><pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
speed(<span class="code-num">0</span>) <span class="code-comment"># 거북이 속도 최대</span>

<span class="code-comment"># 바깥쪽 반복문: 전체 도형을 12번 회전</span>
<span class="code-keyword">for</span> i <span class="code-keyword">in</span> <span class="code-keyword">range</span>(<span class="code-num">12</span>):
    <span class="code-comment"># 안쪽 반복문: 기본 정삼각형 그리기</span>
    <span class="code-keyword">for</span> j <span class="code-keyword">in</span> <span class="code-keyword">range</span>(<span class="code-num">3</span>):
        forward(<span class="code-num">100</span>)
        left(<span class="code-num">120</span>)
    right(<span class="code-num">30</span>) <span class="code-comment"># 삼각형 하나 그리고 30도 회전</span>
done()</code></pre></div>
<div class="result-box"><b>🔍 코드 톺아보기</b><br>• <code>speed(0)</code>: 거북이 애니메이션 속도를 가장 빠르게(0) 설정하여 복잡한 그림도 순식간에 그리도록 합니다.<br>• <b>중첩 for문</b> : 안쪽 for문이 3번 돌아 삼각형 하나를 완성하면, 바깥쪽 for문이 거북이를 30도 돌린 후 다시 안쪽 for문을 작동시키는 원리입니다.</div>
<h1 class="chapter-h1">🔲 [7차시] 함수(def)로 나만의 삼각형 도장 만들기</h1>
<p class="section-desc">핵심 개념 설명: 삼각형을 그릴 때 삼각형을 그리는 코드를 수백 번 적을 수는 없습니다. 세 꼭짓점 좌표를 전달받아 삼각형을 자동으로 그려주는 코드를 하나의 도장처럼 함수로 묶어둡니다.</p>
<div class="code-block-wrapper"><div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div><pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *

<span class="code-comment"># 세 꼭짓점을 받아 삼각형을 그리는 공장 함수</span>
<span class="code-keyword">def</span> draw_triangle(p1, p2, p3):
    penup()
    goto(p1[<span class="code-num">0</span>], p1[<span class="code-num">1</span>])
    pendown()
    goto(p2[<span class="code-num">0</span>], p2[<span class="code-num">1</span>])
    goto(p3[<span class="code-num">0</span>], p3[<span class="code-num">1</span>])
    goto(p1[<span class="code-num">0</span>], p1[<span class="code-num">1</span>])

<span class="code-comment"># 함수 호출하여 도장 찍듯 그리기</span>
draw_triangle((<span class="code-num">0</span>, <span class="code-num">80</span>), (-<span class="code-num">80</span>, -<span class="code-num">50</span>), (<span class="code-num">80</span>, -<span class="code-num">50</span>))
done()</code></pre></div>
<div class="result-box"><b>🔍 코드 톺아보기</b><br>• <code>def draw_triangle</code>: 세 점의 정보를 전달받아 반복적으로 삼각형을 그려주는 나만의 명령어를 창조합니다.<br>• <code>p1[0], p1[1]</code>: 전달받은 좌표 튜플 p1에서 첫 번째 요소인 x좌표와 두 번째 요소인 y좌표를 꺼내어 사용합니다.</div>
<h1 class="chapter-h1">📐 [8차시] 두 점 사이의 중점(Midpoint) 구하기</h1>
<p class="section-desc">핵심 개념 설명: 큰 삼각형을 작은 삼각형들로 정교하게 쪼개려면 각 선분의 정중앙 좌표를 정확히 계산해야 합니다. 수학 시간에 배운 중점 공식이 코딩의 핵심 로직으로 바로 적용됩니다.</p>
<div class="code-block-wrapper"><div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div><pre><code><span class="code-keyword">def</span> get_midpoint(p1, p2):
    mid_x = (p1[<span class="code-num">0</span>] + p2[<span class="code-num">0</span>]) / <span class="code-num">2</span>
    mid_y = (p1[<span class="code-num">1</span>] + p2[<span class="code-num">1</span>]) / <span class="code-num">2</span>
    <span class="code-keyword">return</span> (mid_x, mid_y)

A = (-<span class="code-num">100</span>, <span class="code-num">0</span>)
B = (<span class="code-num">100</span>, <span class="code-num">0</span>)

<span class="code-comment"># 함수를 사용하여 두 점 A, B의 중점 구하기</span>
M = get_midpoint(A, B)
print(<span class="code-str">"A와 B의 정중앙 좌표는:"</span>, M)</code></pre></div>
<div class="result-box"><b>🔍 코드 톺아보기</b><br>• <code>mid_x = (p1[0] + p2[0]) / 2</code>: 두 점의 x좌표를 더한 뒤 2로 나누어 x축의 정중앙 위치를 계산합니다.<br>• <code>return (mid_x, mid_y)</code>: 계산이 완료된 중점의 x, y 좌표를 하나의 튜플로 묶어서 함수 밖으로 돌려줍니다.</div>
<h1 class="chapter-h1">🔄 [9차시] 재귀 함수(Recursion)와 탈출 조건</h1>
<p class="section-desc">핵심 개념 설명: 똑같은 모양이 끝없이 작아지며 반복되는 구조를 만들려면, 함수 안에서 자기 자신을 다시 부르는 기술이 필요합니다. 컴퓨터가 무한 루프에 빠지지 않도록 안전장치를 만드는 법을 익힙니다.</p>
<div class="code-block-wrapper"><div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div><pre><code><span class="code-keyword">def</span> countdown(n):
    <span class="code-comment"># 탈출 조건 (Base Case)</span>
    <span class="code-keyword">if</span> n == <span class="code-num">0</span>:
        print(<span class="code-str">"발사!"</span>)
        <span class="code-keyword">return</span> <span class="code-comment"># 함수 즉시 종료</span>

    print(n)
    <span class="code-comment"># 자기 자신을 다시 호출 (재귀 호출)</span>
    countdown(n - <span class="code-num">1</span>)

countdown(<span class="code-num">3</span>)</code></pre></div>
<div class="result-box"><b>🔍 코드 톺아보기</b><br>• <code>countdown(n-1)</code>: 함수 안에서 자신의 이름을 부르되, 전달하는 숫자를 1씩 줄여가며 호출하여 작업을 쪼갭니다.<br>• <code>if n == 0:</code> : 재귀 호출이 무한히 이어져 프로그램이 뻗는 것을 방지하기 위해 반드시 작성해야 하는 정지선(탈출 조건)입니다.</div>

<h1 class="chapter-h1" id="k5">📌 [활동 5] 코드로 내 답 확인하기</h1>
<p class="section-desc">아래 코드는 활동 3의 표를 계산해 줍니다. 실행해서 내가 적은 값과 같은지 비교해 보세요.</p>
<div class="code-block-wrapper"><div class="code-header"><span class="code-lang">PYTHON</span><span>표 계산 코드</span></div><pre><code><span class="code-keyword">def</span> koch_info(length, depth):
    count = <span class="code-num">4</span> ** depth
    small = length / <span class="code-num">3</span> ** depth
    total = count * small
    <span class="code-keyword">return</span> count, small, total

<span class="code-keyword">for</span> depth <span class="code-keyword">in</span> <span class="code-keyword">range</span>(<span class="code-num">5</span>):
    count, small, total = koch_info(<span class="code-num">81</span>, depth)
    print(depth, <span class="code-str">"단계 | 선분 개수:"</span>, count, <span class="code-str">"| 선분 1개 길이:"</span>, small, <span class="code-str">"| 전체 길이:"</span>, total)</code></pre></div><p class="section-desc">이번에는 거북이가 눈송이를 그리는 코드입니다. <code>snowflake(243, 3)</code>의 마지막 숫자를 0, 1, 2, 3으로 바꿔 가며 위 시뮬레이터와 비교해 보세요.</p><div class="code-block-wrapper"><div class="code-header"><span class="code-lang">PYTHON</span><span>거북이 눈송이 코드</span></div><pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *

<span class="code-keyword">def</span> koch(length, depth):
    <span class="code-keyword">if</span> depth == <span class="code-num">0</span>:
        forward(length)
    <span class="code-keyword">else</span>:

<div class="code-block-wrapper"><div class="code-header"><span class="code-lang">PYTHON</span><span>몬테카를로 거북이 코드</span></div><pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *

<span class="code-keyword">def</span> draw_box():

<span class="code-keyword">def</span> monte_carlo(n):
    inside = <span class="code-num">0</span>
    <span class="code-keyword">for</span> _ <span class="code-keyword">in</span> <span class="code-keyword">range</span>(n):
        x = random.random()

        function selectLesson(lessonKey, element) {

        // 추가: 설명 영역의 [활동 n] 바로가기
        function jumpTo(id) {

        }

        function initCanvas() {
            canvas = document.getElementById('sim-canvas');
            if(canvas) ctx = canvas.getContext('2d');
        }

        function setDepth(d) {
            if(d < 0) return;
            if(currentSimulation === 'lesson2' && d > 4) return;
            if(currentSimulation === 'lesson3' && d > 5) return;
            currentDepth = d;

        window.addEventListener('keydown', (e) => {

        // 4. 눈송이 삼각형 (역삼각형 기본 + 바운딩 박스 정가운데 보정)
        function drawKochSnowflake(depth) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#0ea5e9";
            ctx.lineWidth = 1.5;
            const size = 260;
            const R = size / Math.sqrt(3);
            const r = R / 2;
            const p1 = { x: -size/2, y: -r };
            const p2 = { x: size/2, y: -r };
            const p3 = { x: 0, y: R };
            let points = [];
            points.push(p1);
            getKochPoints(p1, p2, depth, points);
            getKochPoints(p2, p3, depth, points);
            getKochPoints(p3, p1, depth, points);
            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;
            for(let p of points) {
                if(p.x < minX) minX = p.x;
                if(p.x > maxX) maxX = p.x;
                if(p.y < minY) minY = p.y;
                if(p.y > maxY) maxY = p.y;
            }
            const bboxCenterX = (minX + maxX) / 2;
            const bboxCenterY = (minY + maxY) / 2;
            const offsetX = canvas.width / 2 - bboxCenterX;
            const offsetY = canvas.height / 2 - bboxCenterY;
            ctx.beginPath();
            ctx.moveTo(points[0].x + offsetX, points[0].y + offsetY);
            for(let i=1; i<points.length; i++) {
                ctx.lineTo(points[i].x + offsetX, points[i].y + offsetY);
            }
            ctx.closePath();
            ctx.stroke();
            document.getElementById('val-depth').innerText = depth + "단계";
            document.getElementById('val-count').innerText = (points.length - 1) + "개";
        }

        function getKochPoints(p1, p2, depth, points) {
            if (depth === 0) { points.push(p2); return; }
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const pA = { x: p1.x + dx/3, y: p1.y + dy/3 };
            const pC = { x: p1.x + dx*2/3, y: p1.y + dy*2/3 };
            const angle = Math.PI / 3;
            const pB = {
                x: pA.x + (pC.x - pA.x) * Math.cos(angle) + (pC.y - pA.y) * Math.sin(angle),
                y: pA.y - (pC.x - pA.x) * Math.sin(angle) + (pC.y - pA.y) * Math.cos(angle)
            };
            getKochPoints(p1, pA, depth - 1, points);
            getKochPoints(pA, pB, depth - 1, points);
            getKochPoints(pB, pC, depth - 1, points);
            getKochPoints(pC, p2, depth - 1, points);
        }

        // 5. 시어핀스키 삼각형
        function drawSierpinski(depth) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const size = 360;
            const h = size * Math.sqrt(3) / 2;
            const p1 = { x: 0, y: -h/2 };
            const p2 = { x: -size/2, y: h/2 };
            const p3 = { x: size/2, y: h/2 };
            const offsetX = canvas.width / 2;
            const offsetY = canvas.height / 2;
            let count = drawSierpTriangle(
                {x: p1.x + offsetX, y: p1.y + offsetY},
                {x: p2.x + offsetX, y: p2.y + offsetY},
                {x: p3.x + offsetX, y: p3.y + offsetY},
                depth
            );
            document.getElementById('val-depth').innerText = depth + "단계";
            document.getElementById('val-count').innerText = count + "개";
        }

        function drawSierpTriangle(p1, p2, p3, depth) {
            if (depth === 0) {
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.lineTo(p3.x, p3.y);
                ctx.closePath();
                ctx.fillStyle = "rgba(2, 132, 199, 0.7)";
                ctx.fill();
                ctx.strokeStyle = "#0284c7";
                ctx.stroke();
                return 1;
            }
            const m1 = { x: (p1.x + p2.x)/2, y: (p1.y + p2.y)/2 };
            const m2 = { x: (p2.x + p3.x)/2, y: (p2.y + p3.y)/2 };
            const m3 = { x: (p3.x + p1.x)/2, y: (p3.y + p1.y)/2 };
            let triangles = 0;
            triangles += drawSierpTriangle(p1, m1, m3, depth - 1);
            triangles += drawSierpTriangle(m1, p2, m2, depth - 1);
            triangles += drawSierpTriangle(m3, m2, p3, depth - 1);
            return triangles;
        }

        // 6. 몬테카를로 원주율 (Pi)
        function initPiCanvas() {
            canvas = document.getElementById('sim-canvas');
            ctx = canvas.getContext('2d');
            resetPi();
        }

        function drawPiBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#cbd5e1";
            ctx.lineWidth = 1;
            ctx.strokeRect(10, 10, 380, 380);
            ctx.beginPath();
            ctx.arc(200, 200, 190, 0, 2 * Math.PI);
            ctx.fillStyle = "#f8fafc";
            ctx.fill();
            ctx.strokeStyle = "#0ea5e9";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.beginPath();
            ctx.setLineDash([4, 4]);
            ctx.moveTo(10, 200);
            ctx.lineTo(390, 200);
            ctx.moveTo(200, 10);
            ctx.lineTo(200, 390);
            ctx.strokeStyle = "#e2e8f0";
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function addPiPoints(amount, btnElement) {
            resetPi(false);
            const buttons = document.querySelectorAll('#pi-amount-buttons .sim-btn');
            buttons.forEach(b => b.classList.remove('active'));
            if(btnElement) { btnElement.classList.add('active'); }
            for(let i=0; i<amount; i++) { drawSinglePiPoint(); }
            updatePiUI();
        }

        function loopPi() {
            if(!piIsRunning) return;
            let pointsToDraw = 100;
            if (piPointsTotal + pointsToDraw >= 10000) {
                pointsToDraw = 10000 - piPointsTotal;
                piIsRunning = false;
                document.getElementById('pi-start-btn').innerText = "연속 실행 (Play)";
            }
            for(let i=0; i<pointsToDraw; i++) { drawSinglePiPoint(); }
            updatePiUI();
            if(piIsRunning) { animationId = requestAnimationFrame(loopPi); }
        }

        function drawSinglePiPoint() {
            const x = 10 + Math.random() * 380;
            const y = 10 + Math.random() * 380;
            const dist = Math.sqrt((x - 200)**2 + (y - 200)**2);
            ctx.beginPath();
            ctx.arc(x, y, 1.2, 0, 2*Math.PI);
            if(dist <= 190) {
                piPointsInside++;
                ctx.fillStyle = "rgba(14, 165, 233, 0.6)";
            } else {
                ctx.fillStyle = "rgba(148, 163, 184, 0.4)";
            }
            ctx.fill();
            piPointsTotal++;
        }

        function updatePiUI() {
            document.getElementById('pi-total').innerText = piPointsTotal.toLocaleString() + "개";
            let piValue = 0;
            if(piPointsTotal > 0) { piValue = 4 * (piPointsInside / piPointsTotal); }
            document.getElementById('pi-calc').innerText = piValue.toFixed(4);
        }

        // 7. 스택(Stack) 시뮬레이션
        function initStackCanvas() {
            canvas = document.getElementById('sim-canvas');
            ctx = canvas.getContext('2d');
            stackData = [];
            drawStack();
        }

        function drawStack() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.moveTo(140, 100);
            ctx.lineTo(140, 350);
            ctx.lineTo(260, 350);
            ctx.lineTo(260, 100);
            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.font = "bold 15px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            for(let i=0; i<stackData.length; i++) {
                let x = 150;
                let y = 300 - (i * 45);
                ctx.fillStyle = "#bae6fd";
                ctx.fillRect(x, y, 100, 40);
                ctx.strokeStyle = "#0284c7";
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, 100, 40);
                ctx.fillStyle = "#0f172a";
                ctx.fillText(stackData[i], x + 50, y + 20);
            }
            document.getElementById('stack-size').innerText = `${stackData.length} / ${MAX_SIZE}`;
        }

        function pushStack() {
            const inputEl = document.getElementById('stack-input');
            const val = inputEl.value.trim();
            if (stackData.length >= MAX_SIZE) {
                document.getElementById('stack-msg').innerText = "오버플로우 (Overflow)!";
                document.getElementById('stack-msg').style.color = "#dc2626";
                return;
            }
            const dataToPush = val === "" ? "Data" : val;
            stackData.push(dataToPush);
            inputEl.value = "";
            document.getElementById('stack-msg').innerText = `'${dataToPush}' PUSH 성공`;
            document.getElementById('stack-msg').style.color = "#059669";
            drawStack();
        }

        function popStack() {
            if (stackData.length === 0) {
                document.getElementById('stack-msg').innerText = "언더플로우 (Underflow)!";
                document.getElementById('stack-msg').style.color = "#dc2626";
                return;
            }
            const removed = stackData.pop();
            document.getElementById('stack-msg').innerText = `'${removed}' POP 성공`;
            document.getElementById('stack-msg').style.color = "#2563eb";
            drawStack();
        }

        // 8. 큐(Queue) 시뮬레이션
        function initQueueCanvas() {
            canvas = document.getElementById('sim-canvas');
            ctx = canvas.getContext('2d');
            queueData = [];
            ctx.textBaseline = "alphabetic";
            drawQueue();
        }

        function drawQueue() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.moveTo(40, 180);
            ctx.lineTo(360, 180);
            ctx.moveTo(40, 240);
            ctx.lineTo(360, 240);
            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.font = "bold 14px sans-serif";
            ctx.textBaseline = "bottom";
            ctx.fillStyle = "#2563eb";
            ctx.textAlign = "left";
            ctx.fillText("OUT (front)", 40, 170);
            ctx.textAlign = "right";
            ctx.fillText("IN (rear)", 360, 170);
            ctx.font = "bold 14px sans-serif";
            ctx.textBaseline = "middle";
            ctx.textAlign = "center";
            for(let i=0; i<queueData.length; i++) {
                let x = 50 + (i * 60);
                let y = 190;
                ctx.fillStyle = "#bae6fd";
                ctx.fillRect(x, y, 50, 40);
                ctx.strokeStyle = "#0284c7";
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, 50, 40);
                ctx.fillStyle = "#0f172a";
                ctx.fillText(queueData[i], x + 25, y + 20);
            }
            document.getElementById('queue-size').innerText = `${queueData.length} / ${MAX_SIZE}`;
        }

        function enqueueData() {
            const inputEl = document.getElementById('queue-input');
            const val = inputEl.value.trim();
            if (queueData.length >= MAX_SIZE) {
                document.getElementById('queue-msg').innerText = "오버플로우 (Overflow)!";
                document.getElementById('queue-msg').style.color = "#dc2626";
                return;
            }
            const dataToEnq = val === "" ? "Data" : val;
            queueData.push(dataToEnq);
            inputEl.value = "";
            document.getElementById('queue-msg').innerText = `'${dataToEnq}' Enqueue 성공`;
            document.getElementById('queue-msg').style.color = "#059669";
            drawQueue();
        }

        function dequeueData() {
            if (queueData.length === 0) {
                document.getElementById('queue-msg').innerText = "언더플로우 (Underflow)!";
                document.getElementById('queue-msg').style.color = "#dc2626";
                return;
            }
            const removed = queueData.shift();
            document.getElementById('queue-msg').innerText = `'${removed}' Dequeue 성공`;
            document.getElementById('queue-msg').style.color = "#2563eb";
            drawQueue();
        }

        // 최초 구동
        window.onload = () => {
            selectLesson('lesson1', document.querySelector('.menu-item'));
        }
    </script>
</body>
</html>
