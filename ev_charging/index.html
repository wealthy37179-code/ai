<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전기차 충전소 데이터 분석 학습 자료</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        /* 1. 컨테이너 전체 폭 확대 (580px -> 760px) */
        .container {
            width: 100%;
            max-width: 760px;
            background: #ffffff;
            padding: 46px 36px;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        /* 상단 뱃지 확대 */
        .badge {
            display: inline-block;
            background-color: #dcfce7;
            color: #15803d;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .header {
            margin-bottom: 30px;
        }

        /* 2. 메인 제목 폰트 확대 (1.55rem -> 2.1rem) */
        .header h1 {
            font-size: 2.1rem;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.35;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            color: #64748b;
        }

        /* 3. 카드 간격 및 크기 확대 */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .card {
            display: flex;
            align-items: center;
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 18px;
            padding: 22px 26px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease-in-out;
        }

        .card:hover {
            transform: translateY(-3px);
            background-color: #ffffff;
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.1);
        }

        .card-ppt:hover { border-color: #ea580c; }
        .card-code:hover { border-color: #7c3aed; }
        .card-worksheet:hover { border-color: #2563eb; }

        /* 4. 아이콘 크기 확대 (46px -> 58px) */
        .card-icon {
            font-size: 2.2rem;
            margin-right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 58px;
            border-radius: 16px;
            flex-shrink: 0;
        }

        .icon-orange { background: #fff7ed; }
        .icon-purple { background: #f5f3ff; }
        .icon-blue { background: #eff6ff; }

        .card-text {
            text-align: left;
            flex: 1;
        }

        /* 5. 카드 내부 텍스트 확대 */
        .card-tag {
            display: inline-block;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 8px;
            margin-bottom: 6px;
        }

        .tag-orange { background: #ffedd5; color: #c2410c; }
        .tag-purple { background: #ede9fe; color: #6d28d9; }
        .tag-blue { background: #dbeafe; color: #1d4ed8; }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 5px;
        }

        .card-desc {
            font-size: 1.0rem;
            color: #64748b;
            line-height: 1.4;
        }

        .arrow {
            font-size: 1.4rem;
            font-weight: bold;
            color: #94a3b8;
            margin-left: 12px;
            transition: transform 0.2s ease;
        }

        .card:hover .arrow {
            transform: translateX(4px);
            color: #334155;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.95rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">공공데이터 & 데이터 정제</span>
        <header class="header">
            <h1>⚡ 전국 전기차 충전소<br>데이터 분석 학습 자료</h1>
            <p>열람하려는 PDF 학습 자료를 클릭하세요.</p>
        </header>

        <main class="card-list">
            <!-- 1. 강의 슬라이드 (PPT) -->
            <a href="지역충전소_수업자료.pdf" target="_blank" class="card card-ppt">
                <span class="card-icon icon-orange">📊</span>
                <div class="card-text">
                    <span class="card-tag tag-orange">1. 강의 슬라이드 (PPT)</span>
                    <div class="card-title">데이터 분석 강의 슬라이드</div>
                    <div class="card-desc">지역별 충전소 현황 및 데이터 정제 인사이트</div>
                </div>
                <span class="arrow">➔</span>
            </a>

            <!-- 2. 전체코드 실행결과 (.ipynb) -->
            <a href="EV_charging.pdf" target="_blank" class="card card-code">
                <span class="card-icon icon-purple">💻</span>
                <div class="card-text">
                    <span class="card-tag tag-purple">2. 전체코드 실행결과 (.ipynb)</span>
                    <div class="card-title">파이썬 분석 전체 코드 & 해설</div>
                    <div class="card-desc">데이터 정제 과정 및 막대그래프 시각화 실행 결과</div>
                </div>
                <span class="arrow">➔</span>
            </a>

            <!-- 3. 탐구 활동지 -->
            <a href="ev_charging_analysis_github.pdf" target="_blank" class="card card-worksheet">
                <span class="card-icon icon-blue">📄</span>
                <div class="card-text">
                    <span class="card-tag tag-blue">3. 탐구 활동지</span>
                    <div class="card-title">실습 탐구 활동지</div>
                    <div class="card-desc">결측치 정제, 주소 분할, 지명 표준화 실습 문제[cite: 1, 2]</div>
                </div>
                <span class="arrow">➔</span>
            </a>
        </main>

        <footer class="footer">
            © 파이썬 공공데이터 분석 실습 공간
        </footer>
    </div>

</body>
</html>
