    <script>
        const lessons = {
            lesson1: {
                title: "01. turtle 모듈",
                icon: "🐢",
                html: `
                    <h1 class="article-title">파이썬 터틀(Turtle) 모듈</h1>
                    <div class="article-intro">
                        거북이를 이동시키고 제어하는 터틀 모듈의 기초부터, 반복문, 함수(def), 재귀 호출(Recursion)을 결합하여 시어핀스키 삼각형과 같은 프랙탈 도형을 그리는 전체 과정을 1~9차시에 걸쳐 학습합니다.
                    </div>

                    <!-- [1차시] -->
                    <h1 class="chapter-h1">🐢 [1차시] 터틀 모듈 첫걸음과 기본 이동</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 파이썬에서 화면에 그림을 그리기 위해 거북이를 불러옵니다. 거북이는 우리가 지시하는 방향과 거리만큼 움직이며 선을 남깁니다. 앞으로 진행할 시어핀스키 삼각형을 그리기 위한 가장 기초적인 펜의 역할을 익힙니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
<span class="code-comment"># 거북이 모양 커서로 설정</span>
shape(<span class="code-str">"turtle"</span>)

<span class="code-comment"># 거북이 이동 명령</span>
forward(<span class="code-num">100</span>)
right(<span class="code-num">90</span>)
forward(<span class="code-num">100</span>)

<span class="code-comment"># 실행 완료 후 창 유지</span>
done()</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>from turtle import *</code> : 거북이 그래픽 모듈을 불러오고 앞으로 편하게 t라는 별명으로 부릅니다.<br>
                        • <code>shape("turtle")</code> : 화면에 나타나는 마우스 커서의 모양을 실제 거북이 형태로 바꾸어 시각적인 재미를 줍니다.<br>
                        • <code>forward(100)</code> : 거북이가 현재 바라보고 있는 방향으로 100픽셀만큼 직진하며 궤적에 선을 긋습니다.<br>
                        • <code>right(90)</code> : 거북이의 머리 방향을 제자리에서 오른쪽으로 90도 회전합니다.
                    </div>

                    <!-- [2차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">🔄 [2차시] 반복문(for)으로 다각형 그리기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 사각형을 그리려면 전진과 회전을 4번 반복해야 합니다. 코드를 일일이 4번 적는 대신 반복문을 사용하면 코드를 짧고 효율적으로 작성할 수 있습니다. 프랙탈의 기본 단위인 삼각형을 척척 그려낼 때도 이 원리가 그대로 사용됩니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
shape(<span class="code-str">"turtle"</span>)
pensize(<span class="code-num">3</span>)

<span class="code-comment"># 4번 반복하여 정사각형 그리기</span>
<span class="code-keyword">for</span> i <span class="code-keyword">in</span> range(<span class="code-num">4</span>):
    forward(<span class="code-num">100</span>)
    left(<span class="code-num">90</span>)
done()</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>for i in range(4):</code> : 들여쓰기된 아래의 코드 블록을 정확히 4번 반복 실행하라는 의미입니다.<br>
                        • <code>left(90)</code> : 왼쪽으로 90도 꺾습니다. 만약 정삼각형을 그린다면 외각인 120도를 회전하도록 수정해야 합니다.<br>
                        • <code>pensize(3)</code> : 거북이가 그리는 선의 굵기를 3픽셀로 설정하여 더 또렷한 선을 얻습니다.
                    </div>

                    <!-- [3차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">✏️ [3차시] 펜 들기(penup)와 내리기(pendown)</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 시어핀스키 삼각형처럼 화면 여러 위치에 흩어진 조각들을 그리려면 선을 그리지 않고 거북이를 이동시키는 기술이 필수적입니다. 종이에서 펜을 살짝 떼어 이동하고 다시 내려놓는 원리입니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
shape(<span class="code-str">"turtle"</span>)
forward(<span class="code-num">50</span>)

<span class="code-comment"># 선을 끊고 이동하기</span>
penup()
forward(<span class="code-num">50</span>)

<span class="code-comment"># 다시 선을 그리기</span>
pendown()
forward(<span class="code-num">50</span>)
done()</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>penup()</code> : 거북이가 이동할 때 바닥에 선이 그려지지 않도록 펜을 위로 들어 올립니다.<br>
                        • <code>pendown()</code> : 다시 선을 그리며 이동할 수 있도록 펜을 바닥에 내려놓습니다.
                    </div>

                    <!-- [4차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">📍 [4차시] 절대 좌표 이동 (goto)</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 화면의 정중앙은 x=0, y=0인 원점입니다. 거북이가 현재 바라보는 방향과 무관하게 특정 목적지로 곧바로 날아가게 만들려면 절대 좌표를 이용해야 합니다. 이는 시어핀스키 삼각형의 세 꼭짓점을 정확히 잡는 데 사용됩니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
shape(<span class="code-str">"turtle"</span>)

<span class="code-comment"># 시어핀스키 뼈대 삼각형의 세 꼭짓점 좌표</span>
A = (<span class="code-num">0</span>, <span class="code-num">100</span>)
B = (-<span class="code-num">100</span>, -<span class="code-num">50</span>)
C = (<span class="code-num">100</span>, -<span class="code-num">50</span>)

penup()
goto(A[<span class="code-num">0</span>], A[<span class="code-num">1</span>])  <span class="code-comment"># A 꼭짓점으로 점프</span>
pendown()
goto(B[<span class="code-num">0</span>], B[<span class="code-num">1</span>])  <span class="code-comment"># B로 선 긋기</span>
goto(C[<span class="code-num">0</span>], C[<span class="code-num">1</span>])  <span class="code-comment"># C로 선 긋기</span>
goto(A[<span class="code-num">0</span>], A[<span class="code-num">1</span>])  <span class="code-comment"># 다시 A로 돌아오기</span>
done()</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>A = (0, 100)</code> : x좌표 0, y좌표 100이라는 두 개의 값을 하나의 튜플 형태로 변수 A에 저장합니다.<br>
                        • <code>goto(x, y)</code> : 거북이가 방향을 돌릴 필요 없이 지정된 x, y 좌표로 곧바로 직진하여 이동합니다.
                    </div>

                    <!-- [5차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">🎨 [5차시] 도형 내부에 색상 채우기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 테두리만 있는 도형 내부를 색으로 칠하면 수많은 삼각형이 겹쳐지는 프랙탈 구조를 훨씬 뚜렷하게 관찰할 수 있습니다. 색칠을 시작할 곳과 끝날 곳을 거북이에게 알려주는 방식을 배웁니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
color(<span class="code-str">"blue"</span>, <span class="code-str">"skyblue"</span>) <span class="code-comment"># 테두리 파랑, 내부 하늘색</span>

<span class="code-comment"># 색칠 시작 준비</span>
begin_fill()
<span class="code-keyword">for</span> i <span class="code-keyword">in</span> range(<span class="code-num">3</span>):
    forward(<span class="code-num">120</span>)
    left(<span class="code-num">120</span>)
<span class="code-comment"># 색칠 끝내고 채우기</span>
end_fill()
done()</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>color(테두리색, 채우기색)</code> : 거북이가 그릴 선의 색상과 도형 내부를 채울 색상을 동시에 설정합니다.<br>
                        • <code>begin_fill()</code> : 지금부터 이동하는 궤적의 내부를 색칠할 것이라고 거북이에게 신호를 줍니다.<br>
                        • <code>end_fill()</code> : 도형의 테두리가 완전히 닫히면 지정해둔 색상으로 내부를 가득 채웁니다.
                    </div>

                    <!-- [6차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">🌀 [6차시] 중첩 반복문으로 기하학 패턴 만들기</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 반복문 안에 또 다른 반복문을 넣으면 도형을 그리면서 동시에 회전하는 화려한 대칭 패턴을 쉽게 그릴 수 있습니다. 프랙탈의 반복적이고 대칭적인 성질을 이해하는 좋은 기초가 됩니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
speed(<span class="code-num">0</span>) <span class="code-comment"># 거북이 속도 최대</span>

<span class="code-comment"># 바깥쪽 반복문: 전체 도형을 12번 회전</span>
<span class="code-keyword">for</span> i <span class="code-keyword">in</span> range(<span class="code-num">12</span>):
    <span class="code-comment"># 안쪽 반복문: 기본 정삼각형 그리기</span>
    <span class="code-keyword">for</span> j <span class="code-keyword">in</span> range(<span class="code-num">3</span>):
        forward(<span class="code-num">100</span>)
        left(<span class="code-num">120</span>)
    right(<span class="code-num">30</span>) <span class="code-comment"># 삼각형 하나 그리고 30도 회전</span>
done()</code></pre>
                    </div>
                    <div class="result-box">

                    <h1 class="chapter-h1" style="margin-top: 50px;">🏠 [6차시] 지역 변수와 전역 변수의 이해</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 함수 안에서 새롭게 만들어진 변수는 지역 변수라 불리며 함수가 종료되면 메모리에서 완전히 사라집니다. 반면 함수 밖에서 만들어진 변수는 전역 변수로 프로그램 전체에서 읽을 수 있습니다. 변수의 생명 주기와 유효 범위를 이해하는 창은 논리 오류를 막는 핵심입니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code>base_population = <span class="code-num">380000</span> <span class="code-comment"># 전역 변수</span>

<span class="code-keyword">def</span> <span class="code-def">add_new_residents</span>(new_people):
    <span class="code-comment"># 함수 안에서 생성된 지역 변수 added</span>
    added = base_population + new_people
    <span class="code-keyword">print</span>(<span class="code-str">"새로운 인구 유입 후 계산 결과:"</span>, added)

add_new_residents(<span class="code-num">5000</span>)
<span class="code-keyword">print</span>(<span class="code-str">"원래 기준 인구수:"</span>, base_population)
<span class="code-comment"># print(added) # 주석을 풀면 NameError가 발생합니다. 함수가 끝나면 added는 사라집니다.</span></code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>base_population</code> : 함수 외부 최상단에 선언되었으므로 함수 내부에서도 접근하여 사용할 수 있는 전역 변수입니다.<br>
                        • <code>added</code> : 함수 내부에서 태어난 지역 변수이므로 밖에서 출력하려 하면 정의되지 않았다는 NameError가 발생합니다.
                    </div>

                    <!-- [7차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">⚖️ [7차시] 함수와 조건문(if)의 결합</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 입력받은 매개변수의 값을 if 조건문으로 검사하여 참(True) 또는 거짓(False)을 반환하는 판별 함수를 만들 수 있습니다. 데이터의 유효성을 검사하거나 조건에 따른 처리를 모듈화할 때 매우 유용합니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">def</span> <span class="code-def">is_effective_ppl</span>(score):
    <span class="code-comment"># 점수가 80점 이상이면 광고 효과가 높다고 판별</span>
    <span class="code-keyword">if</span> score >= <span class="code-num">80</span>:
        <span class="code-keyword">return</span> <span class="code-keyword">True</span>
    <span class="code-keyword">else</span>:
        <span class="code-keyword">return</span> <span class="code-keyword">False</span>

<span class="code-comment"># 메인 코드에서 함수 활용</span>
current_score = <span class="code-num">85</span>
<span class="code-keyword">if</span> is_effective_ppl(current_score):
    <span class="code-keyword">print</span>(<span class="code-str">"광고 효과가 훌륭합니다. 캠페인을 유지하세요."</span>)
<span class="code-keyword">else</span>:
    <span class="code-keyword">print</span>(<span class="code-str">"광고 효과가 부족합니다. 매체를 변경하세요."</span>)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>if score >= 80:</code> : 외부에서 전달받은 점수를 기준으로 내부에서 조건을 판별합니다.<br>
                        • <code>return True</code> : 연산 결과에 따라 불리언(Boolean) 값을 반환하므로 메인 코드의 if문 조건식에 직관적으로 결합할 수 있습니다.
                    </div>

                    <!-- [8차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">🔄 [8차시] 함수와 반복문(for)의 결합</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 여러 개의 데이터가 담긴 파이썬 리스트를 함수의 매개변수로 한 번에 넘겨줄 수 있습니다. 함수 내부의 for 반복문을 통해 리스트 원소를 하나씩 꺼내어 누적 합계를 구하거나 평균을 계산하는 등 대량의 데이터를 손쉽게 다룹니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">def</span> <span class="code-def">calculate_total_population</span>(pop_list):
    total = <span class="code-num">0</span>
    <span class="code-keyword">for</span> pop <span class="code-keyword">in</span> pop_list:
        total = total + pop
    <span class="code-keyword">return</span> total

<span class="code-comment"># 4개 행정동의 인구 데이터 리스트</span>
district_populations = [<span class="code-num">18000</span>, <span class="code-num">32000</span>, <span class="code-num">25000</span>, <span class="code-num">15000</span>]

<span class="code-comment"># 리스트를 통째로 함수에 전달</span>
total_pop = calculate_total_population(district_populations)
<span class="code-keyword">print</span>(<span class="code-str">"행정동 전체 누적 인구수:"</span>, total_pop, <span class="code-str">"명"</span>)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>for pop in pop_list:</code> : 전달받은 리스트에서 데이터를 순차적으로 하나씩 꺼내어 반복문을 실행합니다.<br>
                        • <code>total = total + pop</code> : 초기값이 0인 total 변수에 꺼낸 인구수를 계속해서 누적 합산합니다.
                    </div>

                    <!-- [9차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">🔗 [9차시] 다중 함수의 파이프라인 연결</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 복잡한 코드를 하나의 거대한 함수에 몰아넣기보다는 역할이 하나로 분명한 여러 개의 작은 함수로 나누어 설계하는 것이 좋습니다. 한 함수가 연산하여 반환한 결과값을 다음 함수의 입력으로 전달하며 협업하는 구조를 익힙니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-comment"># 1단계: 평균을 구하는 전문 함수</span>
<span class="code-keyword">def</span> <span class="code-def">get_average</span>(scores):
    <span class="code-keyword">return</span> sum(scores) / len(scores)

<span class="code-comment"># 2단계: 평균을 받아 등급을 매기는 전문 함수</span>
<span class="code-keyword">def</span> <span class="code-def">rate_effectiveness</span>(avg_score):
    <span class="code-keyword">if</span> avg_score >= <span class="code-num">85</span>:
        <span class="code-keyword">return</span> <span class="code-str">"S등급(매우 우수)"</span>
    <span class="code-keyword">elif</span> avg_score >= <span class="code-num">70</span>:
        <span class="code-keyword">return</span> <span class="code-str">"A등급(우수)"</span>
    <span class="code-keyword">else</span>:
        <span class="code-keyword">return</span> <span class="code-str">"B등급(보통)"</span>

ppl_scores = [<span class="code-num">88</span>, <span class="code-num">92</span>, <span class="code-num">75</span>, <span class="code-num">80</span>]

<span class="code-comment"># 함수들의 파이프라인 협업</span>
average_val = get_average(ppl_scores)
final_rating = rate_effectiveness(average_val)

<span class="code-keyword">print</span>(<span class="code-str">"평균 인지도:"</span>, average_val)
<span class="code-keyword">print</span>(<span class="code-str">"최종 광고 등급:"</span>, final_rating)</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>get_average</code> / <code>rate_effectiveness</code> : 계산 기능과 판별 기능을 분리하여 코드를 수정하고 디버깅하기 훨씬 수월하게 설계했습니다.<br>
                        • <code>rate_effectiveness(average_val)</code> : get_average가 계산해 낸 결과값을 변수에 잠시 담아둔 뒤 이를 그대로 다음 함수의 매개변수로 넘겨줍니다.
                    </div>

                    <!-- [10차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">🏆 [10차시] 종합 미니 프로젝트 - 데이터 분석 리포트 완성</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 지금까지 배운 매개변수, 반환값, 조건문, 반복문, 함수 연결의 모든 개념을 조립하여 독립적인 기능을 수행하는 데이터 분석 미니 프로그램을 완성합니다. 입력을 받아 분석하고 리포트를 출력하는 일련의 과정을 함수화하여 깔끔한 메인 제어 흐름을 구성합니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">def</span> <span class="code-def">calc_avg</span>(data_list):
    <span class="code-keyword">return</span> sum(data_list) / len(data_list)

<span class="code-keyword">def</span> <span class="code-def">judge_trend</span>(avg):
    <span class="code-keyword">if</span> avg >= <span class="code-num">80</span>:
        <span class="code-keyword">return</span> <span class="code-str">"상승세 뚜렷"</span>
    <span class="code-keyword">elif</span> avg >= <span class="code-num">50</span>:
        <span class="code-keyword">return</span> <span class="code-str">"유지 중"</span>
    <span class="code-keyword">else</span>:
        <span class="code-keyword">return</span> <span class="code-str">"하락세 주의"</span>

<span class="code-keyword">def</span> <span class="code-def">generate_report</span>(brand_name, recent_data):
    <span class="code-comment"># 앞서 만든 부품 함수들을 활용</span>
    average = calc_avg(recent_data)
    trend = judge_trend(average)
    
    <span class="code-keyword">print</span>(<span class="code-str">"="</span> * <span class="code-num">30</span>)

    <span class="code-keyword">print</span>(<span class="code-str">"최근 데이터 평균치:"</span>, round(average, <span class="code-num">1</span>))
    <span class="code-keyword">print</span>(<span class="code-str">"현재 분석 트렌드:"</span>, trend)
    <span class="code-keyword">print</span>(<span class="code-str">"="</span> * <span class="code-num">30</span>)

<span class="code-comment"># --- 메인 실행 제어부 ---</span>
target_brand = <span class="code-str">"세종푸드"</span>
collected_data = [<span class="code-num">82</span>, <span class="code-num">85</span>, <span class="code-num">78</span>, <span class="code-num">90</span>, <span class="code-num">88</span>]

<span class="code-comment"># 함수 단 하나만 호출하여 전체 분석 및 출력 로직을 수행</span>
generate_report(target_brand, collected_data)</code></pre>

                    <!-- [3차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">🔘 [3차시] 사용자와 소통하는 Button 위젯과 이벤트 처리</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> Button 위젯은 클릭이라는 이벤트를 통해 파이썬 내부의 특정 함수를 실행시킬 수 있는 핵심 도구입니다. 버튼을 눌렀을 때 라벨의 텍스트가 동적으로 변하게 만들며 상태 옵션을 통해 버튼의 클릭 가능 여부도 제어해 봅니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> tkinter <span class="code-keyword">import</span> *

<span class="code-keyword">def</span> <span class="code-def">hello</span>():
    lbl.config(text=<span class="code-str">"버튼을 클릭했습니다!"</span>)

root = Tk()
lbl = Label(root, text=<span class="code-str">"버튼을 눌러보세요"</span>, padx=<span class="code-num">40</span>, pady=<span class="code-num">10</span>)
lbl.pack()

<span class="code-comment"># 함수 이름만 연결</span>
btn = Button(root, text=<span class="code-str">"클릭"</span>, command=hello)
btn.pack(pady=<span class="code-num">5</span>)

<span class="code-comment"># 클릭 불가능한 비활성화 버튼</span>
btn_disabled = Button(root, text=<span class="code-str">"클릭 불가"</span>, state=<span class="code-str">"disabled"</span>)
btn_disabled.pack(pady=<span class="code-num">5</span>)

root.mainloop()</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <b>command 옵션</b> : 버튼이 눌렸을 때 실행될 파이썬 함수를 지정합니다.<br>
                        • <code>command=hello</code> (올바름) : 반드시 괄호를 뺀 함수 이름만 적어야 클릭할 때 비로소 함수가 실행됩니다.<br>
                        • <code>command=hello()</code> (잘못됨) : 괄호를 붙이면 프로그램을 실행하자마자 버튼을 누르지도 않았는데 함수가 강제로 먼저 실행되어 버립니다.<br>
                        • <code>config()</code> : 이미 만들어져 화면에 붙어있는 위젯의 속성이나 글자를 실행 도중에 새로운 값으로 동적 변경할 때 사용합니다.
                    </div>

                    <!-- [4차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">⌨️ [4차시] 사용자 입력을 받는 Entry 위젯</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 프로그램에 검색어나 아이디처럼 짧은 한 줄의 텍스트를 입력받아야 할 때는 Entry 위젯을 사용합니다. 입력된 값을 읽어오고 지우고 새롭게 쓰는 기본적인 제어 메서드와 비밀번호처럼 입력 내용을 숨기는 마스킹 기법을 알아봅니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> tkinter <span class="code-keyword">import</span> *

<span class="code-keyword">def</span> <span class="code-def">change_text</span>():
    <span class="code-comment"># 입력창의 글자를 읽어와 대문자로 변환</span>
    text = ent.get()
    ent.delete(<span class="code-num">0</span>, END)
    ent.insert(<span class="code-num">0</span>, text.upper())

root = Tk()
ent = Entry(root)
ent.pack(padx=<span class="code-num">10</span>, pady=<span class="code-num">10</span>)

btn = Button(root, text=<span class="code-str">"대문자로 변경"</span>, command=change_text)
btn.pack(padx=<span class="code-num">10</span>, pady=<span class="code-num">10</span>)

<span class="code-comment"># 비밀번호 입력용 엔트리</span>
password_ent = Entry(root, show=<span class="code-str">"*"</span>, width=<span class="code-num">30</span>)
password_ent.pack(pady=<span class="code-num">20</span>)

root.mainloop()</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>ent.get()</code> : 사용자가 현재 엔트리 위젯에 입력해 둔 문자열을 파이썬 변수로 쏙 가져옵니다.<br>
                        • <code>ent.delete(0, END)</code> : 입력창의 인덱스 0번(처음)부터 END(끝)까지의 모든 글자를 깨끗하게 지웁니다.<br>
                        • <code>show='*'</code> : 글자를 타이핑할 때 화면에 실제 글자 대신 지정한 특수문자 별표가 표시되도록 하여 비밀번호 입력 시 보안을 유지합니다.
                    </div>

                    <!-- [5차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">📝 [5차시] 여러 줄 작성이 가능한 Text 위젯</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 메모장 본문이나 게시글 작성창처럼 길고 줄바꿈이 있는 텍스트를 입력받거나 표시할 때는 Entry 대신 Text 위젯을 사용합니다. 여러 줄을 다루기 때문에 일반 위젯과는 다른 독특한 문자열 인덱스 체계를 가지고 있습니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> tkinter <span class="code-keyword">import</span> *

root = Tk()
txt = Text(root, width=<span class="code-num">40</span>, height=<span class="code-num">10</span>)
txt.pack(pady=<span class="code-num">10</span>)

<span class="code-comment"># 텍스트 위젯에 기본 안내문 삽입</span>
txt.insert(<span class="code-str">"1.0"</span>, <span class="code-str">"여기에 여러 줄의 긴 글을 입력하세요."</span>)

root.mainloop()</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>Text()</code> : 가로 글자 수와 세로 줄 수를 지정하여 넉넉한 글쓰기 공간을 가진 텍스트 박스를 생성합니다.<br>
                        • <b>인덱스 1.0</b> : Text 위젯은 1번째 줄의 0번째 칸이라는 줄과 칸 정보를 결합한 소수점 형태의 문자열 인덱스를 사용하여 위치를 정확히 지정합니다.<br>
                        • <b>인덱스 END</b> : 현재 작성된 모든 텍스트 내용의 맨 마지막 끝부분을 가리킵니다.
                    </div>

                    <!-- [6차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">☑️ [6차시] 선택의 즐거움 Checkbutton과 Radiobutton</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 사용자에게 여러 옵션을 제시하고 입력을 받을 때 체크버튼과 라디오버튼을 활용합니다. 여러 개를 중복해서 선택할 수 있는 체크버튼과 같은 그룹 안에서 오직 하나만 선택할 수 있는 라디오버튼의 동작 차이를 구현합니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> tkinter <span class="code-keyword">import</span> *

root = Tk()

<span class="code-comment"># 체크버튼용 불리언 변수</span>
agree_var = BooleanVar()
check_btn = Checkbutton(root, text=<span class="code-str">"이용 약관에 동의합니다"</span>, variable=agree_var)
check_btn.pack(pady=<span class="code-num">10</span>)

<span class="code-comment"># 라디오버튼용 정수형 변수 (단일 선택 그룹 형성)</span>
food = IntVar(value=<span class="code-num">1</span>)
rb_meat = Radiobutton(root, text=<span class="code-str">"육고기 메뉴"</span>, variable=food, value=<span class="code-num">1</span>)
rb_seafood = Radiobutton(root, text=<span class="code-str">"해산물 메뉴"</span>, variable=food, value=<span class="code-num">2</span>)
rb_meat.pack()
rb_seafood.pack()

root.mainloop()</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>BooleanVar</code> / <code>IntVar</code> : Tkinter 위젯의 선택 상태를 실시간으로 저장하고 파이썬 코드와 연동시키기 위해 사용하는 전용 추적 변수입니다.<br>
                        • <code>variable=food</code> : 서로 다른 두 개의 라디오버튼에 완전히 동일한 변수인 food를 연결해주면 자동으로 하나의 그룹으로 묶여 둘 중 하나만 선택되도록 동작합니다.
                    </div>

                    <!-- [7차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">📋 [7차시] 목록 선택 Listbox 위젯</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 리스트박스는 여러 개의 데이터 항목을 스크롤 가능한 세로 목록 형태로 보여주고 사용자가 원하는 항목을 직관적으로 클릭해 선택할 수 있게 돕는 유용한 위젯입니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> tkinter <span class="code-keyword">import</span> *

<span class="code-keyword">def</span> <span class="code-def">show_selected</span>(event):
    <span class="code-comment"># 선택된 항목의 인덱스 번호 가져오기</span>
    selection = lang_lb.curselection()
    <span class="code-keyword">if</span> selection:
        result_lbl.config(text=<span class="code-str">"선택한 항목: "</span> + lang_lb.get(selection[<span class="code-num">0</span>]))

root = Tk()
lang_lb = Listbox(root, height=<span class="code-num">5</span>)
lang_lb.pack(padx=<span class="code-num">10</span>, pady=<span class="code-num">10</span>)

<span class="code-keyword">for</span> item <span class="code-keyword">in</span> [<span class="code-str">"Python"</span>, <span class="code-str">"Java"</span>, <span class="code-str">"JavaScript"</span>, <span class="code-str">"C"</span>, <span class="code-str">"C++"</span>]:
    lang_lb.insert(END, item)

<span class="code-comment"># 리스트박스 항목 클릭 이벤트 연동</span>
lang_lb.bind(<span class="code-str">"&lt;&lt;ListboxSelect&gt;&gt;"</span>, show_selected)

result_lbl = Label(root, text=<span class="code-str">""</span>)
result_lbl.pack(pady=<span class="code-num">10</span>)

root.mainloop()</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>lang_lb.insert(END, item)</code> : 준비된 데이터 리스트를 for문으로 순회하며 리스트박스의 맨 끝(END)에 차곡차곡 추가합니다.<br>
                        • <code>curselection()</code> : 사용자가 현재 마우스로 파랗게 선택해 둔 항목의 인덱스 번호들을 튜플 형태로 반환해 줍니다.<br>
                        • <code>bind("&lt;&lt;ListboxSelect&gt;&gt;", 함수)</code> : 리스트박스 안의 항목을 클릭하여 선택 상태가 변하는 순간을 감지하여 지정된 함수를 즉시 호출합니다.
                    </div>

                    <!-- [8차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">📐 [8차시] 화면 배치 관리자 공통 개념 (pack, grid, place)</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 모든 위젯은 자신을 담는 부모 창 안에 배치 관리자를 통해 적절한 위치를 배정받아야 화면에 나타납니다. 상황에 맞게 위에서 아래로 쌓는 pack 바둑판처럼 배치하는 grid 원하는 픽셀 위치에 꽂아 넣는 place 레이아웃을 골라 사용합니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> tkinter <span class="code-keyword">import</span> *

root = Tk()

<span class="code-comment"># 1. pack 배치: 위에서 아래로 차곡차곡 적층</span>
Label(root, text=<span class="code-str">"pack 위젯 1"</span>, bg=<span class="code-str">"red"</span>).pack()

<span class="code-comment"># 2. grid 배치 : 행(row)과 열(column)을 지정하여 바둑판 격자에 배치</span>
Label(root, text=<span class="code-str">"이름"</span>).grid(row=<span class="code-num">0</span>, column=<span class="code-num">0</span>)
Entry(root).grid(row=<span class="code-num">0</span>, column=<span class="code-num">1</span>)

<span class="code-comment"># 3. place 배치: 창 안의 특정 (x, y) 절대 좌표에 강제 고정</span>
Label(root, text=<span class="code-str">"절대 위치 (50, 100)"</span>, bg=<span class="code-str">"lightblue"</span>).place(x=<span class="code-num">50</span>, y=<span class="code-num">100</span>)

root.mainloop()</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>pack()</code> : 복잡한 계산 없이 위젯을 창의 위 상하좌우 벽에 붙여 순서대로 쌓아 올릴 때 사용하기 가장 편리한 방식입니다.<br>
                        • <code>grid(row=..., column=...)</code> : 엑셀 표처럼 화면을 보이지 않는 격자로 나누고 가로세로 줄 번호를 명시하여 로그인 화면 등을 반듯하게 구성할 때 탁월합니다.<br>
                        • <code>place(x=..., y=...)</code> : 창의 왼쪽 위 원점을 기준으로 지정한 xy 픽셀 좌표에 위젯을 겹치거나 띄워서 배치할 때 유용합니다.
                    </div>

                    <!-- [9차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">🔔 [9차시] 표준 대화상자 알림 및 확인창 (messagebox)</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 프로그램을 사용하다 보면 경고창을 띄우거나 정말 종료할지 묻는 팝업 창이 필요합니다. messagebox 모듈을 활용하면 별도의 복잡한 창 설계 없이 운영체제 표준 디자인의 팝업 창을 손쉽게 호출할 수 있습니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> tkinter <span class="code-keyword">import</span> *
<span class="code-keyword">from</span> tkinter <span class="code-keyword">import</span> messagebox

root = Tk()
root.geometry(<span class="code-str">"200x150"</span>)

<span class="code-keyword">def</span> <span class="code-def">exit_app</span>():
    <span class="code-comment"># 예(True) / 아니오(False)를 묻는 팝업 대화상자 띄우기</span>
    <span class="code-keyword">if</span> messagebox.askyesno(<span class="code-str">"확인"</span>, <span class="code-str">"정말 종료할까요?"</span>):
        root.destroy() <span class="code-comment"># 메인 창 완전히 닫기</span>

Button(root, text=<span class="code-str">"종료"</span>, command=exit_app).pack(pady=<span class="code-num">40</span>)
root.mainloop()</code></pre>
                    </div>
                    <div class="result-box">
                        <b>🔍 코드 톺아보기</b><br>
                        • <code>messagebox.askyesno()</code> : 사용자에게 질문 던지고 예 버튼 누르면 True 아니오 버튼 누르면 False 값을 돌려주는 유용한 함수입니다.<br>
                        • <code>root.destroy()</code> : 프로그램의 뼈대인 메인 창(root) 위젯을 메모리에서 완전히 파괴하여 프로그램을 깨끗하게 종료시킵니다.
                    </div>

                    <!-- [10차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">💬 [10차시] 파일 탐색 및 데이터 입력 대화상자 종합</h1>
                    <p class="section-desc"><b>핵심 개념 설명:</b> 사용자가 시스템 탐색기를 열어 파일을 직접 고르게 하거나 나이 이름 등 짧은 문자열을 팝업창으로 바로 입력받을 때 사용하는 고급 대화상자 모듈들을 종합적으로 실습합니다.</p>
                    
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>전체 실습 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> tkinter <span class="code-keyword">import</span> *
<span class="code-keyword">from</span> tkinter <span class="code-keyword">import</span> filedialog
<span class="code-keyword">from</span> tkinter <span class="code-keyword">import</span> simpledialog

root = Tk()
root.geometry(<span class="code-str">"300x150"</span>)

<span class="code-keyword">def</span> <span class="code-def">select_file</span>():
    <span class="code-comment"># 파일 탐색기를 열어 파일 경로 반환받기</span>
    path = filedialog.askopenfilename(

from tkinter import messagebox

root = Tk(); root.title('오늘의 할 일')
entry = Entry(root, width=30); entry.pack(pady=8)
items = Listbox(root, width=35, height=8); items.pack()

def add_item():
    value = entry.get().strip()
    if value:
        items.insert(END, value); entry.delete(0, END)

def remove_item():
    selected = items.curselection()
    if selected: items.delete(selected[0])
    else: messagebox.showinfo('안내', '항목을 선택하세요.')

Button(root, text='추가', command=add_item).pack()
Button(root, text='선택 삭제', command=remove_item).pack()
root.mainloop()</code></pre>

                        <pre><code>from tkinter import *
from tkinter import ttk

root = Tk(); root.title('학습 진행률')
progress = ttk.Progressbar(root, maximum=100, length=260)
progress.pack(padx=20, pady=20)
label = Label(root, text='0%'); label.pack()

working = False

def step():
    if not working: return
    n = min(100, int(progress['value']) + 5)
    progress['value'] = n
    label.config(text=f'{n}%')
    if n < 100: root.after(200, step)

def start():
    global working
    working = True; progress['value'] = 0; step()

Button(root, text='시작', command=start).pack(pady=10)
root.mainloop()</code></pre>

root = Tk(); root.title('파이썬 퀴즈')

from tkinter import messagebox

root = Tk(); root.title('사칙연산 계산기')
a = Entry(root); b = Entry(root)
a.pack(pady=5); b.pack(pady=5)

answer = Label(root, text='결과'); answer.pack(pady=8)

def calc(op):
    try:
        x, y = float(a.get()), float(b.get())
        if op == '+': z = x + y
        elif op == '-': z = x - y
        elif op == '*': z = x * y
        else:
            if y == 0: raise ZeroDivisionError
            z = x / y
        answer.config(text=f'결과: {z:g}')
    except (ValueError, ZeroDivisionError):
        messagebox.showerror('오류', '숫자 또는 0으로 나누기를 확인하세요.')

for op in ['+', '-', '*', '/']:
    Button(root, text=op, command=lambda x=op: calc(x)).pack(side='left', padx=8)

root.mainloop()</code></pre>

with open('202304_세종.csv', 'r', encoding='cp949') as data:

    print(header) # header만 따로 출력해보자
    
    최저기온, 최고기온, 날짜 = [], [], []
    
    for row in filereader:

        row[0] = row[0].replace('\\t', '')
        날짜.append(row[0][-5:])

    print(최저기온)
    print(최고기온)
    print(날짜)</code></pre>

<span class="code-keyword">print</span>(bin(n))       <span class="code-comment"># 0b101111</span>

<span class="code-keyword">print</span>(hex(n))       <span class="code-comment"># 0x2f</span>
