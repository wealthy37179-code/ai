            <ul class="menu-list">

        <!-- 우측 메인 뷰어 -->

    <script>
        const lessons = {
            lesson1: {
                title: "01. 파이썬 프로그래밍 함수 (Function) 수업",
                icon: "📦",
                html: `
                    <h1 class="article-title">파이썬 프로그래밍 함수(Function) 수업</h1>
                    <div class="article-intro">
                        <b>핵심 흐름:</b> 정의하기 → 호출하기 → 값 전달하기 → 결과 돌려받기 → 함수로 문제 나누기<br>
                        함수는 반복되는 코드를 이름표를 붙인 상자에 깔끔하게 담아두고, 필요할 때마다 간결하게 호출하여 재사용하는 핵심 도구입니다.
                    </div>

                    <!-- [1차시] -->
                    <h1 class="chapter-h1">📦 [1차시] 함수 정의와 호출 - 함수를 처음 만나다</h1>
                    <div class="tip-callout">
                        <b>🎯 학습 목표:</b> 함수가 왜 필요한지 설명할 수 있고, <code>def</code>를 사용하여 함수를 정의한 뒤 함수 이름으로 호출할 수 있다.
                    </div>
                    <h2 class="section-h2">1. 개념 이야기: 주문 즉시 움직이는 마법 상자</h2>
                    <p class="section-desc">
                        자주 쓰는 동작을 상자에 담아두고 이름표를 붙이는 것을 <b>함수 정의(<code>def</code>)</b>라고 하며, 상자에 달린 버튼을 눌러 실행하는 것을 <b>함수 호출(call)</b>이라고 합니다. 정의만 하면 실행되지 않으며, 반드시 이름을 불러야 동작합니다.
                    </p>
                    <h2 class="section-h2">2. 핵심 예제</h2>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>함수 정의 및 호출</span></div>
                        <pre><code><span class="code-keyword">def</span> <span class="code-def">hello</span>():
    <span class="code-keyword">print</span>(<span class="code-str">"안녕하세요!"</span>)
    <span class="code-keyword">print</span>(<span class="code-str">"파이썬 함수 수업입니다."</span>)

hello()
hello()</code></pre>
                    </div>
                    <span class="result-label">🖥️ 실행 결과</span>
                    <div class="result-box">안녕하세요!<br>파이썬 함수 수업입니다.<br>안녕하세요!<br>파이썬 함수 수업입니다.</div>
                    <h2 class="section-h2">3. 실습 도전 과제 및 퀴즈</h2>
                    <div class="tip-callout">
                        • 실습 1. 함수 이름을 <code>welcome()</code>으로 바꾸어 보기<br>
                        • 실습 2. 함수 안에서 자신의 이름과 좋아하는 과목을 출력해 보기<br>
                        • 실습 3. 함수를 3번 호출했을 때 결과가 어떻게 출력되는지 확인해 보기
                    </div>
                    <div class="quiz-item">
                        <div class="quiz-q">Q. 함수 이름 hello와 호출 코드 hello()의 결정적 차이는 무엇인가요?</div>
                        <div class="quiz-a">정답: hello는 함수 자체의 이름을 가리키며, ()가 붙어야 실제로 상자 안의 코드가 실행됩니다.</div>
                    </div>
                    <div class="insight-callout">📌 오늘의 핵심: 함수는 코드를 이름으로 묶고, 호출하여 실행한다.</div>

                    <!-- [2차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">📥 [2차시] 매개변수와 인수 - 함수에 값 전달하기</h1>
                    <div class="tip-callout">
                        <b>🎯 학습 목표:</b> 매개변수와 인수의 의미를 구분할 수 있고, 호출할 때 전달한 값을 함수 내부에서 사용할 수 있다.
                    </div>
                    <h2 class="section-h2">1. 개념 이야기: 동전 투입구가 있는 만능 자판기</h2>
                    <p class="section-desc">
                        함수 상자에 투입구(슬롯)를 만들어두면 외부 재료를 집어넣을 수 있습니다. 함수를 정의할 때 값을 받아둘 빈 그릇 변수를 <b>매개변수(parameter)</b>, 부를 때 쏙 집어넣는 실제 값을 <b>인수(argument)</b>라고 합니다.
                    </p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>매개변수 활용</span></div>
                        <pre><code><span class="code-keyword">def</span> <span class="code-def">greet</span>(name):
    <span class="code-keyword">print</span>(name, <span class="code-str">"님, 안녕하세요!"</span>)

greet(<span class="code-str">"민준"</span>)
greet(<span class="code-str">"서연"</span>)</code></pre>
                    </div>
                    <div class="quiz-item">
                        <div class="quiz-q">Q. greet('지우')에서 '지우'는 매개변수인가요, 인수인가요?</div>
                        <div class="quiz-a">정답: 함수를 호출할 때 실제로 전달하는 값이므로 인수(argument)입니다.</div>
                    </div>
                    <div class="insight-callout">📌 오늘의 핵심: 매개변수는 함수가 값을 받아 사용하는 통로이다.</div>

                    <!-- [3차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">📤 [3차시] return - 함수의 결과를 돌려받기</h1>
                    <div class="tip-callout">
                        <b>🎯 학습 목표:</b> print와 return의 차이를 명확히 설명할 수 있고, 함수가 계산한 값을 return으로 반환하여 활용할 수 있다.
                    </div>
                    <h2 class="section-h2">1. 개념 이야기: 전광판(print) vs 계산 결과 전달(return)</h2>
                    <p class="section-desc">
                        <code>print()</code>는 모니터 화면에 글자를 보여주고 사라지는 전광판이며 변수에 값이 남지 않습니다(None). 반면에 <code>return</code>은 계산 결과물을 함수 밖으로 꺼내 호출자의 손에 쥐여주므로 변수에 담아 재활용할 수 있습니다.
                    </p>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>return 반환값과 연쇄 연산</span></div>
                        <pre><code><span class="code-keyword">def</span> <span class="code-def">add</span>(a, b):
    result = a + b
    <span class="code-keyword">return</span> result

answer = add(<span class="code-num">10</span>, <span class="code-num">20</span>)
<span class="code-keyword">print</span>(answer)
<span class="code-keyword">print</span>(add(<span class="code-num">3</span>, <span class="code-num">5</span>) * <span class="code-num">2</span>)</code></pre>
                    </div>
                    <span class="result-label">🖥️ 실행 결과</span>
                    <div class="result-box">30<br>16</div>
                    <div class="quiz-item">
                        <div class="quiz-q">Q. return문 바로 아래에 작성된 코드는 실행될까요?</div>
                        <div class="quiz-a">정답: 실행되지 않습니다. return을 만나는 순간 결과값을 반환하고 함수는 즉시 종료됩니다.</div>
                    </div>
                    <div class="insight-callout">📌 오늘의 핵심: return은 함수의 결과를 함수 밖으로 돌려준다.</div>

                    <!-- [4차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">🔢 [4차시] 여러 개의 매개변수 - 계산 함수 만들기</h1>
                    <div class="tip-callout">
                        <b>🎯 학습 목표:</b> 두 개 이상의 매개변수를 다루고, 위치 인수와 키워드 인수의 차이를 구분한다.
                    </div>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>위치 인수와 키워드 인수</span></div>
                        <pre><code><span class="code-keyword">def</span> <span class="code-def">student_info</span>(name, age, school):
    <span class="code-keyword">print</span>(<span class="code-str">"이름:"</span>, name)
    <span class="code-keyword">print</span>(<span class="code-str">"나이:"</span>, age)
    <span class="code-keyword">print</span>(<span class="code-str">"학교:"</span>, school)

<span class="code-comment"># 1) 위치 인수 방식 (순서 일치)</span>
student_info(<span class="code-str">"지민"</span>, <span class="code-num">17</span>, <span class="code-str">"한솔고"</span>)

<span class="code-comment"># 2) 키워드 인수 방식 (이름표 지정으로 순서 무관)</span>
student_info(school=<span class="code-str">"한솔고"</span>, name=<span class="code-str">"지민"</span>, age=<span class="code-num">17</span>)</code></pre>
                    </div>

                    <!-- [5차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">⚙️ [5차시] 기본값 매개변수 - 값을 생략해도 되는 함수</h1>

                        <pre><code><span class="code-keyword">from</span> tkinter <span class="code-keyword">import</span> messagebox, filedialog, simpledialog

<span class="code-comment"># 1. 메시지 박스 (예/아니오 확인)</span>

        // 초기 화면 렌더링 (첫 번째 레슨 로드)
        document.getElementById('lesson-content').innerHTML = lessons.lesson1.html;

        function selectLesson(lessonKey, element) {
            const lesson = lessons[lessonKey];
            document.getElementById('topic-icon').innerText = lesson.icon;
            document.getElementById('topic-title').innerText = lesson.title;
            document.getElementById('lesson-content').innerHTML = lesson.html;

            const menuItems = document.querySelectorAll('.menu-item');
            menuItems.forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('web-article-view').scrollTop = 0;
        }
