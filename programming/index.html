    <style>

        /* 사이드바 */

            width: 260px;

        .sidebar-header {

        .sidebar-section-title {
            font-size: 12px;

        .menu-list {
            list-style: none;

        /* 본문 영역 */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            overflow: hidden;
        }
        .content-header {
            height: 54px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 28px;
            display: flex;

        }
        .current-topic {
            font-size: 16px;
            font-weight: 800;
            color: #0f172a;

            align-items: center;

        }

        /* 스크롤 본문 */
        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 36px 44px;
            background: #ffffff;
        }
        .article-container {
            max-width: 860px;
            margin: 0 auto;
            line-height: 1.75;
        }
        .article-title {
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .article-intro {
            font-size: 14.5px;

            background: #f8fafc;

        }
        .section-h2 {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin: 24px 0 10px 0;
            display: flex;

        }
        .section-desc {
            font-size: 14px;

            margin-bottom: 10px;
        }

        /* 코드 블록 */
        .code-block-wrapper {
            background: #0f172a;
            border-radius: 10px;
            margin: 12px 0 18px 0;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.08);
        }
        .code-header {
            background: #1e293b;
            padding: 7px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            color: #94a3b8;
            font-family: monospace;
        }
        .code-lang {
            color: #38bdf8;

        }
        pre code {
            display: block;
            padding: 14px 18px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;

            overflow-x: auto;
        }
        .code-comment { color: #64748b; font-style: italic; }
        .code-keyword { color: #f472b6; font-weight: bold; }
        .code-str { color: #a5f3fc; }
        .code-num { color: #fde047; }
        .code-def { color: #67e8f9; font-weight: bold; }

        /* 결과 박스 */
        .result-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px 16px;
            margin: -6px 0 20px 0;
            font-family: 'Consolas', monospace;
            font-size: 12.5px;
            color: #334155;
            line-height: 1.55;
            overflow-x: auto;
        }
        .result-label {
            font-size: 11.5px;
            font-weight: 800;
            color: #475569;
            text-transform: uppercase;
            margin: 16px 0 6px 0;
            display: block;
        }

        .tip-callout {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 14px 16px;
            margin: 16px 0 24px 0;
            font-size: 13.5px;
            color: #1e40af;
            line-height: 1.6;
        }
        .insight-callout {
            background: #ecfeff;
            border: 1px solid #a5f3fc;
            border-left: 4px solid #0891b2;
            border-radius: 0 10px 10px 0;
            padding: 14px 18px;
            margin: 20px 0 28px 0;
            font-size: 13.5px;
            color: #155e75;
            line-height: 1.65;
        }
        .insight-title {
            font-weight: 800;
            color: #0e7490;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .custom-table {
            width: 100%;
            border-collapse: collapse;
            margin: 14px 0 22px 0;
            font-size: 13px;
        }
        .custom-table th, .custom-table td {
            border: 1px solid #e2e8f0;
            padding: 9px 12px;
            text-align: left;
        }
        .custom-table th {
            background-color: #f1f5f9;
            color: #1e293b;
            font-weight: 700;
        }
        .custom-table td {
            background-color: #ffffff;
        }

        /* 퀴즈 박스 */
        .quiz-item {
            background: #fdf4ff;
            border: 1px solid #f5d0fe;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }
        .quiz-q {
            font-size: 13.5px;
            font-weight: 700;
            color: #86198f;
            margin-bottom: 6px;
        }
        .quiz-a {
            font-size: 13px;
            color: #701a75;
            background: #ffffff;
            border-radius: 6px;
            padding: 8px 12px;
            display: inline-block;
            border: 1px dashed #d8b4fe;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="header-logo">⚡</div>
            <div class="header-title">파이썬 프로그래밍 강의실</div>
            <span class="header-subtitle">온라인 인터랙티브 교재</span>
        </div>
        <div>
            <span class="badge-status">수업 진행 중</span>
        </div>
    </header>

    <div class="main-container">
        <!-- 사이드바: 3개 메인 주제 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-section-title">
                    <span>📑</span> 수업 목차 (Curriculum)
                </div>
            </div>
            
            <ul class="menu-list">
                <li class="menu-item active" onclick="selectLesson('lesson1', this)">
                    <span class="menu-icon">🐢</span>
                    <span>01. turtle 모듈</span>
                </li>

                <li class="menu-item" onclick="selectLesson('lesson2', this)">
                    <span class="menu-icon">📦</span>
                    <span>02. 파이썬 함수</span>
                </li>

                <li class="menu-item" onclick="selectLesson('lesson3', this)">
                    <span class="menu-icon">🖥️</span>
                    <span>03. tkinter 모듈</span>
                </li>
            </ul>
        </aside>

        <!-- 우측 메인 뷰어 -->
        <main class="content-area">
            <div class="content-header">
                <div class="current-topic">
                    <span id="topic-icon">🐢</span>
                    <span id="topic-title">01. turtle 모듈</span>
                </div>
            </div>

            <!-- 웹 교재 본문 -->
            <div class="content-body" id="web-article-view">
                <div class="article-container" id="lesson-content">
                </div>
            </div>
        </main>
    </div>

    <script>
        const lessons = {
            // [01. turtle 모듈: turtle_1.pdf 1~8차시 전체 내용]
            lesson1: {
                title: "01. turtle 모듈",
                icon: "🐢",
                html: `
                    <h1 class="article-title">파이썬 터틀 그래픽 다루기</h1>
                    <div class="article-intro">
                        거북이 그래픽 모듈(<code>turtle</code>)의 기초 이동과 회전부터 반복문 도형 그리기, 좌표 점프, 색상 채우기, 그리고 함수와 중점 공식을 결합한 기하학적 패턴 구현까지 단계별로 학습합니다.
                    </div>

                    <!-- [1차시] -->
                    <h1 class="chapter-h1">🐢 [1차시] 거북이 화면 띄우고 움직이기</h1>
                    <div class="tip-callout">
                        <b>오늘의 핵심 개념:</b> 파이썬에서 화면에 그림을 그리기 위해 거북이를 불러옵니다. 거북이는 우리가 지시하는 방향과 거리만큼 움직이며 선을 남깁니다.<br>
                        <b>개념 채우기:</b> 터틀 모듈을 불러올 때는 <code>turtle</code> 명령어를 사용합니다. 거북이를 앞으로 이동시킬 때는 <code>forward(거리)</code>, 오른쪽으로 회전할 때는 <code>right(각도)</code>를 사용합니다.
                    </div>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>기본 이동과 회전</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
<span class="code-keyword">import</span> turtle <span class="code-keyword">as</span> t

shape(<span class="code-str">"turtle"</span>)
forward(<span class="code-num">100</span>) <span class="code-comment"># 앞으로 100만큼 이동</span>
right(<span class="code-num">90</span>)    <span class="code-comment"># 오른쪽으로 90도 회전</span>
forward(<span class="code-num">100</span>) <span class="code-comment"># 다시 앞으로 100만큼 이동</span>
done()</code></pre>
                    </div>
                    <div class="result-box">
                        <b>실습 도전 미션:</b> 코드를 완성한 뒤, 거북이가 화면에서 기역(ㄱ)자 모양으로 꺾이며 움직이는지 확인해 보세요.
                    </div>

                    <!-- [2차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">🔄 [2차시] 반복문(for)으로 기본 도형 그리기</h1>
                    <div class="tip-callout">
                        <b>오늘의 핵심 개념:</b> 사각형을 그리려면 전진과 회전을 4번 반복해야 합니다. 반복문을 사용하면 코드를 짧고 효율적으로 작성할 수 있습니다.<br>
                        <b>개념 채우기:</b> 정해진 횟수만큼 명령을 반복할 때는 <code>for</code> 반복문을 사용합니다. 정사각형을 그리려면 90도씩 <b>4</b>번 반복해야 합니다.
                    </div>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>정사각형 그리기</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
<span class="code-keyword">import</span> turtle <span class="code-keyword">as</span> t

shape(<span class="code-str">"turtle"</span>)
<span class="code-keyword">for</span> i <span class="code-keyword">in</span> range(<span class="code-num">4</span>):
    forward(<span class="code-num">100</span>)
    left(<span class="code-num">90</span>)
done()</code></pre>
                    </div>
                    <div class="result-box">
                        <b>실습 도전 미션:</b> 한 변의 길이가 100인 정사각형을 그리는 코드를 실행해 보고, 숫자를 수정하여 120도 회전하는 정삼각형(3회 반복)도 그려보세요.
                    </div>

                    <!-- [3차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">✏️ [3차시] 펜 들기(penup)와 내리기(pendown)</h1>
                    <div class="tip-callout">
                        <b>오늘의 핵심 개념:</b> 화면 여러 곳으로 거북이를 이동시켜야 합니다. 이때 선을 긋지 않고 이동하는 기술이 필요합니다.<br>
                        <b>개념 채우기:</b> 거북이가 이동할 때 선이 안 그려지게 펜을 드는 명령은 <code>penup()</code>이고, 다시 선을 그리게 하려면 <code>pendown()</code>을 사용합니다.
                    </div>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>펜 제어</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
<span class="code-keyword">import</span> turtle <span class="code-keyword">as</span> t

forward(<span class="code-num">50</span>)
penup()    <span class="code-comment"># 펜 들기 (점프 준비)</span>
forward(<span class="code-num">50</span>) <span class="code-comment"># 선 없이 이동</span>
pendown()  <span class="code-comment"># 펜 내리기 (다시 그리기 준비)</span>
forward(<span class="code-num">50</span>)
done()</code></pre>
                    </div>
                    <div class="result-box">
                        <b>실습 도전 미션:</b> 코드를 실행하여 두 개의 선분이 중간에 끊어져서 나란히 나타나는지 확인해 보세요.
                    </div>

                    <!-- [4차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">📍 [4차시] 절대 좌표 이동 (goto)</h1>
                    <div class="tip-callout">
                        <b>오늘의 핵심 개념:</b> 화면의 정중앙은 x=0, y=0 원점입니다. 거북이가 방향을 돌릴 필요 없이 특정 목적지로 곧바로 날아가게 만들 수 있습니다.<br>
                        <b>개념 채우기:</b> 특정 (x, y) 좌표로 거북이를 한 번에 이동시키는 명령어는 <code>goto(x, y)</code> 입니다.
                    </div>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>절대 좌표로 삼각형 뼈대 그리기</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
<span class="code-keyword">import</span> turtle <span class="code-keyword">as</span> t

<span class="code-comment"># 삼각형 꼭짓점 3개 튜플 좌표</span>
A = (<span class="code-num">0</span>, <span class="code-num">100</span>)
B = (-<span class="code-num">100</span>, -<span class="code-num">50</span>)
C = (<span class="code-num">100</span>, -<span class="code-num">50</span>)

penup()
goto(A[<span class="code-num">0</span>], A[<span class="code-num">1</span>])  <span class="code-comment"># A 꼭짓점으로 점프</span>
pendown()
goto(B[<span class="code-num">0</span>], B[<span class="code-num">1</span>])  <span class="code-comment"># B로 선 긋기</span>
goto(C[<span class="code-num">0</span>], C[<span class="code-num">1</span>])  <span class="code-comment"># C로 선 긋기</span>
goto(A[<span class="code-num">0</span>], A[<span class="code-num">1</span>])  <span class="code-comment"># 다시 A로 선 긋기</span>
done()</code></pre>
                    </div>
                    <div class="result-box">
                        <b>실습 도전 미션:</b> 세 꼭짓점 A, B, C를 연결하여 화면 중앙에 삼각형 뼈대가 깔끔하게 완성되는지 확인해 보세요.
                    </div>

                    <!-- [5차시] -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">🎨 [5차시] 도형 내부에 색상 채우기</h1>
                    <div class="tip-callout">
                        <b>오늘의 핵심 개념:</b> 도형의 내부를 예쁜 색으로 칠하면 여러 개의 삼각형이 겹쳐지는 프랙탈 구조를 훨씬 뚜렷하게 관찰할 수 있습니다.<br>
                        <b>개념 채우기:</b> 색칠을 시작하겠다고 알리는 명령은 <code>begin_fill()</code>이고, 도형이 닫힌 후 색칠을 마무리하는 명령은 <code>end_fill()</code>입니다.
                    </div>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>도형 채색</span></div>
                        <pre><code><span class="code-keyword">from</span> turtle <span class="code-keyword">import</span> *
<span class="code-keyword">import</span> turtle <span class="code-keyword">as</span> t

color(<span class="code-str">"blue"</span>, <span class="code-str">"skyblue"</span>) <span class="code-comment"># 테두리: 파랑, 면: 하늘색</span>
begin_fill()            <span class="code-comment"># 색칠 시작 준비</span>
<span class="code-keyword">for</span> i <span class="code-keyword">in</span> range(<span class="code-num">3</span>):
    forward(<span class="code-num">120</span>)
    left(<span class="code-num">120</span>)
end_fill()              <span class="code-comment"># 닫힌 영역 색칠 완성</span>
done()</code></pre>
                    </div>
                    <div class="result-box">

                    <h1 class="chapter-h1" style="margin-top: 50px;">🔘 [3~4차시] 라벨(Label)과 버튼(Button) 이벤트</h1>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>라벨 및 버튼 연동</span></div>
                        <pre><code><span class="code-keyword">from</span> tkinter <span class="code-keyword">import</span> *

<span class="code-keyword">def</span> <span class="code-def">hello</span>():
    lbl.config(text=<span class="code-str">"버튼을 클릭했습니다!"</span>)

root = Tk()
lbl = Label(root, text=<span class="code-str">"환영합니다!"</span>, font=(<span class="code-str">"Arial"</span>, <span class="code-num">16</span>, <span class="code-str">"bold"</span>), fg=<span class="code-str">"navy"</span>)
lbl.pack(pady=<span class="code-num">20</span>)

btn = Button(root, text=<span class="code-str">"클릭"</span>, command=hello)
btn.pack()
root.mainloop()</code></pre>
                    </div>

                    <!-- 5~6차시 -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">⌨️ [5~6차시] 입력 위젯: 엔트리(Entry) & 텍스트(Text)</h1>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>Entry 활용</span></div>
                        <pre><code><span class="code-keyword">from</span> tkinter <span class="code-keyword">import</span> *

<span class="code-keyword">def</span> <span class="code-def">change_text</span>():
    text = ent.get()
    ent.delete(<span class="code-num">0</span>, END)
    ent.insert(<span class="code-num">0</span>, text.upper())

root = Tk()
ent = Entry(root)
ent.pack(padx=<span class="code-num">10</span>, pady=<span class="code-num">10</span>)

btn = Button(root, text=<span class="code-str">"대문자로 변경"</span>, command=change_text)
btn.pack(padx=<span class="code-num">10</span>, pady=<span class="code-num">10</span>)
root.mainloop()</code></pre>
                    </div>

                    <!-- 7~9차시 -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">☑️ [7~9차시] 선택 위젯: 체크버튼, 라디오버튼, 리스트박스</h1>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>선택 위젯 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> tkinter <span class="code-keyword">import</span> *

root = Tk()
agree_var = BooleanVar()
check_btn = Checkbutton(root, text=<span class="code-str">"동의합니다"</span>, variable=agree_var)
check_btn.pack(pady=<span class="code-num">5</span>)

food = IntVar(value=<span class="code-num">1</span>)
rb_meat = Radiobutton(root, text=<span class="code-str">"육고기"</span>, variable=food, value=<span class="code-num">1</span>)
rb_seafood = Radiobutton(root, text=<span class="code-str">"해산물"</span>, variable=food, value=<span class="code-num">2</span>)
rb_meat.pack()
rb_seafood.pack()

root.mainloop()</code></pre>

                    <h1 class="chapter-h1" style="margin-top: 50px;">📐 [10차시] 배치 관리자: pack, grid, place</h1>

Label(root, text=<span class="code-str">"나이"</span>).grid(row=<span class="code-num">1</span>, column=<span class="code-num">0</span>)

)</code></pre>

                `
            }

        // 초기 화면 렌더링 (01. turtle 모듈)
        document.getElementById('lesson-content').innerHTML = lessons.lesson1.html;

        function selectLesson(lessonKey, element) {
            const lesson = lessons[lessonKey];
            document.getElementById('topic-icon').innerText = lesson.icon;
            document.getElementById('topic-title').innerText = lesson.title;
            document.getElementById('lesson-content').innerHTML = lesson.html;

            const menuItems = document.querySelectorAll('.menu-item');
            menuItems.forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('web-article-view').scrollTop = 0;
        }
