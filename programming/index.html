<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파이썬 프로그래밍 학습 자료실</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 상단 헤더 */
        header {
            height: 58px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
            z-index: 10;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-logo {
            font-size: 22px;
            background: #e0f2fe;
            color: #0284c7;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
        .header-title {
            font-size: 17px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.3px;
        }
        .header-subtitle {
            font-size: 12px;
            color: #64748b;
            margin-left: 8px;
            padding-left: 8px;
            border-left: 1px solid #cbd5e1;
        }
        .badge-status {
            background: #e0f2fe;
            color: #0369a1;
            font-size: 11.5px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 16px;
        }

        /* 메인 2단 레이아웃 */
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 58px);
            overflow: hidden;
        }

        /* 사이드바 */
        .sidebar {
            width: 280px;
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 16px 18px 10px 18px;
            border-bottom: 1px solid #f1f5f9;
        }
        .sidebar-section-title {
            font-size: 12px;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .menu-list {
            list-style: none;
            padding: 12px 10px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }
        .menu-item:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }
        .menu-item.active {
            background-color: #e0f2fe;
            color: #0284c7;
            font-weight: 800;
        }
        .menu-icon {
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-badge {
            margin-left: auto;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.04);
            color: #64748b;
        }
        .menu-item.active .menu-badge {
            background: #bae6fd;
            color: #0369a1;
        }

        /* 본문 영역 */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            overflow: hidden;
        }
        .content-header {
            height: 54px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .current-topic {
            font-size: 16px;
            font-weight: 800;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 스크롤 본문 */
        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 36px 44px;
            background: #ffffff;
        }
        .article-container {
            max-width: 860px;
            margin: 0 auto;
            line-height: 1.75;
        }
        .article-title {
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .article-intro {
            font-size: 14.5px;
            color: #475569;
            background: #f8fafc;
            border-left: 4px solid #0284c7;
            padding: 14px 18px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 30px;
        }
        .chapter-h1 {
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
            margin: 38px 0 16px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #0284c7;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-h2 {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin: 24px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-desc {
            font-size: 14px;
            color: #334155;
            margin-bottom: 10px;
        }

        /* 코드 블록 */
        .code-block-wrapper {
            background: #0f172a;
            border-radius: 10px;
            margin: 12px 0 18px 0;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.08);
        }
        .code-header {
            background: #1e293b;
            padding: 7px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            color: #94a3b8;
            font-family: monospace;
        }
        .code-lang {
            color: #38bdf8;
            font-weight: 700;
        }
        pre code {
            display: block;
            padding: 14px 18px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #e2e8f0;
            overflow-x: auto;
        }
        .code-comment { color: #64748b; font-style: italic; }
        .code-keyword { color: #f472b6; font-weight: bold; }
        .code-str { color: #a5f3fc; }
        .code-num { color: #fde047; }
        .code-def { color: #67e8f9; font-weight: bold; }

        /* 결과 박스 */
        .result-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px 16px;
            margin: -6px 0 20px 0;
            font-family: 'Consolas', monospace;
            font-size: 12.5px;
            color: #334155;
            line-height: 1.55;
            overflow-x: auto;
        }
        .result-label {
            font-size: 11.5px;
            font-weight: 800;
            color: #475569;
            text-transform: uppercase;
            margin: 16px 0 6px 0;
            display: block;
        }

        .tip-callout {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 14px 16px;
            margin: 16px 0 24px 0;
            font-size: 13.5px;
            color: #1e40af;
            line-height: 1.6;
        }

        .custom-table {
            width: 100%;
            border-collapse: collapse;
            margin: 14px 0 22px 0;
            font-size: 13px;
        }
        .custom-table th, .custom-table td {
            border: 1px solid #e2e8f0;
            padding: 9px 12px;
            text-align: left;
        }
        .custom-table th {
            background-color: #f1f5f9;
            color: #1e293b;
            font-weight: 700;
        }
        .custom-table td {
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="header-logo">⚡</div>
            <div class="header-title">파이썬 프로그래밍 강의실</div>
            <span class="header-subtitle">온라인 인터랙티브 교재</span>
        </div>
        <div>
            <span class="badge-status">수업 진행 중</span>
        </div>
    </header>

    <div class="main-container">
        <!-- 사이드바: 2개 메인 주제 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-section-title">
                    <span>📑</span> 수업 목차 (Curriculum)
                </div>
            </div>
            
            <ul class="menu-list">
                <li class="menu-item" onclick="selectLesson('lesson1', this)">
                    <span class="menu-icon">📦</span>

                <li class="menu-item active" onclick="selectLesson('lesson2', this)">

                </li>
            </ul>
        </aside>

        <!-- 우측 메인 뷰어 -->
        <main class="content-area">
            <div class="content-header">
                <div class="current-topic">
                    <span id="topic-icon">🖥️</span>
                    <span id="topic-title">02. 파이썬 Tkinter GUI 프로그래밍</span>
                </div>
            </div>

            <!-- 웹 교재 본문 -->
            <div class="content-body" id="web-article-view">
                <div class="article-container" id="lesson-content">
                </div>
            </div>
        </main>
    </div>

    <script>
        const lessons = {
            lesson1: {
                title: "01. 파이썬 프로그래밍 함수 (Function) 수업",
                icon: "📦",
                html: `
                    <h1 class="article-title">파이썬 프로그래밍 함수(Function) 수업</h1>
                    <div class="article-intro">
                        <b>핵심 흐름:</b> 정의하기 → 호출하기 → 값 전달하기 → 결과 돌려받기 → 함수로 문제 나누기<br>
                        함수는 반복되는 코드를 이름표를 붙인 상자에 깔끔하게 담아두고, 필요할 때마다 간결하게 호출하여 재사용하는 핵심 도구입니다.
                    </div>
                `
            },
            lesson2: {
                title: "02. 파이썬 Tkinter GUI 프로그래밍",
                icon: "🖥️",
                html: `
                    <h1 class="article-title">파이썬 Tkinter GUI 프로그래밍</h1>
                    <div class="article-intro">
                        <b>수업 구성:</b> 1~2차시 창 제어 → 3~6차시 기본 입력·출력 위젯 → 7~9차시 선택 위젯 → 10차시 배치 관리자 → 11~15차시 표준 대화상자<br>
                        Tkinter 모듈을 활용하여 윈도우 창을 만들고, 다양한 위젯을 배치하며 사용자와 소통하는 데스크톱 GUI 애플리케이션을 완성합니다.
                    </div>

                    <!-- 1~2차시 -->
                    <h1 class="chapter-h1">🪟 [1~2차시] 윈도우 창 생성 및 속성 제어</h1>
                    <div class="tip-callout">
                        <b>🎯 학습 목표:</b> GUI와 CUI의 차이를 이해하고, Tkinter로 첫 번째 윈도우 창을 생성하며 창의 속성을 자유롭게 제어한다.
                    </div>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>창 생성 및 속성 제어 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> tkinter <span class="code-keyword">import</span> *

root = Tk()
root.title(<span class="code-str">"첫 번째 윈도우"</span>)
root.geometry(<span class="code-str">"400x300"</span>)
root.resizable(<span class="code-keyword">False</span>, <span class="code-keyword">False</span>)  <span class="code-comment"># 창 크기 변경 차단</span>
root.config(bg=<span class="code-str">"#f0f0f0"</span>)      <span class="code-comment"># 윈도우 창 배경 색상 지정</span>
root.mainloop()</code></pre>
                    </div>

                    <!-- 3~4차시 -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">🔘 [3~4차시] 라벨(Label)과 버튼(Button) 위젯</h1>
                    <div class="tip-callout">
                        <b>🎯 학습 목표:</b> Label 위젯으로 텍스트를 출력하고, Button 위젯을 생성하여 클릭 이벤트 함수 연결 및 다양한 옵션을 적용한다.
                    </div>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>라벨 출력 및 버튼 이벤트 코드</span></div>
                        <pre><code><span class="code-keyword">from</span> tkinter <span class="code-keyword">import</span> *

<span class="code-keyword">def</span> <span class="code-def">hello</span>():
    lbl.config(text=<span class="code-str">"버튼을 클릭했습니다!"</span>)

root = Tk()
lbl = Label(root, text=<span class="code-str">"버튼을 눌러보세요"</span>, padx=<span class="code-num">40</span>, pady=<span class="code-num">10</span>)
lbl.pack()

btn = Button(root, text=<span class="code-str">"클릭"</span>, command=hello)
btn.pack()
root.mainloop()</code></pre>
                    </div>
                    <table class="custom-table">
                        <thead>
                            <tr><th>코드</th><th>의미</th></tr>
                        </thead>
                        <tbody>
                            <tr><td><code>command=hello</code></td><td>버튼 클릭 시 hello 함수 실행 (올바름)</td></tr>
                            <tr><td><code>command=hello()</code></td><td>프로그램 시작 시 바로 실행됨 (잘못됨)</td></tr>
                        </tbody>
                    </table>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>Button 옵션과 상태 적용</span></div>
                        <pre><code>e1_btn = Button(root, text=<span class="code-str">"두꺼운 테두리"</span>, bd=<span class="code-num">5</span>, relief=<span class="code-str">"raised"</span>, width=<span class="code-num">15</span>)
e1_btn.pack(pady=<span class="code-num">5</span>)

e2_btn = Button(root, text=<span class="code-str">"커서 변경 (손가락)"</span>, cursor=<span class="code-str">"hand2"</span>, bg=<span class="code-str">"lightyellow"</span>)
e2_btn.pack(pady=<span class="code-num">5</span>)

e3_btn = Button(root, text=<span class="code-str">"클릭 불가"</span>, state=<span class="code-str">"disabled"</span>)
e3_btn.pack(pady=<span class="code-num">5</span>)</code></pre>
                    </div>

                    <!-- 5~6차시 -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">⌨️ [5~6차시] 엔트리(Entry) & 텍스트(Text) 위젯</h1>
                    <div class="tip-callout">
                        <b>🎯 학습 목표:</b> 한 줄 입력을 처리하는 Entry 위젯과 여러 줄을 다루는 Text 위젯의 주요 메서드 및 인덱스 체계를 익힌다.
                    </div>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>입력값을 대문자로 변경하는 프로그램</span></div>
                        <pre><code><span class="code-keyword">from</span> tkinter <span class="code-keyword">import</span> *

<span class="code-keyword">def</span> <span class="code-def">change_text</span>():
    text = ent.get()
    ent.delete(<span class="code-num">0</span>, END)
    ent.insert(<span class="code-num">0</span>, text.upper())

root = Tk()
ent = Entry(root)
ent.pack(padx=<span class="code-num">10</span>, pady=<span class="code-num">10</span>)

btn = Button(root, text=<span class="code-str">"대문자로 변경"</span>, command=change_text)
btn.pack(padx=<span class="code-num">10</span>, pady=<span class="code-num">10</span>)
root.mainloop()</code></pre>
                    </div>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>비밀번호 입력 Entry & Text 위젯 사용</span></div>
                        <pre><code><span class="code-comment"># 비밀번호 입력 Entry</span>
password_ent = Entry(root, show=<span class="code-str">"*"</span>, width=<span class="code-num">30</span>)
password_ent.pack(pady=<span class="code-num">20</span>)

<span class="code-comment"># Text 위젯</span>
txt = Text(root)
txt.pack(pady=<span class="code-num">10</span>)</code></pre>
                    </div>
                    <p class="section-desc">
                        • <b>Text 인덱스:</b> Entry는 한 줄이므로 0부터 시작하지만, Text는 여러 줄이므로 <code>"줄.칸"</code> 형식(예: <code>"1.0"</code>은 1번째 줄 0번째 칸)과 <code>END</code>를 사용합니다.
                    </p>

                    <!-- 7~9차시 -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">☑️ [7~9차시] 선택 위젯: 체크버튼, 라디오버튼, 리스트박스</h1>
                    <div class="tip-callout">
                        <b>🎯 학습 목표:</b> Checkbutton, Radiobutton, Listbox 위젯의 사용법과 주요 옵션 및 인덱스 체계를 익힌다.
                    </div>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>Checkbutton & Radiobutton 예제</span></div>
                        <pre><code><span class="code-keyword">from</span> tkinter <span class="code-keyword">import</span> *

<span class="code-keyword">def</span> <span class="code-def">show_result</span>():
    <span class="code-keyword">if</span> agree_var.get():
        lbl.config(text=<span class="code-str">"동의했습니다."</span>)

root = Tk()
agree_var = BooleanVar()
check_btn = Checkbutton(root, text=<span class="code-str">"동의합니다"</span>, variable=agree_var, command=show_result)
check_btn.pack(padx=<span class="code-num">20</span>, pady=<span class="code-num">20</span>)

food = IntVar(value=<span class="code-num">1</span>)
rb_meat = Radiobutton(root, text=<span class="code-str">"육고기"</span>, variable=food, value=<span class="code-num">1</span>)
rb_seafood = Radiobutton(root, text=<span class="code-str">"해산물"</span>, variable=food, value=<span class="code-num">2</span>)
rb_meat.pack()
rb_seafood.pack()
root.mainloop()</code></pre>
                    </div>
                    <div class="code-block-wrapper">
                        <div class="code-header"><span class="code-lang">PYTHON</span><span>Listbox 예제</span></div>
                        <pre><code><span class="code-keyword">def</span> <span class="code-def">show_selected</span>(event):
    selection = lang_lb.curselection()
    <span class="code-keyword">if</span> selection:
        result_lbl.config(text=<span class="code-str">"선택한 항목: "</span> + lang_lb.get(selection[<span class="code-num">0</span>]))

root = Tk()
lang_lb = Listbox(root, height=<span class="code-num">5</span>)
lang_lb.pack(padx=<span class="code-num">10</span>, pady=<span class="code-num">10</span>)
<span class="code-keyword">for</span> item <span class="code-keyword">in</span> [<span class="code-str">"Python"</span>, <span class="code-str">"Java"</span>, <span class="code-str">"JavaScript"</span>, <span class="code-str">"C"</span>, <span class="code-str">"C++"</span>]:
    lang_lb.insert(END, item)
lang_lb.bind(<span class="code-str">"&lt;&lt;ListboxSelect&gt;&gt;"</span>, show_selected)
result_lbl = Label(root, text=<span class="code-str">""</span>)
result_lbl.pack(pady=<span class="code-num">10</span>)
root.mainloop()</code></pre>
                    </div>

                    <!-- 10차시 -->
                    <h1 class="chapter-h1" style="margin-top: 50px;">📐 [10차시] 배치 관리자 공통 개념 및 레이아웃</h1>
                    <div class="tip-callout">
                        <b>🎯 학습 목표:</b> 모든 위젯이 부모 위젯 안에 배치되는 원리를 이해하고, pack(), grid(), place() 배치 관리자의 차이를 익힌다.
                    </div>
                    <div class="code-block-wrapper">

<span class="code-keyword">def</span> <span class="code-def">exit_app</span>():

        // 초기 화면 렌더링 (Tkinter 선택)
        document.getElementById('lesson-content').innerHTML = lessons.lesson2.html;

        function selectLesson(lessonKey, element) {
            const lesson = lessons[lessonKey];
            document.getElementById('topic-icon').innerText = lesson.icon;
            document.getElementById('topic-title').innerText = lesson.title;
            document.getElementById('lesson-content').innerHTML = lesson.html;

            const menuItems = document.querySelectorAll('.menu-item');
            menuItems.forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('web-article-view').scrollTop = 0;
        }
    </script>
