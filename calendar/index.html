        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        .header-title-box {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .month-nav-btn {
            background: #f1f5f9;
            border: none;
            color: #475569;
            font-size: 18px;
            font-weight: bold;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .month-nav-btn:hover {
            background: #e2e8f0;
            color: #0f172a;
        }
        .calendar-title {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
        }
        .calendar-info {
            font-size: 13px;
            color: #64748b;
        }
        
        /* 범례 (Legend) */
        .legend-box {
            display: flex;
            gap: 12px;
            font-size: 13px;
            font-weight: 600;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        /* 달력 그리드 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background-color: #e2e8f0;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .day-name {
            background-color: #f8fafc;
            text-align: center;
            padding: 12px 0;
            font-weight: 700;
            font-size: 14px;
            color: #475569;
        }
        .day-name.sun { color: #dc2626; }
        .day-name.sat { color: #2563eb; }

        .day-cell {
            background-color: #ffffff;
            min-height: 150px;
            padding: 8px;
            display: flex;
            flex-direction: column;
        }
        .day-cell.other-month {
            background-color: #fcfcfd;
            color: #cbd5e1;
        }
        
        .date-number {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #334155;
            display: inline-block;
        }
        .day-cell:nth-child(7n+1) .date-number { color: #ef4444; } /* 일요일 빨간색 */
        .day-cell:nth-child(7n) .date-number { color: #3b82f6; }   /* 토요일 파란색 */
        .other-month .date-number { color: #cbd5e1 !important; }

            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }
        .event-badge {

            font-size: 12px;
            line-height: 1.4;
            border: 1px solid transparent;
            word-break: break-all;

        let currentYear = 2026;
        let currentMonth = 10; // 10: 10월, 11: 11월, 12: 12월

        function changeMonth(step) {
            currentMonth += step;
            if (currentMonth > 12) currentMonth = 12;
            if (currentMonth < 10) currentMonth = 10;
            renderCalendar();
        }

        function renderCalendar() {
            const titleEl = document.getElementById('current-month-title');
            titleEl.innerText = `${currentYear}년 ${currentMonth}월`;

            const gridEl = document.getElementById('calendar-grid');
            
            // 기존 셀 삭제 (요일 헤더는 유지)
            const cells = gridEl.querySelectorAll('.day-cell');
            cells.forEach(cell => cell.remove());

            // 1일의 요일 파악 및 말일 파악
            const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay(); 
            const lastDate = new Date(currentYear, currentMonth, 0).getDate();
            const prevMonthLastDate = new Date(currentYear, currentMonth - 1, 0).getDate();

            // 이전 달 빈 칸 그리기
            for (let i = firstDay - 1; i >= 0; i--) {
                const dayNum = prevMonthLastDate - i;
                const cell = document.createElement('div');
                cell.className = 'day-cell other-month';
                cell.innerHTML = `<div class="date-number">${dayNum}</div>`;
                gridEl.appendChild(cell);
            }

            // 현재 달 날짜 그리기
            for (let day = 1; day <= lastDate; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                
                // YYYY-MM-DD 포맷 생성
                const monthStr = currentMonth.toString().padStart(2, '0');
                const dayStr = day.toString().padStart(2, '0');
                const currentDateStr = `${currentYear}-${monthStr}-${dayStr}`;

                let html = `<div class="date-number">${day}</div>`;
                html += `<div class="event-list">`;

                // ★ 중요 수정사항 ★
                // 일정이 시작하는 날짜(start_date)에만 한 번 배지를 출력합니다.
                const dayEvents = eventsData.filter(evt => evt.start_date === currentDateStr);
                
                dayEvents.forEach(evt => {
                    const timeBadge = evt.time ? `<span class="evt-time">${evt.time}</span>` : '';
                    
                    // 시작일과 종료일이 다를 경우(예: 10/2~10/11) 기간 텍스트를 따로 만들어 줍니다.
                    let durationBadge = '';
                    if (evt.start_date !== evt.end_date) {
                        const sDate = new Date(evt.start_date);
                        const eDate = new Date(evt.end_date);
                        durationBadge = `<span class="evt-duration">${sDate.getMonth()+1}/${sDate.getDate()}~${eDate.getMonth()+1}/${eDate.getDate()}</span>`;
                    }

                    html += `
                        <div class="event-badge" style="background-color: ${evt.bg_color}; color: ${evt.text_color}; border-color: ${evt.text_color}40;">
                            <strong>[${evt.type}] ${evt.student}</strong> ${timeBadge}<br>
                            ${evt.univ.replace(/\(.*?\)/g, '')} ${durationBadge}<br>
                            <span style="font-size:10.5px; color:#64748b;">${evt.dept}</span>
                        </div>
                    `;
                });

                html += `</div>`;
                cell.innerHTML = html;
                gridEl.appendChild(cell);
            }

            // 다음 달 빈 칸 그리기 (그리드가 7칸씩 꽉 차도록)
            const totalCells = firstDay + lastDate;
            const remainingCells = (7 - (totalCells % 7)) % 7;
            
            for (let day = 1; day <= remainingCells; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell other-month';
                cell.innerHTML = `<div class="date-number">${day}</div>`;
                gridEl.appendChild(cell);
            }
        }

        // 초기 렌더링 (10월)
        window.onload = renderCalendar;
